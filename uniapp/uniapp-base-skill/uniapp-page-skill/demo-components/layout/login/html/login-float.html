<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页 - 浮动圆形背景 + 滑动切换登录方式</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #4a90e2;
      --color-primary-dark: #3a7bd5;
      --color-primary-light: #6bb3ff;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: #f0f2f5;
      --color-bg: #f5f7fa;
      --color-surface: #fafafa;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-md: 0 8px 32px rgba(0,0,0,0.1);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }

    .phone {
      max-width: 375px;
      margin: 20px auto;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      position: relative;
      min-height: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px var(--space-5);
    }

    /* 背景层 */
    .bg-layer {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #1a1f3a 0%, #2d3a6b 50%, #1a1f3a 100%);
      z-index: 0;
    }

    /* 浮动圆形装饰 */
    .float-circles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.18;
    }
    .circle-1 {
      width: 280px; height: 280px;
      background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
      top: -80px; right: -80px;
      animation: float 8s ease-in-out infinite;
    }
    .circle-2 {
      width: 200px; height: 200px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      bottom: 120px; left: -60px;
      animation: float 10s ease-in-out infinite reverse;
    }
    .circle-3 {
      width: 150px; height: 150px;
      background: linear-gradient(135deg, #a78bfa, var(--color-primary));
      top: 45%; right: -30px;
      animation: float 12s ease-in-out infinite;
    }
    .circle-4 {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, var(--color-primary-light), #a78bfa);
      bottom: 60px; right: 50px;
      animation: float 7s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(8deg); }
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* 头部 Logo */
    .login-header {
      text-align: center;
      margin-bottom: var(--space-5);
    }
    .logo-wrap {
      width: 88px; height: 88px;
      margin: 0 auto var(--space-4);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .logo-wrap svg { width: 44px; height: 44px; color: white; }
    .app-name { font-size: 28px; font-weight: 700; color: white; letter-spacing: 2px; margin-bottom: 8px; }
    .app-slogan { font-size: 13px; color: rgba(255,255,255,0.75); font-weight: 300; }

    /* 登录卡片 */
    .login-card {
      width: 100%;
      background: rgba(255,255,255,0.96);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* 切换 Tab */
    .login-tabs {
      position: relative;
      display: flex;
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: var(--space-5);
    }
    .login-tab {
      flex: 1;
      height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-secondary);
      cursor: pointer;
      border-radius: var(--space-2);
      transition: color 0.2s;
      position: relative;
      z-index: 1;
    }
    .login-tab.active { color: var(--color-primary); font-weight: 600; }
    .tab-slider {
      position: absolute;
      top: 4px; bottom: 4px;
      width: calc(50% - 4px);
      background: white;
      border-radius: var(--space-2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.3s ease;
      z-index: 0;
    }

    /* 可滑动面板容器 */
    .panels-wrap {
      width: 100%;
      overflow: hidden;
    }
    .login-panels {
      display: flex;
      width: 200%;
      transition: transform 0.3s ease;
      will-change: transform;
    }
    .login-panel {
      width: 50%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 200px;
    }

    .btn {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
      color: white;
      box-shadow: 0 6px 18px rgba(74, 144, 226, 0.35);
    }
    .btn-primary:active { transform: scale(0.98); box-shadow: 0 3px 10px rgba(74, 144, 226, 0.25); }
    .btn-wechat {
      background: linear-gradient(135deg, #07c160 0%, #05a350 100%);
      color: white;
      box-shadow: 0 6px 18px rgba(7, 193, 96, 0.3);
    }
    .btn-wechat:active { transform: scale(0.98); box-shadow: 0 3px 10px rgba(7, 193, 96, 0.2); }
    .btn-wechat svg { width: 20px; height: 20px; margin-right: 8px; }

    .wechat-tips {
      text-align: center;
      font-size: 13px;
      color: var(--color-text-tertiary);
      margin-top: var(--space-4);
      line-height: 1.6;
    }

    .form-item { margin-bottom: var(--space-4); }
    .form-input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--color-border);
      border-radius: var(--space-2);
      padding: 0 var(--space-3);
      font-size: 15px;
      color: var(--color-text);
      outline: none;
      background: var(--color-surface);
      transition: all 0.2s;
    }
    .form-input:focus { border-color: var(--color-primary); background: white; }
    .form-input::placeholder { color: var(--color-text-tertiary); }

    .code-row { display: flex; gap: var(--space-3); }
    .code-row .form-input { flex: 1; }
    .code-btn {
      flex-shrink: 0;
      height: 48px;
      padding: 0 var(--space-4);
      background: transparent;
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
      border-radius: var(--space-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .agreement {
      text-align: center;
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin-top: var(--space-5);
      line-height: 1.6;
    }
    .agreement span { color: var(--color-primary); cursor: pointer; }

    .param-bar {
      background: #fafafa;
      padding: var(--space-4);
      margin: var(--space-4) auto;
      max-width: 375px;
      border: 1px solid #e8e8e8;
    }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-3); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bg-layer"></div>

    <div class="float-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
      <div class="circle circle-4"></div>
    </div>

    <div class="content">
      <div class="login-header">
        <div class="logo-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="app-name">考拉搞AI</div>
        <div class="app-slogan">让 AI 成为你的超级助手</div>
      </div>

      <div class="login-card">
        <div class="login-tabs">
          <div class="tab-slider"></div>
          <div class="login-tab active" data-tab="0">微信登录</div>
          <div class="login-tab" data-tab="1">手机号登录</div>
        </div>

        <div class="panels-wrap">
          <div class="login-panels" id="loginPanels">
            <!-- 微信登录面板 -->
            <div class="login-panel">
              <div class="btn btn-wechat">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.08 3.56 2.78 4.66L4 17l2.5-1.5c.89.31 1.87.5 2.91.5.33 0 .65-.03.96-.08-.14-.47-.22-.97-.22-1.48 0-3.46 3.28-6.27 7.32-6.27.27 0 .53.02.79.05C17.86 5.92 14.18 4 9.5 4zm-2.6 4.55c-.47 0-.85-.38-.85-.85 0-.47.38-.85.85-.85.47 0 .85.38.85.85 0 .47-.38.85-.85.85zm5.2 0c-.47 0-.85-.38-.85-.85 0-.47.38-.85.85-.85.47 0 .85.38.85.85 0 .47-.38.85-.85.85z"/><path d="M22 14.18c0-2.7-2.6-4.9-5.82-4.9-3.21 0-5.82 2.2-5.82 4.9 0 2.71 2.61 4.91 5.82 4.91.69 0 1.35-.1 1.96-.27L20.5 21l-.55-2.04c1.27-.9 2.05-2.22 2.05-3.78zm-7.73-.6c-.36 0-.66-.3-.66-.66 0-.37.3-.66.66-.66.37 0 .66.3.66.66 0 .37-.3.66-.66.66zm3.82 0c-.36 0-.66-.3-.66-.66 0-.37.3-.66.66-.66.37 0 .66.3.66.66 0 .37-.29.66-.66.66z"/></svg>
                微信一键登录
              </div>
              <div class="wechat-tips">
                点击上方按钮，授权微信账号快速登录
              </div>
            </div>

            <!-- 手机号登录面板 -->
            <div class="login-panel">
              <div class="form-item">
                <input class="form-input" type="tel" placeholder="请输入手机号" readonly>
              </div>

              <div class="form-item">
                <div class="code-row">
                  <input class="form-input" type="text" placeholder="请输入验证码" readonly>
                  <div class="code-btn">获取验证码</div>
                </div>
              </div>

              <div class="btn btn-primary">立即登录</div>
            </div>
          </div>
        </div>

        <div class="agreement">
          登录即代表同意<span>《用户协议》</span>和<span>《隐私政策》</span>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">深色背景 + 浮动圆形渐变 + 毛玻璃 Logo + 滑动切换登录方式</span></div>
    <div class="param-row"><span class="param-key">bg:</span><span class="param-val">4 个不同大小/颜色的圆形，translateY + rotate 浮动动画</span></div>
    <div class="param-row"><span class="param-key">tab:</span><span class="param-val">微信登录 / 手机号登录 点击 + 手势滑动切换</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">社交、内容、社区类 App 登录页</span></div>
  </div>

  <script>
    (function() {
      const tabs = document.querySelectorAll('.login-tab');
      const slider = document.querySelector('.tab-slider');
      const panels = document.getElementById('loginPanels');
      const panelsWrap = document.querySelector('.panels-wrap');
      let activeIndex = 0;
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      function switchTo(index) {
        activeIndex = index;
        tabs.forEach((t, i) => t.classList.toggle('active', i === index));
        slider.style.transform = 'translateX(' + (index * 100) + '%)';
        panels.style.transform = 'translateX(-' + (index * 50) + '%)';
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => switchTo(index));
      });

      panelsWrap.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        isDragging = true;
      }, { passive: true });

      panelsWrap.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        currentX = e.touches[0].clientX;
      }, { passive: true });

      panelsWrap.addEventListener('touchend', function() {
        if (!isDragging) return;
        isDragging = false;
        const diff = startX - currentX;
        if (Math.abs(diff) > 40) {
          if (diff > 0 && activeIndex < tabs.length - 1) {
            switchTo(activeIndex + 1);
          } else if (diff < 0 && activeIndex > 0) {
            switchTo(activeIndex - 1);
          }
        }
        currentX = 0;
      });
    })();
  </script>
</body>
</html>
