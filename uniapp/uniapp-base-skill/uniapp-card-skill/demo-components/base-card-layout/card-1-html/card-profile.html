<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* 主题变量 - 来自 uniapp-style-skill */
      --color-primary: #07c160;
      --color-bg-surface: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --radius-md: 12px;
      --spacing-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    }
    body { background: #f0f0f0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: 16px; }
    .card { background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .profile-cover { height: 100px; background: url('https://picsum.photos/seed/cover1/375/100') center/cover; position: relative; }
    .profile-cover::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,transparent,rgba(0,0,0,0.3)); }
    .profile-main { padding: 0 16px 16px; position: relative; }
    .profile-avatar { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; margin-top: -35px; position: relative; z-index: 1; object-fit: cover; background: #fff; }
    .profile-info { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 8px; }
        .profile-name { font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .profile-id { font-size: 12px; color: #999; margin-top: 2px; }
    .profile-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 12px; border-radius: 12px; margin-top: 6px; }
    .profile-edit { padding: 6px 16px; border: 1px solid #e0e0e0; background: #fff; border-radius: 16px; font-size: 13px; color: #666; }
    .profile-stats { display: flex; padding: 16px 0; border-top: 1px solid #f5f5f5; margin-top: 12px; }
    .stat-item { flex: 1; text-align: center; border-right: 1px solid #f5f5f5; }
    .stat-item:last-child { border-right: none; }
    .stat-value { font-size: 18px; font-weight: 700; color: #1a1a1a; }
    .stat-label { font-size: 12px; color: #999; margin-top: 2px; }
    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">个人中心</div>
    <div class="preview-body">
      <div class="card">
        <div class="profile-cover"></div>
        <div class="profile-main">
          <img class="profile-avatar" src="https://picsum.photos/seed/avatar99/70/70" alt="头像">
          <div class="profile-info">
            <div class="profile-left">
              <div class="profile-name">考拉搞AI</div>
              <div class="profile-id">ID: 888888</div>
              <div class="profile-badge">VIP会员</div>
            </div>
            <button class="profile-edit">编辑资料</button>
          </div>
          <div class="profile-stats">
            <div class="stat-item">
              <div class="stat-value">1,234</div>
              <div class="stat-label">关注</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">5,678</div>
              <div class="stat-label">粉丝</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">999+</div>
              <div class="stat-label">获赞</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="param-bar">
    <div class="param-title">参数</div>
    <div class="param-row"><span class="param-key">layout:</span><span class="param-val">profile</span></div>
    <div class="param-row"><span class="param-key">headerType:</span><span class="param-val">cover / gradient / simple</span></div>
    <div class="param-row"><span class="param-key">showStats:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">showBadge:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">showEdit:</span><span class="param-val">true / false</span></div>
  </div>
</body>
</html>
