<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-input 前缀图标场景 - 参考图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-md: 8px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-bg: #F5F7FA;
      --color-bg-soft: #F2F4F7;
      --color-surface: #fff;
      --color-primary: #4A90E2;
      --color-text: #1A1A1A;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-border: #F0F2F5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    }
    body { background: #f5f5f5; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .title { text-align: center; margin-bottom: 10px; font-size: 14px; color: #666; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); overflow: hidden; min-height: 700px; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

    .form-card {
      background: var(--color-surface);
      border-radius: 0;
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .form-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: var(--space-3); }

    .input-item { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-3); }
    .input-item:last-child { margin-bottom: 0; }
    .input-label { font-size: 13px; color: var(--color-text-secondary); font-weight: 500; }

    .input-body {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
    }

    .prefix-icon { width: 18px; height: 18px; color: var(--color-text-tertiary); flex-shrink: 0; }
    .prefix-text { font-size: 14px; color: var(--color-text); flex-shrink: 0; }

    .input-control {
      flex: 1;
      font-size: 14px;
      color: var(--color-text);
      background: transparent;
      border: none;
      outline: none;
      height: 44px;
      line-height: 44px;
      min-width: 0;
    }
    .input-control::placeholder { color: var(--color-text-tertiary); }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; max-width: 375px; margin-left: auto; margin-right: auto; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: #1890ff; width: 110px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="title">参考: base-input 前缀图标场景</div>
  <div class="preview">
    <div class="preview-header">账号信息</div>
    <div class="preview-body">
      <div class="form-card">
        <div class="form-title">前缀场景</div>

        <!-- 邮箱 - 前缀 icon -->
        <div class="input-item">
          <label class="input-label">邮箱（icon 前缀）</label>
          <div class="input-body">
            <svg class="prefix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
            <input class="input-control" placeholder="请输入邮箱">
          </div>
        </div>

        <!-- 手机号 - 前缀文本 +86 -->
        <div class="input-item">
          <label class="input-label">手机号（文本前缀）</label>
          <div class="input-body">
            <span class="prefix-text">+86</span>
            <input class="input-control" placeholder="请输入手机号" style="border-left:1px solid var(--color-border); padding-left:8px;">
          </div>
        </div>

        <!-- 金额 - 前缀 ¥ -->
        <div class="input-item">
          <label class="input-label">提现金额（符号前缀）</label>
          <div class="input-body">
            <span class="prefix-text" style="font-weight:600;">¥</span>
            <input class="input-control" placeholder="请输入金额">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-input Slots</div>
    <div class="param-row"><span class="param-key">slot prefix:</span><span class="param-val">SVG 图标 / 文本 / 符号</span></div>
    <div class="param-row"><span class="param-key">典型场景:</span><span class="param-val">邮箱、手机号（带区号）、金额、搜索</span></div>
  </div>
</body>
</html>
