<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单选 - 列表带描述</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .preview-body { padding: var(--space-4); }

    .radio-list-item { display: flex; align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); cursor: pointer; }
    .radio-list-item:last-child { border-bottom: none; }
    .radio-list-radio {
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 50%;
      margin-right: var(--space-3);
      flex-shrink: 0;
      position: relative;
      transition: all 0.2s;
    }
    .radio-list-item.selected .radio-list-radio { border-color: var(--color-primary); }
    .radio-list-radio::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--color-primary);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s;
    }
    .radio-list-item.selected .radio-list-radio::after { transform: translate(-50%, -50%) scale(1); }
    .radio-list-content { flex: 1; }
    .radio-list-title { font-size: 15px; color: var(--color-text); font-weight: 500; }
    .radio-list-desc { font-size: 13px; color: var(--color-text-tertiary); margin-top: 2px; }
    .radio-list-arrow { color: #ccc; font-size: 18px; }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-body">
      <div class="radio-list-item selected" onclick="selectList(this)">
        <div class="radio-list-radio"></div>
        <div class="radio-list-content">
          <div class="radio-list-title">顺丰快递</div>
          <div class="radio-list-desc">时效最快，专属客服</div>
        </div>
        <span class="radio-list-arrow">›</span>
      </div>

      <div class="radio-list-item" onclick="selectList(this)">
        <div class="radio-list-radio"></div>
        <div class="radio-list-content">
          <div class="radio-list-title">圆通快递</div>
          <div class="radio-list-desc">价格实惠，覆盖广泛</div>
        </div>
        <span class="radio-list-arrow">›</span>
      </div>

      <div class="radio-list-item" onclick="selectList(this)">
        <div class="radio-list-radio"></div>
        <div class="radio-list-content">
          <div class="radio-list-title">中通快递</div>
          <div class="radio-list-desc">性价比高</div>
        </div>
        <span class="radio-list-arrow">›</span>
      </div>

      <div class="radio-list-item" onclick="selectList(this)">
        <div class="radio-list-radio"></div>
        <div class="radio-list-content">
          <div class="radio-list-title">韵达快递</div>
          <div class="radio-list-desc">时效稳定</div>
        </div>
        <span class="radio-list-arrow">›</span>
      </div>

      <div class="radio-list-item" onclick="selectList(this)">
        <div class="radio-list-radio"></div>
        <div class="radio-list-content">
          <div class="radio-list-title">EMS</div>
          <div class="radio-list-desc">国家邮政，使命必达</div>
        </div>
        <span class="radio-list-arrow">›</span>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title" style="font-size:14px;font-weight:600;color:#333;margin-bottom:12px;">列表式单选</div>
    <div class="param-title">base-radio 参数</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">list</span></div>
    <div class="param-row"><span class="param-key">showArrow:</span><span class="param-val">true</span></div>
  </div>

  <script>
    function selectList(el) {
      document.querySelectorAll('.radio-list-item').forEach(r => r.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
