<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-sm: 8px;
      --radius-full: 999px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --color-primary: #4a90e2;
      --color-text: #333;
      --color-text-secondary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #f0f0f0;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); position: relative; }
    .preview-header { height: 44px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; position: absolute; top: 0; left: 0; right: 0; z-index: 10; color: #fff; }
    .preview-header .icon-box { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; margin-left: 8px; }
    .icon { width: 20px; height: 20px; }
    .preview-body { padding: 0 var(--space-3) var(--space-3); }

    .base-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .base-card:last-child { margin-bottom: 0; }

    .profile-header-card {
      background: linear-gradient(135deg, #a8c8ff 0%, #d4e5ff 100%);
      padding: 60px var(--space-4) var(--space-4);
      position: relative;
      margin: 0 calc(-1 * var(--space-3)) var(--space-3);
      width: calc(100% + 2 * var(--space-3));
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    .profile-user { display: flex; align-items: center; gap: var(--space-3); }
    .profile-avatar { width: 64px; height: 64px; border-radius: var(--radius-full); border: 3px solid rgba(255,255,255,0.5); background: url(../static/images/avatar1.jpg) center/cover; flex-shrink: 0; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 18px; color: #fff; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .profile-id { font-size: 12px; color: rgba(255,255,255,0.9); margin-top: 4px; }

    .stats-card { display: flex; padding: var(--space-4) 0; }
    .stats-item { flex: 1; text-align: center; border-right: 1px solid var(--color-border); }
    .stats-item:last-child { border-right: none; }
    .stats-value { font-size: 20px; color: var(--color-text); font-weight: 600; }
    .stats-label { font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; }

    .vip-card { background: linear-gradient(135deg, #2c2c2c 0%, #4a4a4a 100%); padding: var(--space-4); color: #fff; }
    .vip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    .vip-title { font-size: 16px; font-weight: 600; }
    .vip-more { font-size: 12px; color: rgba(255,255,255,0.7); }
    .vip-benefits { display: flex; justify-content: space-around; }
    .vip-benefit { text-align: center; }
    .vip-icon { width: 40px; height: 40px; border-radius: var(--radius-full); background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
    .vip-icon .icon { width: 20px; height: 20px; filter: brightness(0) invert(1); }
    .vip-benefit-name { font-size: 11px; color: rgba(255,255,255,0.8); }

    .grid-card { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); padding: var(--space-4); }
    .grid-item { text-align: center; }
    .grid-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
    .grid-icon .icon { width: 24px; height: 24px; }
    .grid-icon.blue { background: #e6f2ff; }
    .grid-icon.red { background: #fff0f0; }
    .grid-icon.orange { background: #fff4e6; }
    .grid-icon.green { background: #e6fff0; }
    .grid-icon.purple { background: #f0e6ff; }
    .grid-icon.cyan { background: #e6ffff; }
    .grid-icon.yellow { background: #fffbe6; }
    .grid-icon.pink { background: #ffe6f0; }
    .grid-name { font-size: 12px; color: var(--color-text); }

    .order-header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
    .order-title { font-size: 15px; color: var(--color-text); font-weight: 500; }
    .order-more { font-size: 13px; color: var(--color-primary); }
    .order-items { display: flex; justify-content: space-around; padding: var(--space-4) 0; }
    .order-item { text-align: center; position: relative; }
    .order-icon { width: 28px; height: 28px; margin: 0 auto 4px; }
    .order-label { font-size: 12px; color: var(--color-text); }
    .order-badge { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; background: #ff4d4f; color: #fff; font-size: 10px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">
      <div class="icon-box"><img class="icon" src="../static/icons/gift.svg" style="filter: brightness(0) invert(1);"></div>
      <div class="icon-box"><img class="icon" src="../static/icons/message-circle.svg" style="filter: brightness(0) invert(1);"></div>
    </div>
    <div class="preview-body">
      <div class="profile-header-card">
        <div class="profile-user">
          <div class="profile-avatar"></div>
          <div class="profile-info">
            <div class="profile-name">Jisom26823</div>
            <div class="profile-id">宝石ID: ST283918391</div>
          </div>
        </div>
      </div>

      <div class="base-card stats-card">
        <div class="stats-item">
          <div class="stats-value">123</div>
          <div class="stats-label">获赞与收藏</div>
        </div>
        <div class="stats-item">
          <div class="stats-value">293</div>
          <div class="stats-label">我的粉丝</div>
        </div>
        <div class="stats-item">
          <div class="stats-value">762</div>
          <div class="stats-label">我的关注</div>
        </div>
      </div>

      <div class="base-card vip-card">
        <div class="vip-header">
          <span class="vip-title">宝石会员 VIP</span>
          <span class="vip-more">了解更多>></span>
        </div>
        <div class="vip-benefits">
          <div class="vip-benefit">
            <div class="vip-icon"><img class="icon" src="../static/icons/star.svg"></div>
            <div class="vip-benefit-name">会员日</div>
          </div>
          <div class="vip-benefit">
            <div class="vip-icon"><img class="icon" src="../static/icons/gift.svg"></div>
            <div class="vip-benefit-name">奖励翻倍</div>
          </div>
          <div class="vip-benefit">
            <div class="vip-icon"><img class="icon" src="../static/icons/shopping-cart.svg"></div>
            <div class="vip-benefit-name">商品折扣</div>
          </div>
          <div class="vip-benefit">
            <div class="vip-icon"><img class="icon" src="../static/icons/message-circle.svg"></div>
            <div class="vip-benefit-name">悬赏发布</div>
          </div>
          <div class="vip-benefit">
            <div class="vip-icon"><img class="icon" src="../static/icons/map-pin.svg"></div>
            <div class="vip-benefit-name">参与寻石</div>
          </div>
        </div>
      </div>

      <div class="base-card">
        <div class="order-header">
          <span class="order-title">我的订单</span>
          <span class="order-more">查看详情>></span>
        </div>
        <div class="order-items">
          <div class="order-item">
            <div class="order-icon"><img class="icon" src="../static/icons/wallet.svg"></div>
            <div class="order-label">待付款</div>
            <span class="order-badge">3</span>
          </div>
          <div class="order-item">
            <div class="order-icon"><img class="icon" src="../static/icons/package.svg"></div>
            <div class="order-label">待发货</div>
          </div>
          <div class="order-item">
            <div class="order-icon"><img class="icon" src="../static/icons/truck.svg"></div>
            <div class="order-label">待收货</div>
            <span class="order-badge">14</span>
          </div>
          <div class="order-item">
            <div class="order-icon"><img class="icon" src="../static/icons/check.svg"></div>
            <div class="order-label">已完成</div>
          </div>
          <div class="order-item">
            <div class="order-icon"><img class="icon" src="../static/icons/rotate-ccw.svg"></div>
            <div class="order-label">退货/售后</div>
            <span class="order-badge">5</span>
          </div>
        </div>
      </div>

      <div class="base-card grid-card">
        <div class="grid-item">
          <div class="grid-icon blue"><img class="icon" src="../static/icons/wallet.svg"></div>
          <div class="grid-name">宝石钱包</div>
        </div>
        <div class="grid-item">
          <div class="grid-icon red"><img class="icon" src="../static/icons/star.svg"></div>
          <div class="grid-name">我的宝石库</div>
        </div>
        <div class="grid-item">
          <div class="grid-icon orange"><img class="icon" src="../static/icons/clock.svg"></div>
          <div class="grid-name">浏览记录</div>
        </div>
        <div class="grid-item">
          <div class="grid-icon green"><img class="icon" src="../static/icons/rotate-ccw.svg"></div>
          <div class="grid-name">我的需求</div>
        </div>
        <div class="grid-item">
          <div class="grid-icon purple"><img class="icon" src="../static/icons/gift.svg"></div>
          <div class="grid-name">我的活动</div>
        </div>
        <div class="grid-item">
          <div class="grid-icon cyan"><img class="icon" src="../static/icons/help-circle.svg"></div>
          <div class="grid-name">问题反馈</div>
        </div>
        <div class="grid-item">
          <div class="grid-icon yellow"><img class="icon" src="../static/icons/phone.svg"></div>
          <div class="grid-name">在线客服</div>
        </div>
        <div class="grid-item">
          <div class="grid-icon pink"><img class="icon" src="../static/icons/settings.svg"></div>
          <div class="grid-name">更多设置</div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">radius:</span><span class="param-val">var(--radius-lg) 12px</span></div>
    <div class="param-row"><span class="param-key">margin:</span><span class="param-val">var(--space-3) 12px</span></div>
    <div class="param-row"><span class="param-key">shadow:</span><span class="param-val">var(--shadow-sm)</span></div>
    <div class="param-row"><span class="param-key">gradient:</span><span class="param-val">头部/VIP 使用渐变背景卡片</span></div>
  </div>
</body>
</html>
