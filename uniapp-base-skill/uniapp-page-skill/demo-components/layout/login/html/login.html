<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页 - 标准账号登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #4a90e2;
      --color-primary-light: #6bb3ff;
      --color-bg: #f5f7fa;
      --color-surface: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: #f0f2f5;
      --color-danger: #ff4d4f;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-full: 999px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
    }
    body {
      background: var(--color-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }

    .phone {
      max-width: 375px;
      margin: 20px auto;
      background: var(--color-bg);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      position: relative;
      min-height: 760px;
      padding: 80px var(--space-5) var(--space-6);
    }

    /* Logo 区 */
    .logo-section {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .logo {
      width: 80px; height: 80px;
      margin: 0 auto var(--space-3);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(74, 144, 226, 0.3);
    }
    .app-name { font-size: 22px; font-weight: 700; color: var(--color-text); margin-bottom: 6px; }
    .app-slogan { font-size: 13px; color: var(--color-text-tertiary); }

    /* 登录卡片 */
    .login-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--space-4);
    }

    .form-item {
      margin-bottom: var(--space-4);
    }
    .form-item:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }
    .input-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--color-bg);
      border-radius: var(--radius-md);
      padding: 0 var(--space-3);
      height: 52px;
    }
    .input-wrap svg {
      width: 20px; height: 20px;
      color: var(--color-text-tertiary);
      flex-shrink: 0;
    }
    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--color-text);
      outline: none;
    }
    .input-wrap input::placeholder { color: var(--color-text-tertiary); }
    .eye-icon {
      width: 20px; height: 20px;
      color: var(--color-text-tertiary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
      font-size: 13px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    .remember-box {
      width: 16px; height: 16px;
      border: 1.5px solid var(--color-text-tertiary);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .remember-box.checked {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }
    .remember-box.checked svg { width: 12px; height: 12px; color: white; }
    .forgot-link { color: var(--color-primary); cursor: pointer; }

    .login-btn {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(74, 144, 226, 0.3);
      margin-bottom: var(--space-4);
    }

    .register-link {
      text-align: center;
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-6);
    }
    .register-link span { color: var(--color-primary); font-weight: 500; cursor: pointer; }

    /* 第三方登录 */
    .divider {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
      color: var(--color-text-tertiary);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .social-login {
      display: flex;
      justify-content: center;
      gap: var(--space-6);
      margin-bottom: var(--space-5);
    }
    .social-item {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .social-item svg { width: 24px; height: 24px; }

    /* 协议 */
    .agreement {
      text-align: center;
      font-size: 12px;
      color: var(--color-text-tertiary);
      line-height: 1.6;
    }
    .agreement span { color: var(--color-primary); cursor: pointer; }

    .param-bar {
      background: var(--color-surface);
      padding: var(--space-4);
      margin: var(--space-4) auto;
      max-width: 375px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="logo-section">
      <div class="logo">A</div>
      <div class="app-name">考拉搞AI</div>
      <div class="app-slogan">登录即开启精彩体验</div>
    </div>

    <div class="login-card">
      <div class="form-item">
        <label class="form-label">账号</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" placeholder="请输入账号/手机号/邮箱" readonly>
        </div>
      </div>

      <div class="form-item">
        <label class="form-label">密码</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" placeholder="请输入密码" readonly>
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
    </div>

    <div class="form-options">
      <div class="remember">
        <div class="remember-box checked">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span>记住我</span>
      </div>
      <div class="forgot-link">忘记密码？</div>
    </div>

    <div class="login-btn">登 录</div>

    <div class="register-link">还没有账号？<span>立即注册</span></div>

    <div class="divider">第三方登录</div>

    <div class="social-login">
      <div class="social-item" title="微信">
        <svg viewBox="0 0 24 24" fill="#07C160" stroke="none"><path d="M8.5 13.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/><path d="M17.5 9c0-3.5-3.4-6.5-7.5-6.5S2.5 5.5 2.5 9c0 2.6 1.9 4.8 4.6 5.8-.2.8-.8 2.3-1 2.8 0 0 2.4-1.2 3.4-1.9 2.1.6 4.4.4 6.5-.5 2.4-1 3.5-2.8 3.5-5.2z"/></svg>
      </div>
      <div class="social-item" title="QQ">
        <svg viewBox="0 0 24 24" fill="#12B7F5" stroke="none"><path d="M12 2C7.5 2 4 5.5 4 9c0 2.5 1.3 4.7 3.2 6-.3 1.3-1 3.1-1.5 4.2 0 0 3.5-1 5.3-2.5 2.3.8 5 .6 7.5-.7 2.6-1.4 4.5-4 4.5-7 0-3.5-3.5-7-8-7z"/></svg>
      </div>
      <div class="social-item" title="微博">
        <svg viewBox="0 0 24 24" fill="#E6162D" stroke="none"><path d="M10.3 18.5c-3.8 0-6.8-2.3-6.8-5.2 0-1.4.7-2.8 1.9-3.8-.1-.5-.2-1-.2-1.5 0-3.2 3.1-5.8 7-5.8 3.5 0 6.4 2.1 6.9 4.9.5-.1 1-.2 1.6-.2 3.3 0 6 2.5 6 5.5s-2.7 5.5-6 5.5c-.8 0-1.6-.1-2.3-.4-1.1 1.2-3.2 2-5.1 2z"/></svg>
      </div>
    </div>

    <div class="agreement">
      登录即代表您同意<span>《用户协议》</span>和<span>《隐私政策》</span>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">标准账号登录页：Logo + 输入卡片 + 主按钮 + 第三方登录</span></div>
    <div class="param-row"><span class="param-key">input:</span><span class="param-val">图标 + 输入框 + 密码可见切换</span></div>
    <div class="param-row"><span class="param-key">btn:</span><span class="param-val">渐变主按钮，圆角胶囊，带投影</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">通用 App 账号密码登录</span></div>
  </div>
</body>
</html>
