<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页 - 极简清爽</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #4a90e2;
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: #e8e8e8;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
    }
    body {
      background: var(--color-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }

    .phone {
      max-width: 375px;
      margin: 20px auto;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      min-height: 760px;
      padding: 60px var(--space-5) var(--space-6);
      display: flex;
      flex-direction: column;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-6);
    }
    .header-logo .logo-icon {
      width: 32px; height: 32px;
      background: var(--color-primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-logo .logo-icon svg { width: 18px; height: 18px; color: white; }
    .header-logo .logo-text { font-size: 18px; font-weight: 700; color: var(--color-text); }

    .page-title { font-size: 28px; font-weight: 700; color: var(--color-text); margin-bottom: 8px; }
    .page-subtitle { font-size: 14px; color: var(--color-text-tertiary); margin-bottom: var(--space-6); }

    .form-item { margin-bottom: var(--space-5); }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-3);
    }
    .form-input {
      width: 100%;
      height: 48px;
      border: none;
      border-bottom: 1px solid var(--color-border);
      font-size: 16px;
      color: var(--color-text);
      outline: none;
      background: transparent;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-bottom-color: var(--color-primary); }
    .form-input::placeholder { color: var(--color-text-tertiary); }

    .login-btn {
      width: 100%;
      height: 48px;
      background: var(--color-primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      margin-top: var(--space-6);
      margin-bottom: var(--space-4);
      letter-spacing: 2px;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .form-footer span { color: var(--color-primary); cursor: pointer; }

    .agreement {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      color: var(--color-text-tertiary);
      padding-top: var(--space-6);
    }
    .agreement span { color: var(--color-primary); cursor: pointer; }

    .param-bar {
      background: #fafafa;
      padding: var(--space-4);
      margin: var(--space-4) auto;
      max-width: 375px;
      border: 1px solid var(--color-border);
    }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-3); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="logo-text">考拉搞AI</div>
    </div>

    <div class="page-title">欢迎回来</div>
    <div class="page-subtitle">请登录您的账号</div>

    <div class="form-item">
      <label class="form-label">账号</label>
      <input class="form-input" type="text" placeholder="请输入账号" readonly>
    </div>

    <div class="form-item">
      <label class="form-label">密码</label>
      <input class="form-input" type="password" placeholder="请输入密码" readonly>
    </div>

    <div class="login-btn">登 录</div>

    <div class="form-footer">
      <span>忘记密码？</span>
      <span>注册账号</span>
    </div>

    <div class="agreement">
      登录即代表同意<span>《用户协议》</span>和<span>《隐私政策》</span>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">极简清爽：无圆角/小圆角、头部 Logo、下划线输入框</span></div>
    <div class="param-row"><span class="param-key">input:</span><span class="param-val">下划线输入框，聚焦变色</span></div>
    <div class="param-row"><span class="param-key">btn:</span><span class="param-val">直角主按钮，无投影</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">工具类、B端、清爽风格 App</span></div>
  </div>
</body>
</html>
