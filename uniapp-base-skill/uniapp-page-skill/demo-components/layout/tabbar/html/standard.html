<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义底部 - 标准图标文字 TabBar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #4a90e2;
      --color-bg: #f5f7fa;
      --color-surface: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: #f0f2f5;
      --radius-lg: 16px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --shadow-top: 0 -2px 12px rgba(0,0,0,0.04);
    }
    body { background: var(--color-bg); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

    .phone { max-width: 375px; margin: 20px auto; background: var(--color-bg); border-radius: 32px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.12); position: relative; height: 700px; }

    .content {
      height: 100%;
      overflow-y: auto;
      padding: 60px var(--space-4) 100px;
    }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: var(--space-4); color: var(--color-text); }
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--color-text); }
    .card p { font-size: 13px; color: var(--color-text-secondary); }

    /* 标准图标文字 TabBar */
    .tabbar-standard {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 64px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      box-shadow: var(--shadow-top);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--color-text-tertiary);
      font-size: 11px;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item.active { color: var(--color-primary); }

    .param-bar { background: var(--color-surface); padding: var(--space-4); margin: var(--space-4) auto; max-width: 375px; border-radius: var(--radius-lg); box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 80px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="content">
      <div class="page-title">工作台</div>
      <div class="card"><h3>待办事项</h3><p>今日有 3 个任务待处理</p></div>
      <div class="card"><h3>消息通知</h3><p>收到 2 条新消息</p></div>
      <div class="card"><h3>数据概览</h3><p>本周访问量比上周增长 12%</p></div>
    </div>

    <!-- 标准图标文字 TabBar -->
    <div class="tabbar-standard">
      <div class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>发现</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>消息</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">标准图标 + 文字 + 顶部细线</span></div>
    <div class="param-row"><span class="param-key">active:</span><span class="param-val">主色高亮，其余灰色</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">通用性最强，适合大多数 App</span></div>
  </div>
</body>
</html>
