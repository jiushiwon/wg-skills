<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配置卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* 主题变量 - 来自 uniapp-style-skill */
      --color-primary: #07c160;
      --color-bg-surface: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --radius-md: 12px;
      --spacing-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    }
    body { background: #f0f0f0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: 16px; }
    .card { background: #fff; border-radius: var(--radius-md); box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a1a; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
    .set-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; }
    .set-item:last-child { border-bottom: none; }
    .set-icon { width: 24px; height: 24px; margin-right: 12px; display: flex; align-items: center; justify-content: center; }
    .set-icon img { width: 20px; height: 20px; }
    .set-label { flex: 1; font-size: 15px; color: #1a1a1a; }
    .set-arrow { color: #ccc; font-size: 16px; }
    .set-switch { width: 44px; height: 24px; background: #ccc; border-radius: 12px; position: relative; }
    .set-switch.on { background: var(--color-primary); }
    .set-switch::after { content:''; position:absolute; width:20px; height:20px; background:#fff; border-radius:50%; top:2px; left:2px; }
    .set-switch.on::after { left: 22px; }
    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">配置卡片</div>
    <div class="preview-body">
      <div class="card">
        <div class="card-title">设置</div>
        <div class="set-item">
          <div class="set-icon"><img src="https://api.iconify.design/mdi/bell.svg?color=%23555" alt=""></div>
          <span class="set-label">消息通知</span>
          <span class="set-switch on"></span>
        </div>
        <div class="set-item">
          <div class="set-icon"><img src="https://api.iconify.design/mdi/volume-high.svg?color=%23555" alt=""></div>
          <span class="set-label">声音</span>
          <span class="set-switch"></span>
        </div>
        <div class="set-item">
          <div class="set-icon"><img src="https://api.iconify.design/mdi/account.svg?color=%23555" alt=""></div>
          <span class="set-label">个人资料</span>
          <span class="set-arrow">></span>
        </div>
      </div>
    </div>
  </div>
  <div class="param-bar">
    <div class="param-title">参数</div>
    <div class="param-row"><span class="param-key">layout:</span><span class="param-val">set</span></div>
    <div class="param-row"><span class="param-key">itemType:</span><span class="param-val">switch / arrow / button</span></div>
    <div class="param-row"><span class="param-key">showIcon:</span><span class="param-val">true / false</span></div>
  </div>
</body>
</html>
