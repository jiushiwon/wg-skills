<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* 主题变量 - 来自 uniapp-style-skill */
      --color-primary: #07c160;
      --color-bg-surface: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --radius-md: 12px;
      --spacing-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    }
    body { background: #f0f0f0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: 16px; }
    .card { background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-img { width: 100%; height: 120px; object-fit: cover; }
    .card-body { padding: 12px; }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #666; line-height: 1.5; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .card-meta { display: flex; align-items: center; gap: 8px; }
    .card-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    .card-name { font-size: 12px; color: #666; }
    .card-time { font-size: 11px; color: #999; }
    .card-tag { display: inline-block; padding: 3px 8px; font-size: 11px; background: rgba(7, 193, 96, 0.1); color: #07c160; border-radius: 10px; }
    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">图片卡片</div>
    <div class="preview-body">
      <div class="card">
        <img class="card-img" src="https://picsum.photos/seed/card1/375/180" alt="封面图">
        <div class="card-body">
          <div class="card-title">标题文字内容</div>
          <div class="card-desc">这是卡片的描述内容，可以是两行或者多行文字。</div>
          <div class="card-footer">
            <div class="card-meta">
              <img class="card-avatar" src="https://picsum.photos/seed/av1/24/24" alt="头像">
              <span class="card-name">用户名</span>
            </div>
            <span class="card-time">2小时前</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="param-bar">
    <div class="param-title">参数</div>
    <div class="param-row"><span class="param-key">layout:</span><span class="param-val">image</span></div>
    <div class="param-row"><span class="param-key">imagePosition:</span><span class="param-val">top / left / right</span></div>
    <div class="param-row"><span class="param-key">imageHeight:</span><span class="param-val">80px / 120px / 160px / 200px</span></div>
    <div class="param-row"><span class="param-key">showFooter:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">showTag:</span><span class="param-val">true / false</span></div>
  </div>
</body>
</html>
