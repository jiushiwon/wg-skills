<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页 - 动态渐变背景</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #4a90e2;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: rgba(255,255,255,0.25);
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }

    .phone {
      max-width: 375px;
      margin: 20px auto;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      position: relative;
      min-height: 760px;
      display: flex;
      flex-direction: column;
    }

    /* 动态渐变背景 */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4a90e2);
      background-size: 400% 400%;
      animation: gradient-flow 12s ease infinite;
      z-index: 0;
    }
    @keyframes gradient-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 浮动光晕 */
    .bg-gradient::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
      top: -80px; right: -80px;
      animation: float 8s ease-in-out infinite;
    }
    .bg-gradient::after {
      content: '';
      position: absolute;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      bottom: 100px; left: -60px;
      animation: float 10s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.1); }
    }

    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 80px var(--space-5) var(--space-6);
      display: flex;
      flex-direction: column;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-6);
    }
    .header-logo .logo-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--color-border);
    }
    .header-logo .logo-icon svg { width: 20px; height: 20px; color: white; }
    .header-logo .logo-text { font-size: 18px; font-weight: 700; color: white; }

    .page-title { font-size: 32px; font-weight: 700; color: white; margin-bottom: 8px; }
    .page-subtitle { font-size: 14px; color: rgba(255,255,255,0.75); margin-bottom: var(--space-6); }

    .login-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(16px);
      padding: var(--space-6);
      border-radius: 4px;
      margin-top: auto;
    }

    .form-item { margin-bottom: var(--space-5); }
    .form-item:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-3);
    }
    .form-input {
      width: 100%;
      height: 48px;
      border: none;
      border-bottom: 1px solid var(--color-border);
      font-size: 16px;
      color: var(--color-text);
      outline: none;
      background: transparent;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-bottom-color: var(--color-primary); }
    .form-input::placeholder { color: var(--color-text-tertiary); }

    .login-btn {
      width: 100%;
      height: 48px;
      background: var(--color-primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      margin-top: var(--space-6);
      margin-bottom: var(--space-4);
      letter-spacing: 2px;
      border-radius: 4px;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .form-footer span { color: var(--color-primary); cursor: pointer; }

    .param-bar {
      background: #fafafa;
      padding: var(--space-4);
      margin: var(--space-4) auto;
      max-width: 375px;
      border: 1px solid #e8e8e8;
    }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-3); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bg-gradient"></div>

    <div class="content">
      <div class="header-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
        </div>
        <div class="logo-text">考拉搞AI</div>
      </div>

      <div class="page-title">欢迎</div>
      <div class="page-subtitle">登录以继续使用</div>

      <div class="login-card">
        <div class="form-item">
          <label class="form-label">账号</label>
          <input class="form-input" type="text" placeholder="请输入账号" readonly>
        </div>

        <div class="form-item">
          <label class="form-label">密码</label>
          <input class="form-input" type="password" placeholder="请输入密码" readonly>
        </div>

        <div class="login-btn">登 录</div>

        <div class="form-footer">
          <span>忘记密码</span>
          <span>注册账号</span>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">动态渐变背景 + 毛玻璃登录卡片 + 小圆角</span></div>
    <div class="param-row"><span class="param-key">bg:</span><span class="param-val">400% 渐变位移动画 + 浮动光晕</span></div>
    <div class="param-row"><span class="param-key">card:</span><span class="param-val">白色半透明 + backdrop-filter 毛玻璃</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">创意、社交、年轻化 App</span></div>
  </div>
</body>
</html>
