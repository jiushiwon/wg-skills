<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义底部 - 悬浮药丸 TabBar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #10b981;
      --color-bg: #f5f7fa;
      --color-surface: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --radius-lg: 16px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
    }
    body { background: var(--color-bg); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

    .phone { max-width: 375px; margin: 20px auto; background: var(--color-bg); border-radius: 32px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.12); position: relative; height: 700px; }

    .content {
      height: 100%;
      overflow-y: auto;
      padding: 60px var(--space-4) 120px;
    }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: var(--space-4); color: var(--color-text); }
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--color-text); }
    .card p { font-size: 13px; color: var(--color-text-secondary); }

    /* 悬浮药丸 TabBar */
    .tabbar-floating-pill {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 999px;
      padding: 6px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    .pill-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 999px;
      color: var(--color-text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pill-item:active { transform: scale(0.96); }
    .pill-item svg { width: 18px; height: 18px; }
    .pill-item.active {
      background: var(--color-primary);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .param-bar { background: var(--color-surface); padding: var(--space-4); margin: var(--space-4) auto; max-width: 375px; border-radius: var(--radius-lg); box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 80px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="content">
      <div class="page-title">健康生活</div>
      <div class="card"><h3>今日步数</h3><p>已完成 8,432 步，目标 10,000 步</p></div>
      <div class="card"><h3>饮水记录</h3><p>今日饮水 1,200ml，继续保持</p></div>
      <div class="card"><h3>睡眠分析</h3><p>昨晚睡眠 7 小时 12 分，质量良好</p></div>
    </div>

    <!-- 悬浮药丸 TabBar -->
    <div class="tabbar-floating-pill">
      <div class="pill-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="pill-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>运动</span>
      </div>
      <div class="pill-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">悬浮药丸 + 毛玻璃 + 圆角</span></div>
    <div class="param-row"><span class="param-key">position:</span><span class="param-val">bottom 居中悬浮</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">健康、生活、工具类 App</span></div>
  </div>
  <script>
    document.querySelectorAll('.pill-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.pill-item').forEach(t => t.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
