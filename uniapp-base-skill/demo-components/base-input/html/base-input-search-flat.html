<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-input 搜索栏 - 扁平形（flat 0 + 底边）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-bg: #F5F7FA;
      --color-surface: #fff;
      --color-primary: #4A90E2;
      --color-text: #1A1A1A;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-border: #F0F2F5;
    }
    body { background: #f5f5f5; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .title { text-align: center; margin-bottom: 10px; font-size: 14px; color: #666; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); overflow: hidden; min-height: 700px; }
    .preview-body { padding: var(--space-4); }

    .search-bar {
      background: var(--color-surface);
      border-radius: 0;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 var(--space-3);
      gap: var(--space-2);
    }
    .search-icon { width: 16px; height: 16px; color: var(--color-text-tertiary); flex-shrink: 0; }
    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
      color: var(--color-text);
      min-width: 0;
    }
    .search-input::placeholder { color: var(--color-text-tertiary); }
    .suffix-icon { width: 18px; height: 18px; color: var(--color-text-tertiary); flex-shrink: 0; cursor: pointer; }

    .desc {
      margin-top: var(--space-4);
      padding: var(--space-3);
      background: var(--color-surface);
      border-radius: 8px;
      font-size: 12px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .desc strong { color: var(--color-text); }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; max-width: 375px; margin-left: auto; margin-right: auto; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: #1890ff; width: 110px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="title">参考: base-input 搜索栏 · 扁平（flat）</div>
  <div class="preview">
    <div class="preview-body">

      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input class="search-input" placeholder="搜索...">
        <svg class="suffix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"></path>
        </svg>
      </div>

      <div class="desc">
        <strong>扁平（flat 0 无圆角）</strong> —— 无圆角 + 白色底 + 无边框、无阴影，靠纯白底色与页面背景形成区隔。极简工具类、B 端 App 常见形态（iOS 设置搜索 / Android 系统搜索）。
      </div>

    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-input Props</div>
    <div class="param-row"><span class="param-key">shape:</span><span class="param-val">flat</span></div>
    <div class="param-row"><span class="param-key">radius:</span><span class="param-val">0</span></div>
    <div class="param-row"><span class="param-key">background:</span><span class="param-val">--color-surface（白底，与页面背景形成区隔）</span></div>
    <div class="param-row"><span class="param-key">border:</span><span class="param-val">none</span></div>
    <div class="param-row"><span class="param-key">shadow:</span><span class="param-val">none</span></div>
    <div class="param-row"><span class="param-key">典型场景:</span><span class="param-val">工具类、B 端、iOS 设置搜索、Android 系统搜索</span></div>
  </div>
</body>
</html>
