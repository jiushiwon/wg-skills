<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* 主题变量 - 来自 uniapp-style-skill */
      --color-primary: #07c160;
      --color-bg-surface: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --radius-md: 12px;
      --spacing-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    }
    body { background: #f0f0f0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: 16px; }
    .card { background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-img { width: 100%; height: 160px; object-fit: cover; }
    .card-body { padding: 12px; }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #999; line-height: 1.4; margin-bottom: 8px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-price { font-size: 18px; font-weight: 700; color: #ff4d4f; }
    .card-price::before { content: '¥'; font-size: 13px; }
    .card-btn { display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 12px; font-size: 12px; background: var(--color-primary); color: #fff; border-radius: 14px; border: none; }
    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">商品卡片</div>
    <div class="preview-body">
      <div class="card">
        <img class="card-img" src="https://picsum.photos/seed/product1/375/200" alt="商品图">
        <div class="card-body">
          <div class="card-title">象形·太湖石</div>
          <div class="card-desc">热情奔放的骑士红彷佛给我们注入了源源不断的动力</div>
          <div class="card-footer">
            <span class="card-price">132.0</span>
            <button class="card-btn">加入购物车</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="param-bar">
    <div class="param-title">参数</div>
    <div class="param-row"><span class="param-key">layout:</span><span class="param-val">product</span></div>
    <div class="param-row"><span class="param-key">imageHeight:</span><span class="param-val">120px / 160px / 200px</span></div>
    <div class="param-row"><span class="param-key">showDesc:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">showPrice:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">showBtn:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">btnText:</span><span class="param-val">加入购物车 / 立即购买 / 看相似</span></div>
  </div>
</body>
</html>
