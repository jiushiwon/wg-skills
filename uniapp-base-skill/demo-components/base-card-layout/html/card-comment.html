<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评论卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* 主题变量 - 来自 uniapp-style-skill */
      --color-primary: #07c160;
      --color-bg-surface: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --radius-md: 12px;
      --spacing-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    }
    body { background: #f0f0f0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: 16px; }
    .card { background: #fff; border-radius: var(--radius-md); box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
    .comment-item { padding: 12px; border-bottom: 1px solid #f5f5f5; }
    .comment-item:last-child { border-bottom: none; }
    .comment-header { display: flex; align-items: center; margin-bottom: 8px; }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; object-fit: cover; }
    .comment-info { flex: 1; }
    .comment-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .comment-time { font-size: 12px; color: #999; }
    .comment-content { font-size: 14px; color: #333; line-height: 1.6; }
    .comment-action { display: flex; gap: 16px; margin-top: 8px; }
    .comment-action span { font-size: 12px; color: #999; display: flex; align-items: center; gap: 4px; }
    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">评论卡片</div>
    <div class="preview-body">
      <div class="card">
        <div class="comment-item">
          <div class="comment-header">
            <img class="comment-avatar" src="https://picsum.photos/seed/c1/32/32" alt="头像">
            <div class="comment-info">
              <div class="comment-name">用户A</div>
              <div class="comment-time">2小时前</div>
            </div>
          </div>
          <div class="comment-content">这个产品真的很不错，强烈推荐！</div>
          <div class="comment-action">
            <span><img src="https://api.iconify.design/mdi/heart-outline.svg?color=%23999" style="width:14px;height:14px;"> 12</span>
            <span><img src="https://api.iconify.design/mdi/comment-outline.svg?color=%23999" style="width:14px;height:14px;"> 3</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="param-bar">
    <div class="param-title">参数</div>
    <div class="param-row"><span class="param-key">layout:</span><span class="param-val">comment</span></div>
    <div class="param-row"><span class="param-key">showAction:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">showAvatar:</span><span class="param-val">true / false</span></div>
  </div>
</body>
</html>
