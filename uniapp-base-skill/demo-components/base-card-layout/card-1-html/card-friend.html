<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好友卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* 主题变量 - 来自 uniapp-style-skill */
      --color-primary: #07c160;
      --color-bg-surface: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --radius-md: 12px;
      --spacing-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    }
    body { background: #f0f0f0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: 16px; }
    .card { background: #fff; border-radius: var(--radius-md); box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .card-more { font-size: 13px; color: #999; }
    .list-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
    .list-item:last-child { border-bottom: none; }
    .item-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; margin-right: 12px; object-fit: cover; }
    .item-content { flex: 1; min-width: 0; }
    .item-name { font-size: 15px; color: #1a1a1a; font-weight: 500; margin-bottom: 2px; }
    .item-desc { font-size: 13px; color: #999; }
    .item-arrow { color: #ccc; font-size: 16px; }
    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">好友卡片</div>
    <div class="preview-body">
      <div class="card">
        <div class="card-header">
          <span class="card-title">我的好友</span>
          <span class="card-more">更多 ></span>
        </div>
        <div class="list-item">
          <img class="item-avatar" src="https://picsum.photos/seed/f1/44/44" alt="头像">
          <div class="item-content">
            <div class="item-name">考拉搞AI</div>
            <div class="item-desc">AI 让生活更美好</div>
          </div>
          <span class="item-arrow">></span>
        </div>
      </div>
    </div>
  </div>
  <div class="param-bar">
    <div class="param-title">参数</div>
    <div class="param-row"><span class="param-key">layout:</span><span class="param-val">friend</span></div>
    <div class="param-row"><span class="param-key">showHeader:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">showArrow:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">avatarSize:</span><span class="param-val">36px / 44px / 56px</span></div>
  </div>
</body>
</html>
