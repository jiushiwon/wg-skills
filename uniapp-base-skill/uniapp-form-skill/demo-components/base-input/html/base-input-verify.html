<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-input 验证码场景 - 参考图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-md: 8px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-bg: #F5F7FA;
      --color-surface: #fff;
      --color-primary: #4A90E2;
      --color-text: #1A1A1A;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-border: #F0F2F5;
      --color-error: #FF4D4F;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    }
    body { background: #f5f5f5; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .title { text-align: center; margin-bottom: 10px; font-size: 14px; color: #666; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); overflow: hidden; min-height: 700px; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

    .form-card {
      background: var(--color-surface);
      border-radius: 0;
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .form-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: var(--space-3); }

    .input-item { display: flex; flex-direction: column; gap: var(--space-1); }
    .input-label { font-size: 14px; color: var(--color-text); font-weight: 500; }
    .required-mark { color: var(--color-error); margin-right: 4rpx; }

    .input-body {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0;
      background: transparent;
      border-radius: 0;
      border-bottom: 1px solid var(--color-border);
    }
    .input-body.error { border-bottom-color: var(--color-error); }

    .input-control {
      flex: 1;
      font-size: 14px;
      color: var(--color-text);
      background: transparent;
      border: none;
      outline: none;
      height: 44px;
      line-height: 44px;
    }
    .input-control::placeholder { color: var(--color-text-tertiary); }

    .send-btn {
      font-size: 13px;
      color: var(--color-primary);
      padding: 0 var(--space-2) 0 var(--space-3);
      flex-shrink: 0;
      border-left: 1px solid var(--color-border);
    }
    .send-btn.disabled { color: var(--color-text-tertiary); }

    .input-error { font-size: 12px; color: var(--color-error); }

    .submit-btn {
      height: 44px;
      background: var(--color-primary);
      color: #fff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      margin-top: var(--space-4);
    }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; max-width: 375px; margin-left: auto; margin-right: auto; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: #1890ff; width: 110px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="title">参考: base-input 验证码场景</div>
  <div class="preview">
    <div class="preview-header">手机验证</div>
    <div class="preview-body">
      <div class="form-card">
        <div class="form-title">绑定手机号</div>

        <div class="input-item">
          <label class="input-label"><span class="required-mark">*</span>手机号</label>
          <div class="input-body">
            <input class="input-control" placeholder="请输入手机号">
          </div>
        </div>

        <div style="height:16px"></div>

        <div class="input-item">
          <label class="input-label"><span class="required-mark">*</span>验证码</label>
          <div class="input-body">
            <input class="input-control" placeholder="请输入验证码">
            <div class="send-btn">发送验证码</div>
          </div>
        </div>

        <div class="submit-btn">提交</div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-input Props</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">number（数字键盘）</span></div>
    <div class="param-row"><span class="param-key">maxlength:</span><span class="param-val">6（验证码长度）</span></div>
    <div class="param-row"><span class="param-key">border:</span><span class="param-val">bottom（底线分隔）</span></div>
    <div class="param-row"><span class="param-key">slot suffix:</span><span class="param-val">发送/倒计时按钮</span></div>
  </div>
</body>
</html>
