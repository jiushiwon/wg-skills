<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单选 - 卡片式</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); }
    .preview-body { padding: var(--space-4); }

    .radio-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }
    .radio-card:last-child { margin-bottom: 0; }
    .radio-card.selected { border-color: var(--color-primary); }
    .radio-card-icon {
      width: 24px;
      height: 24px;
      border: 2px solid var(--color-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .radio-card.selected .radio-card-icon { border-color: var(--color-primary); background: var(--color-primary); }
    .radio-card-icon::after {
      content: '';
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
    }
    .radio-card.selected .radio-card-icon::after { opacity: 1; }
    .radio-card-content { flex: 1; }
    .radio-card-title { font-size: 15px; color: var(--color-text); font-weight: 500; }
    .radio-card-desc { font-size: 13px; color: var(--color-text-tertiary); margin-top: 4px; }
    .radio-card-price { font-size: 16px; color: var(--color-primary); font-weight: 600; margin-top: 8px; }
    .radio-card-tag { font-size: 11px; color: #ff6b00; background: #fff7e6; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-body">
      <div class="radio-card selected" onclick="selectCard(this)">
        <div class="radio-card-icon"></div>
        <div class="radio-card-content">
          <div class="radio-card-title">标准会员<span class="radio-card-tag">推荐</span></div>
          <div class="radio-card-desc">适合日常使用，功能齐全</div>
          <div class="radio-card-price">¥9.9/月</div>
        </div>
      </div>

      <div class="radio-card" onclick="selectCard(this)">
        <div class="radio-card-icon"></div>
        <div class="radio-card-content">
          <div class="radio-card-title">高级会员</div>
          <div class="radio-card-desc">专属客服，优先体验新功能</div>
          <div class="radio-card-price">¥19.9/月</div>
        </div>
      </div>

      <div class="radio-card" onclick="selectCard(this)">
        <div class="radio-card-icon"></div>
        <div class="radio-card-content">
          <div class="radio-card-title">年度会员</div>
          <div class="radio-card-desc">全年无限次使用，立省60元</div>
          <div class="radio-card-price">¥99/年</div>
        </div>
      </div>

      <div class="radio-card" onclick="selectCard(this)">
        <div class="radio-card-icon"></div>
        <div class="radio-card-content">
          <div class="radio-card-title">终身会员</div>
          <div class="radio-card-desc">一次购买，终身可用</div>
          <div class="radio-card-price">¥299/终身</div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-radio 参数</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">card</span></div>
    <div class="param-row"><span class="param-key">showPrice:</span><span class="param-val">true</span></div>
  </div>

  <script>
    function selectCard(el) {
      document.querySelectorAll('.radio-card').forEach(r => r.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
