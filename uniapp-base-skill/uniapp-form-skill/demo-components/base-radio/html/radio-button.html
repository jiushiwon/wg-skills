<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单选 - 按钮组</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .preview-header { height: 44px; background: var(--color-bg-surface); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--color-border); font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); }

    .radio-btn-group { display: flex; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    .radio-btn { flex: 1; padding: 12px 16px; text-align: center; font-size: 14px; color: var(--color-text-secondary); background: var(--color-bg-surface); border-right: 1px solid var(--color-border); cursor: pointer; transition: all 0.2s; }
    .radio-btn:last-child { border-right: none; }
    .radio-btn.selected { background: var(--color-primary); color: #fff; }
    .radio-btn:hover:not(.selected) { background: #f5f5f5; }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">按钮组单选</div>
    <div class="preview-body">
      <div style="margin-bottom: 12px; font-size: 14px; color: #666;">支付方式</div>
      <div class="radio-btn-group">
        <div class="radio-btn selected" onclick="selectBtn(this)">微信</div>
        <div class="radio-btn" onclick="selectBtn(this)">支付宝</div>
        <div class="radio-btn" onclick="selectBtn(this)">银行卡</div>
      </div>

      <div style="margin: 20px 0 12px; font-size: 14px; color: #666;">排序方式</div>
      <div class="radio-btn-group">
        <div class="radio-btn selected" onclick="selectBtn(this)">综合</div>
        <div class="radio-btn" onclick="selectBtn(this)">销量</div>
        <div class="radio-btn" onclick="selectBtn(this)">价格</div>
        <div class="radio-btn" onclick="selectBtn(this)">新品</div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-radio 参数</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">button</span></div>
  </div>

  <script>
    function selectBtn(el) {
      const group = el.parentElement;
      group.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
