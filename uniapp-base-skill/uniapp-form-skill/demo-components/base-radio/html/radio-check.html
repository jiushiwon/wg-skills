<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单选 - 打钩风格</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .preview-header { height: 44px; background: var(--color-bg-surface); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--color-border); font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); }

    .radio-check-item { display: flex; align-items: center; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-3); cursor: pointer; transition: all 0.2s; }
    .radio-check-item:last-child { margin-bottom: 0; }
    .radio-check-item.selected { border-color: var(--color-primary); background: #f0f7ff; }
    .radio-check-icon {
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: var(--space-3);
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .radio-check-item.selected .radio-check-icon { border-color: var(--color-primary); background: var(--color-primary); }
    .radio-check-icon svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
    .radio-check-item.selected .radio-check-icon svg { opacity: 1; }
    .radio-check-label { font-size: 15px; color: var(--color-text); }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">打钩风格单选</div>
    <div class="preview-body">
      <div class="radio-check-item selected" onclick="selectCheck(this)">
        <div class="radio-check-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <span class="radio-check-label">标准配送</span>
      </div>
      <div class="radio-check-item" onclick="selectCheck(this)">
        <div class="radio-check-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <span class="radio-check-label">加急配送</span>
      </div>
      <div class="radio-check-item" onclick="selectCheck(this)">
        <div class="radio-check-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <span class="radio-check-label">自提点取货</span>
      </div>
      <div class="radio-check-item" onclick="selectCheck(this)">
        <div class="radio-check-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <span class="radio-check-label">无人配送车</span>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-radio 参数</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">check</span></div>
    <div class="param-row"><span class="param-key">showIcon:</span><span class="param-val">true</span></div>
  </div>

  <script>
    function selectCheck(el) {
      document.querySelectorAll('.radio-check-item').forEach(r => r.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
