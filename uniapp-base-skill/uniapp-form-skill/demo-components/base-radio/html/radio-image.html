<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Image - 图片选项</title>
  <style>
    :root {
      --color-primary: #07c160;
      --color-primary-light: #e8f5e9;
      --color-surface: #ffffff;
      --color-border: #e8e8e8;
      --color-text: #333333;
      --color-text-secondary: #666666;
      --radius-md: 8px;
      --space-3: 12px;
      --space-2: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 20px; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .demo-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--color-text); }

    /* Image 选项 */
    .radio-image { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
    .image-item {
      aspect-ratio: 1; border-radius: var(--radius-md); overflow: hidden;
      border: 2px solid transparent; cursor: pointer; position: relative;
      background: #eee;
    }
    .image-item img { width: 100%; height: 100%; object-fit: cover; }
    .image-item.selected { border-color: var(--color-primary); }
    .image-item.selected::after {
      content: '✓'; position: absolute; top: 6px; right: 6px;
      width: 20px; height: 20px; background: var(--color-primary);
      color: #fff; border-radius: 50%; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }

    /* 头像选择 */
    .radio-avatar { display: flex; gap: var(--space-3); }
    .avatar-item {
      width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
      border: 2px solid transparent; cursor: pointer; position: relative;
    }
    .avatar-item img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-item.selected { border-color: var(--color-primary); }
    .avatar-item.selected::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; background: var(--color-primary);
    }

    /* 背景选择 */
    .radio-bg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .bg-item {
      aspect-ratio: 16/9; border-radius: 6px; overflow: hidden;
      border: 2px solid transparent; cursor: pointer;
    }
    .bg-item.selected { border-color: var(--color-primary); }

    /* Demo cards */
    .demo-card { margin-bottom: 24px; }
    .demo-card .label { font-size: 14px; color: #666; margin-bottom: 8px; display: block; }
  </style>
</head>
<body>
  <div class="demo-card">
    <span class="demo-title">头像选择</span>
    <div class="radio-avatar">
      <div class="avatar-item selected" onclick="selectAvatar(this)">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23ff6b6b' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='white' font-size='40'%3EA%3C/text%3E%3C/svg%3E" alt="头像1">
      </div>
      <div class="avatar-item" onclick="selectAvatar(this)">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%234ecdc4' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='white' font-size='40'%3EB%3C/text%3E%3C/svg%3E" alt="头像2">
      </div>
      <div class="avatar-item" onclick="selectAvatar(this)">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2395e1d3' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='white' font-size='40'%3EC%3C/text%3E%3C/svg%3E" alt="头像3">
      </div>
      <div class="avatar-item" onclick="selectAvatar(this)">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23a8e6cf' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='white' font-size='40'%3ED%3C/text%3E%3C/svg%3E" alt="头像4">
      </div>
    </div>
  </div>

  <div class="demo-card">
    <span class="demo-title">商品规格选择</span>
    <div class="radio-image">
      <div class="image-item selected" onclick="selectImage(this)">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23ddd' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='%23999' font-size='14'%3E规格1%3C/text%3E%3C/svg%3E">
      </div>
      <div class="image-item" onclick="selectImage(this)">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23ddd' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='%23999' font-size='14'%3E规格2%3C/text%3E%3C/svg%3E">
      </div>
      <div class="image-item" onclick="selectImage(this)">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23ddd' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='%23999' font-size='14'%3E规格3%3C/text%3E%3C/svg%3E">
      </div>
    </div>
  </div>

  <div class="demo-card">
    <span class="demo-title">背景选择</span>
    <div class="radio-bg">
      <div class="bg-item selected" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);" onclick="selectBg(this)"></div>
      <div class="bg-item" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);" onclick="selectBg(this)"></div>
      <div class="bg-item" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);" onclick="selectBg(this)"></div>
      <div class="bg-item" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);" onclick="selectBg(this)"></div>
    </div>
  </div>

  <script>
    function selectAvatar(el) {
      document.querySelectorAll('.avatar-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
    function selectImage(el) {
      document.querySelectorAll('.image-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
    function selectBg(el) {
      document.querySelectorAll('.bg-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
