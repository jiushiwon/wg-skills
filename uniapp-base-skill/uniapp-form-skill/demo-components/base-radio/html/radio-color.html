<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Color - 颜色选择</title>
  <style>
    :root {
      --color-primary: #07c160;
      --color-surface: #ffffff;
      --color-border: #e8e8e8;
      --color-text: #333333;
      --space-2: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 20px; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .demo-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--color-text); }

    /* Color 选择 */
    .radio-color { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .color-item {
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
      position: relative; border: 2px solid transparent;
    }
    .color-item.selected { border-color: var(--color-text); }
    .color-item.selected::after {
      content: '✓'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: #fff;
      font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* 主题色选择 */
    .theme-color { display: flex; gap: 12px; align-items: center; }
    .theme-item {
      width: 48px; height: 48px; border-radius: 12px; cursor: pointer;
      border: 2px solid transparent; display: flex; align-items: center; justify-content: center;
    }
    .theme-item.selected { border-color: #333; }
    .theme-item .check { display: none; color: #fff; font-size: 18px; }
    .theme-item.selected .check { display: block; }

    /* 渐变色 */
    .gradient-item {
      width: 60px; height: 36px; border-radius: 6px; cursor: pointer;
      border: 2px solid transparent;
    }
    .gradient-item.selected { border-color: #333; }

    /* Demo cards */
    .demo-card { margin-bottom: 24px; }
    .demo-card .label { font-size: 14px; color: #666; margin-bottom: 8px; display: block; }
  </style>
</head>
<body>
  <div class="demo-card">
    <span class="demo-title">基础颜色选择</span>
    <div class="radio-color">
      <div class="color-item selected" style="background: #333;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #666;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #999;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #c0392b;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #e74c3c;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #e67e22;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #f1c40f;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #2ecc71;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #1abc9c;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #3498db;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #9b59b6;" onclick="selectColor(this)"></div>
      <div class="color-item" style="background: #e91e63;" onclick="selectColor(this)"></div>
    </div>
  </div>

  <div class="demo-card">
    <span class="demo-title">主题色选择（带标签）</span>
    <div class="theme-color">
      <div class="theme-item selected" style="background: #07c160;" onclick="selectTheme(this)">
        <span class="check">✓</span>
      </div>
      <div class="theme-item" style="background: #1890ff;" onclick="selectTheme(this)">
        <span class="check">✓</span>
      </div>
      <div class="theme-item" style="background: #722ed1;" onclick="selectTheme(this)">
        <span class="check">✓</span>
      </div>
      <div class="theme-item" style="background: #faad14;" onclick="selectTheme(this)">
        <span class="check">✓</span>
      </div>
      <div class="theme-item" style="background: #fa541c;" onclick="selectTheme(this)">
        <span class="check">✓</span>
      </div>
    </div>
  </div>

  <div class="demo-card">
    <span class="demo-title">渐变色选择</span>
    <div style="display: flex; gap: 10px;">
      <div class="gradient-item selected" style="background: linear-gradient(135deg, #667eea, #764ba2);" onclick="selectGradient(this)"></div>
      <div class="gradient-item" style="background: linear-gradient(135deg, #f093fb, #f5576c);" onclick="selectGradient(this)"></div>
      <div class="gradient-item" style="background: linear-gradient(135deg, #4facfe, #00f2fe);" onclick="selectGradient(this)"></div>
      <div class="gradient-item" style="background: linear-gradient(135deg, #43e97b, #38f9d7);" onclick="selectGradient(this)"></div>
    </div>
  </div>

  <div class="demo-card">
    <span class="demo-title">皮肤选择</span>
    <div style="display: flex; gap: 16px;">
      <div style="text-align: center; cursor: pointer;" onclick="this.querySelector('.skin-box').classList.toggle('selected')">
        <div class="color-item selected" style="width: 60px; height: 60px; margin: 0 auto 8px; background: linear-gradient(180deg, #fff 50%, #f5f5f5 50%); border: 2px solid #333;"></div>
        <span style="font-size: 12px; color: #666;">浅色</span>
      </div>
      <div style="text-align: center; cursor: pointer;" onclick="this.querySelector('.skin-box').classList.toggle('selected')">
        <div class="color-item" style="width: 60px; height: 60px; margin: 0 auto 8px; background: linear-gradient(180deg, #1a1a1a 50%, #2a2a2a 50%);"></div>
        <span style="font-size: 12px; color: #666;">深色</span>
      </div>
      <div style="text-align: center; cursor: pointer;" onclick="this.querySelector('.skin-box').classList.toggle('selected')">
        <div class="color-item" style="width: 60px; height: 60px; margin: 0 auto 8px; background: linear-gradient(180deg, #fff 50%, #07c160 50%);"></div>
        <span style="font-size: 12px; color: #666;">跟随系统</span>
      </div>
    </div>
  </div>

  <script>
    function selectColor(el) {
      document.querySelectorAll('.color-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
    function selectTheme(el) {
      document.querySelectorAll('.theme-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
    function selectGradient(el) {
      document.querySelectorAll('.gradient-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
