<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单选 - 标签排列</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .preview-header { height: 44px; background: var(--color-bg-surface); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--color-border); font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); }

    .radio-tag-group { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .radio-tag {
      padding: 8px 16px;
      background: #f5f5f5;
      border-radius: 20px;
      font-size: 14px;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .radio-tag.selected { background: #e6f0ff; color: var(--color-primary); border-color: var(--color-primary); }
    .radio-tag:hover:not(.selected) { background: #e8e8e8; }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">标签排列单选</div>
    <div class="preview-body">
      <div class="radio-tag-group">
        <div class="radio-tag selected" onclick="selectTag(this)">不限</div>
        <div class="radio-tag" onclick="selectTag(this)">0-50元</div>
        <div class="radio-tag" onclick="selectTag(this)">50-100元</div>
        <div class="radio-tag" onclick="selectTag(this)">100-200元</div>
        <div class="radio-tag" onclick="selectTag(this)">200-500元</div>
        <div class="radio-tag" onclick="selectTag(this)">500元以上</div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-radio 参数</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">tag</span></div>
    <div class="param-row"><span class="param-key">tagShape:</span><span class="param-val">pill/rounded/square</span></div>
  </div>

  <script>
    function selectTag(el) {
      document.querySelectorAll('.radio-tag').forEach(r => r.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
