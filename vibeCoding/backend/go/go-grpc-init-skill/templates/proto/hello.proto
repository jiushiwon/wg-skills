syntax = "proto3";

package helloworld;

option go_package = "github.com/your-org/hello-service/proto/helloworld";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ============== 消息定义 ==============

message HelloRequest {
  string name = 1;                    // 必填，用户名
  map<string, string> meta = 2;      // 可选元数据
}

message HelloReply {
  string message = 1;                  // 响应消息
  int32 code = 2;                     // 0=成功，非0=错误（wg-skills 负数错误码）
  string error = 3;                    // 错误信息
  google.protobuf.Timestamp timestamp = 4; // 时间戳
}

// ============== 流模式消息 ==============

message StreamRequest {
  string query = 1;
  int32 page_size = 2;
}

message StreamResponse {
  string data = 1;
  bool is_final = 2;
}

// ============== 服务定义 ==============

service Greeter {
  // Unary: 普通调用
  rpc SayHello(HelloRequest) returns (HelloReply);

  // Server Streaming: 服务端流
  rpc SayHelloStream(HelloRequest) returns (stream HelloReply);

  // Client Streaming: 客户端流
  rpc Upload(stream HelloRequest) returns (HelloReply);

  // Bidirectional Streaming: 双向流
  rpc Chat(stream HelloRequest) returns (stream HelloReply);

  // 健康检查（标准接口）
  rpc Check(google.protobuf.Empty) returns (HealthCheckResponse);
}

// ============== 健康检查 ==============

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}
