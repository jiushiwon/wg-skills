# Agent 模块配置

# 默认模型
agent.default-model=gpt-4o-mini

# 温度
agent.temperature=0.7

# 最大 Token 数
agent.max-tokens=2048

# 记忆轮数
agent.memory-turns=20

# 最大迭代次数
agent.max-iterations=5

# 请求超时（秒）
agent.timeout=60

# 是否启用限流
agent.rate-limit-enabled=true

# 限流：每分钟请求数
agent.rate-limit-per-minute=10

# OpenAI 配置（可选）
# agent.openai.api-key=${OPENAI_API_KEY:}
# agent.openai.base-url=https://api.openai.com

# Claude 配置（可选）
# agent.claude.api-key=${CLAUDE_API_KEY:}
