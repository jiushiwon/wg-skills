# ============================================================
# Agent 模块配置（.env 文件格式）
# 由 application.yml 通过 ${ENV_VAR:default} 读取
# ============================================================

# ----- 模型配置 -----
AGENT_DEFAULT_MODEL=gpt-4o-mini
AGENT_TEMPERATURE=0.7
AGENT_MAX_TOKENS=2048
AGENT_MEMORY_TURNS=20
AGENT_MAX_ITERATIONS=10
AGENT_TIMEOUT=60
AGENT_SYSTEM_PROMPT=你是一个智能助手，帮助用户查询系统信息。

# ----- 限流配置 -----
AGENT_RATE_LIMIT_ENABLED=true
AGENT_RATE_LIMIT_PER_MINUTE=10

# ----- 模型白名单 -----
AGENT_ALLOWED_MODELS=gpt-4o-mini,gpt-4o,gpt-4-turbo,claude-3-haiku,claude-3-sonnet,claude-3.5-sonnet,deepseek-chat

# ----- LLM API 密钥 -----
OPENAI_API_KEY=sk-xxx
OPENAI_BASE_URL=https://api.openai.com/v1
ANTHROPIC_API_KEY=sk-ant-xxx
DEEPSEEK_API_KEY=sk-xxx

# ----- 安全配置 -----
PII_ENCRYPTION_KEY=your-fernet-key-here
PROJECT_ROOT=/path/to/your/project

# ----- Resilience4j 重试配置 -----
RESILIENCE4J_RETRY_INSTANCES_LLM_RETRY_MAX_ATTEMPTS=3
RESILIENCE4J_RETRY_INSTANCES_LLM_RETRY_WAIT_DURATION=1s
RESILIENCE4J_RETRY_INSTANCES_LLM_RETRY_ENABLE_EXPONENTIAL_BACKOFF=true
RESILIENCE4J_RETRY_INSTANCES_LLM_RETRY_EXPONENTIAL_BACKOFF_MULTIPLIER=2
