<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 13 - 空状态</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
</head>
<body>
  <h1 class="demo-section-title">空状态 — 数据为空时的友好提示</h1>
  <p class="demo-helper">三种空态：基础文案、emoji 占位、自定义 slot（带操作按钮）。</p>

  <base-card title="商品列表（基础空态）">
    <table class="base-table">
      <thead class="base-table__head">
        <tr>
          <th>SKU</th><th>商品名称</th><th>价格</th>
        </tr>
      </thead>
      <tbody class="base-table__body">
        <tr><td colspan="3">
          <div class="base-table__empty">
            <div class="base-table__empty-icon">📭</div>
            <div class="base-table__empty-text">还没有商品，去添加一个吧</div>
          </div>
        </td></tr>
      </tbody>
    </table>
  </base-card>

  <base-card title="订单管理（自定义空态）">
    <table class="base-table">
      <thead class="base-table__head">
        <tr>
          <th>订单号</th><th>客户</th><th>金额</th>
        </tr>
      </thead>
      <tbody class="base-table__body">
        <tr><td colspan="3">
          <div class="base-table__empty">
            <div class="base-table__empty-icon">🛒</div>
            <div class="base-table__empty-text" style="margin-bottom: var(--space-4);">暂无订单</div>
            <button class="base-button base-button--type-primary">立即下单</button>
          </div>
        </td></tr>
      </tbody>
    </table>
  </base-card>

  <base-card title="搜索结果（筛选无匹配）">
    <table class="base-table">
      <thead class="base-table__head">
        <tr>
          <th>订单号</th><th>客户</th><th>金额</th>
        </tr>
      </thead>
      <tbody class="base-table__body">
        <tr><td colspan="3">
          <div class="base-table__empty">
            <div class="base-table__empty-icon">🔍</div>
            <div class="base-table__empty-text">未找到符合条件的订单</div>
          </div>
        </td></tr>
      </tbody>
    </table>
  </base-card>
</body>
</html>
