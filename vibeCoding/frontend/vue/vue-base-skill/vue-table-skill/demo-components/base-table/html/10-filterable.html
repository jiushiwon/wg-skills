<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 10 - 可筛选</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
</head>
<body>
  <h1 class="demo-section-title">可筛选 — 独立筛选行 + 输入/下拉</h1>
  <p class="demo-helper">表格头部第二行作为筛选行。本 demo 演示输入筛选 + 下拉筛选组合。</p>

  <base-card title="订单管理（可筛选）">
    <table class="base-table" id="filter-table">
      <thead class="base-table__head">
        <tr>
          <th>订单号</th>
          <th>客户</th>
          <th>金额</th>
          <th>状态</th>
          <th>下单时间</th>
        </tr>
        <tr class="base-table__filter-row">
          <th><input class="base-table__filter-input" data-key="orderNo" placeholder="搜索订单号" /></th>
          <th><input class="base-table__filter-input" data-key="customer" placeholder="搜索客户" /></th>
          <th></th>
          <th>
            <select class="base-table__filter-select" data-key="status">
              <option value="">全部</option>
              <option value="已付款">已付款</option>
              <option value="待发货">待发货</option>
              <option value="配送中">配送中</option>
              <option value="已完成">已完成</option>
              <option value="已取消">已取消</option>
            </select>
          </th>
          <th></th>
        </tr>
      </thead>
      <tbody class="base-table__body" id="filter-body"></tbody>
    </table>
  </base-card>

  <script>
    const allData = [
      { orderNo: 'SO-260824001', customer: '张三', amount: 8999, status: '已付款', time: '2026-08-24 10:23' },
      { orderNo: 'SO-260824002', customer: '李四', amount: 2399, status: '待发货', time: '2026-08-24 11:15' },
      { orderNo: 'SO-260824003', customer: '王五', amount: 14999, status: '已付款', time: '2026-08-24 13:42' },
      { orderNo: 'SO-260824004', customer: '赵六', amount: 499, status: '已取消', time: '2026-08-24 15:08' },
      { orderNo: 'SO-260824005', customer: '钱七', amount: 3199, status: '配送中', time: '2026-08-24 16:55' },
      { orderNo: 'SO-260824006', customer: '孙八', amount: 1899, status: '已完成', time: '2026-08-24 18:20' },
    ];
    const filters = { orderNo: '', customer: '', status: '' };

    function render() {
      const rows = allData.filter(r => {
        if (filters.orderNo && !r.orderNo.toLowerCase().includes(filters.orderNo.toLowerCase())) return false;
        if (filters.customer && !r.customer.includes(filters.customer)) return false;
        if (filters.status && r.status !== filters.status) return false;
        return true;
      });
      document.getElementById('filter-body').innerHTML = rows.length === 0
        ? `<tr><td colspan="5" style="text-align:center;color:var(--color-text-tertiary);padding:var(--space-8);">无匹配结果</td></tr>`
        : rows.map(r => `
          <tr>
            <td>${r.orderNo}</td><td>${r.customer}</td><td>¥${r.amount}</td>
            <td><span class="base-tag base-tag--type-info">${r.status}</span></td>
            <td>${r.time}</td>
          </tr>`).join('');
    }

    document.querySelectorAll('.base-table__filter-input, .base-table__filter-select').forEach(el => {
      el.addEventListener('input', e => {
        filters[e.target.dataset.key] = e.target.value;
        render();
      });
      el.addEventListener('change', e => {
        filters[e.target.dataset.key] = e.target.value;
        render();
      });
    });
    render();
  </script>
</body>
</html>
