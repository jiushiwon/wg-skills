<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 12 - 加载中</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    .base-table__loading-overlay {
      position: relative;
    }
    .base-table__loading-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.6);
      z-index: 5;
      border-radius: var(--radius-lg);
    }
  </style>
</head>
<body>
  <h1 class="demo-section-title">加载中 — 骨架屏 + 半透明覆盖</h1>
  <p class="demo-helper">数据请求中显示，避免空白闪烁。点击"加载 2 秒"按钮重看效果。</p>

  <base-card title="商品列表">
    <button class="base-button base-button--type-primary" id="reload" style="margin-bottom: var(--space-3);">重新加载（2 秒）</button>
    <div id="loading-wrap">
      <table class="base-table base-table--variant-bordered" id="loading-table">
        <thead class="base-table__head">
          <tr>
            <th>SKU</th><th>商品名称</th><th>价格</th>
          </tr>
        </thead>
        <tbody class="base-table__body" id="loading-body">
          <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
          <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
          <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
          <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
          <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
        </tbody>
      </table>
    </div>
  </base-card>

  <script>
    const real = [
      { sku: 'SKU-001', name: 'iPhone 15 Pro', price: 8999 },
      { sku: 'SKU-002', name: 'MacBook Pro M3', price: 14999 },
      { sku: 'SKU-003', name: 'AirPods Pro 2', price: 1899 },
    ];

    function showLoading() {
      document.getElementById('loading-wrap').classList.add('base-table__loading-overlay');
      document.getElementById('loading-body').innerHTML = `
        <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
        <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
        <tr class="base-table__skeleton-row"><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td><td><div class="base-table__skeleton"></div></td></tr>
      `;
    }
    function showLoaded() {
      document.getElementById('loading-wrap').classList.remove('base-table__loading-overlay');
      document.getElementById('loading-body').innerHTML = real.map(r =>
        `<tr><td>${r.sku}</td><td>${r.name}</td><td>¥${r.price}</td></tr>`
      ).join('');
    }

    document.getElementById('reload').onclick = () => {
      showLoading();
      setTimeout(showLoaded, 2000);
    };
    // 初始 2 秒后显示数据
    setTimeout(showLoaded, 2000);
  </script>
</body>
</html>
