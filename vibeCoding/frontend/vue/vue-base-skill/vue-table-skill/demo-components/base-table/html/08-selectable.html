<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 08 - 可选择</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    .base-table__body tr.is-selected td { background: var(--color-primary-light); }
  </style>
</head>
<body>
  <h1 class="demo-section-title">可选择 — 多选 + 全选联动</h1>
  <p class="demo-helper">通过 selectable="multiple" 开启。配合 batch 操作用。</p>

  <base-card title="商品管理">
    <div class="base-card__header" style="margin-bottom: var(--space-3); border: none; padding: 0;">
      <span>已选 <strong id="count">0</strong> 项</span>
      <button class="base-button base-button--type-primary" id="batch-btn" disabled>批量上架</button>
    </div>

    <table class="base-table base-table--variant-hover" id="sel-table">
      <thead class="base-table__head">
        <tr>
          <th style="width: 40px;"><input type="checkbox" id="check-all" /></th>
          <th>SKU</th><th>商品名称</th><th>价格</th><th>状态</th>
        </tr>
      </thead>
      <tbody class="base-table__body">
        <tr data-id="SKU-001"><td><input type="checkbox" class="row-check" /></td><td>SKU-001</td><td>iPhone 15 Pro</td><td>¥8999</td><td><span class="base-tag base-tag--type-success">在售</span></td></tr>
        <tr data-id="SKU-002"><td><input type="checkbox" class="row-check" /></td><td>SKU-002</td><td>MacBook Pro M3</td><td>¥14999</td><td><span class="base-tag base-tag--type-success">在售</span></td></tr>
        <tr data-id="SKU-003"><td><input type="checkbox" class="row-check" /></td><td>SKU-003</td><td>AirPods Pro 2</td><td>¥1899</td><td><span class="base-tag base-tag--type-warning">缺货</span></td></tr>
        <tr data-id="SKU-004"><td><input type="checkbox" class="row-check" /></td><td>SKU-004</td><td>iPad Air</td><td>¥4799</td><td><span class="base-tag base-tag--type-success">在售</span></td></tr>
        <tr data-id="SKU-005"><td><input type="checkbox" class="row-check" /></td><td>SKU-005</td><td>Apple Watch S9</td><td>¥3199</td><td><span class="base-tag base-tag--type-danger">下架</span></td></tr>
      </tbody>
    </table>
  </base-card>

  <script>
    const all = document.getElementById('check-all');
    const rows = document.querySelectorAll('.row-check');
    const count = document.getElementById('count');
    const btn = document.getElementById('batch-btn');
    const table = document.getElementById('sel-table');

    function update() {
      const checked = [...rows].filter(r => r.checked);
      count.textContent = checked.length;
      btn.disabled = checked.length === 0;
      all.checked = checked.length === rows.length;
      // 行高亮
      table.querySelectorAll('tbody tr').forEach(tr => {
        const c = tr.querySelector('.row-check');
        tr.classList.toggle('is-selected', c && c.checked);
      });
    }

    all.addEventListener('change', () => {
      rows.forEach(r => r.checked = all.checked);
      update();
    });
    rows.forEach(r => r.addEventListener('change', update));
  </script>
</body>
</html>
