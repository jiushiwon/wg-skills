<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-button / 01 - 5 种类型</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    /* base-button 演示样式（与 SKILL.md 中实现对应） */
    .base-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      border-radius: var(--radius-md);
      font-weight: var(--weight-medium);
      font-family: inherit;
      font-size: var(--font-base);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
      user-select: none;
      white-space: nowrap;
      outline: none;
      text-decoration: none;
    }

    .base-button:focus-visible {
      box-shadow: 0 0 0 2px var(--color-primary-light);
    }

    .base-button:active:not(:disabled):not(.is-disabled) {
      transform: scale(0.98);
    }

    .base-button:disabled,
    .base-button.is-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* size */
    .base-button--size-sm { height: var(--height-btn-sm); padding: 0 var(--space-3); font-size: var(--font-xs); }
    .base-button--size-md { height: var(--height-btn-md); padding: 0 var(--space-5); }
    .base-button--size-lg { height: var(--height-btn-lg); padding: 0 var(--space-6); font-size: var(--font-lg); }

    /* type - solid */
    .base-button--type-default.base-button--variant-solid {
      background: var(--color-bg-card);
      border-color: var(--color-border);
      color: var(--color-text-primary);
    }
    .base-button--type-default.base-button--variant-solid:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .base-button--type-primary {
      background: var(--color-primary);
      color: var(--color-white);
    }
    .base-button--type-primary:hover { background: var(--color-primary-hover); }

    .base-button--type-success {
      background: var(--color-success);
      color: var(--color-white);
    }
    .base-button--type-success:hover { background: #16a34a; }

    .base-button--type-warning {
      background: var(--color-warning);
      color: var(--color-white);
    }
    .base-button--type-warning:hover { background: #d97706; }

    .base-button--type-danger {
      background: var(--color-danger);
      color: var(--color-white);
    }
    .base-button--type-danger:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="demo-page">
    <h1 class="demo-page-title">基础按钮 — 5 种 type</h1>
    <p class="demo-page-desc">type: default | primary | success | warning | danger。必须嵌入 base-card 使用。</p>

    <div class="demo-card">
      <div class="demo-card__title">按钮类型</div>
      <div class="demo-card__body">
        <div class="demo-row">
          <button class="base-button base-button--size-md base-button--variant-solid">默认</button>
          <button class="base-button base-button--type-primary base-button--size-md base-button--variant-solid">主要</button>
          <button class="base-button base-button--type-success base-button--size-md base-button--variant-solid">成功</button>
          <button class="base-button base-button--type-warning base-button--size-md base-button--variant-solid">警告</button>
          <button class="base-button base-button--type-danger base-button--size-md base-button--variant-solid">危险</button>
        </div>
      </div>
    </div>

    <div class="demo-card">
      <div class="demo-card__title">禁用态</div>
      <div class="demo-card__body">
        <div class="demo-row">
          <button class="base-button" disabled>默认</button>
          <button class="base-button base-button--type-primary" disabled>主要</button>
          <button class="base-button base-button--type-success" disabled>成功</button>
          <button class="base-button base-button--type-warning" disabled>警告</button>
          <button class="base-button base-button--type-danger" disabled>危险</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
