<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-button / 00 - 总览</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .demo-page { padding-top: var(--space-16); }

    .showcase-hero {
      text-align: center;
      color: var(--color-white);
      margin-bottom: var(--space-12);
    }
    .showcase-hero h1 {
      font-size: 48px;
      font-weight: var(--weight-bold);
      margin-bottom: var(--space-3);
    }
    .showcase-hero p {
      font-size: var(--font-lg);
      opacity: 0.9;
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-6);
    }

    .showcase-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: var(--space-6);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .showcase-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
    }

    .showcase-card__icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-4);
    }

    .showcase-card__icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .showcase-card__title {
      font-size: var(--font-xl);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-2);
    }

    .showcase-card__desc {
      font-size: var(--font-base);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      flex: 1;
    }

    .showcase-card__arrow {
      margin-top: var(--space-4);
      color: var(--color-primary);
      font-size: var(--font-sm);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
  </style>
</head>
<body>
  <div class="demo-page">
    <div class="showcase-hero">
      <h1>base-button</h1>
      <p>6 type × 5 variant × 3 size = 90 种形态组合</p>
    </div>

    <div class="showcase-grid">
      <a href="./01-types.html" class="showcase-card">
        <div class="showcase-card__icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div class="showcase-card__title">01 - 5 种类型</div>
        <div class="showcase-card__desc">type: default / primary / success / warning / danger，配合禁用态展示。</div>
        <div class="showcase-card__arrow">查看 →</div>
      </a>

      <a href="./02-variants.html" class="showcase-card">
        <div class="showcase-card__icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
        </div>
        <div class="showcase-card__title">02 - 形态变体</div>
        <div class="showcase-card__desc">variant: solid / outline / text 三种样式组合。</div>
        <div class="showcase-card__arrow">查看 →</div>
      </a>

      <a href="./03-sizes.html" class="showcase-card">
        <div class="showcase-card__icon">
          <svg viewBox="0 0 24 24"><path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9"/><path d="M3 15h18l-2 4H5z"/></svg>
        </div>
        <div class="showcase-card__title">03 - 三种尺寸</div>
        <div class="showcase-card__desc">size: sm (32px) / md (40px) / lg (48px)，含块级按钮。</div>
        <div class="showcase-card__arrow">查看 →</div>
      </a>
    </div>
  </div>
</body>
</html>
