<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaseSelect 展示</title>
  <style>
    /* CSS Variables - 对齐 vue-theme-skill */
    :root {
      --color-primary: #409eff;
      --color-primary-light: #a0cfff;
      --color-bg-secondary: #f5f7fa;
      --color-surface: #ffffff;
      --color-border: #dcdfe6;
      --color-text: #303133;
      --color-text-secondary: #909399;
      --color-text-tertiary: #c0c4cc;
      --height-input-md: 36px;
      --radius-md: 4px;
      --font-base: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--color-bg-secondary); min-height: 100vh; padding: 40px; }
    .demo-container { max-width: 900px; margin: 0 auto; }
    .demo-title { font-size: 24px; font-weight: 600; color: var(--color-text); margin-bottom: 24px; }
    .demo-section { background: var(--color-surface); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .demo-section-title { font-size: 16px; font-weight: 600; color: var(--color-text); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border); }
    .demo-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .demo-label { width: 80px; font-size: var(--font-base); color: var(--color-text); flex-shrink: 0; }

    /* BaseSelect 样式 */
    .base-select { position: relative; display: inline-block; width: 240px; cursor: pointer; }
    .base-select.is-disabled { cursor: not-allowed; opacity: 0.6; }
    .base-select__trigger { display: flex; align-items: center; justify-content: space-between; height: var(--height-input-md); padding: 0 32px 0 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); transition: all 0.2s; }
    .base-select:hover .base-select__trigger { border-color: var(--color-text-tertiary); }
    .base-select.is-opened .base-select__trigger { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.1); }
    .base-select.is-disabled .base-select__trigger { background-color: var(--color-bg-secondary); cursor: not-allowed; }
    .base-select__placeholder { color: var(--color-text-tertiary); font-size: var(--font-base); }
    .base-select__value { color: var(--color-text); font-size: var(--font-base); }
    .base-select__tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .base-select__tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; background: #f0f2f5; border-radius: 4px; font-size: 12px; color: var(--color-text); }
    .base-select__tag-close { margin-left: 4px; cursor: pointer; color: var(--color-text-secondary); font-size: 10px; }
    .base-select__tag-close:hover { color: var(--color-primary); }
    .base-select__arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--color-text-tertiary); font-size: 10px; transition: transform 0.2s; }
    .base-select.is-opened .base-select__arrow { transform: translateY(-50%) rotate(180deg); }
    .base-select__clear { font-size: var(--font-base); padding: 4px; position: absolute; right: 24px; }
    .base-select__clear:hover { color: var(--color-primary); }

    .base-select__dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; max-height: 240px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); overflow-y: auto; z-index: 100; opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; }
    .base-select.is-opened .base-select__dropdown { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .base-select__loading, .base-select__empty { padding: 20px; text-align: center; color: var(--color-text-secondary); font-size: var(--font-base); }
    .base-select__option { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; transition: background 0.15s; font-size: var(--font-base); }
    .base-select__option:hover { background: var(--color-bg-secondary); }
    .base-select__option.is-selected { color: var(--color-primary); background: #ecf5ff; }
    .base-select__option.is-disabled { color: var(--color-text-tertiary); cursor: not-allowed; }
    .base-select__option-check { font-weight: bold; }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1 class="demo-title">BaseSelect 选择器组件</h1>

    <div class="demo-section">
      <h3 class="demo-section-title">单选模式</h3>
      <div class="demo-row">
        <span class="demo-label">基本</span>
        <div class="base-select" id="select1" onclick="toggleSelect(this)">
          <div class="base-select__trigger">
            <span class="base-select__placeholder">请选择</span>
            <svg class="base-select__arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div class="base-select__dropdown">
            <div class="base-select__option" onclick="selectOption(this, 'bj', '北京')"><span>北京</span><svg class="base-select__option-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="base-select__option" onclick="selectOption(this, 'sh', '上海')"><span>上海</span></div>
            <div class="base-select__option" onclick="selectOption(this, 'gz', '广州')"><span>广州</span></div>
            <div class="base-select__option" onclick="selectOption(this, 'sz', '深圳')"><span>深圳</span></div>
          </div>
        </div>
      </div>
      <div class="demo-row">
        <span class="demo-label">选中值</span>
        <span id="select1-value" style="color: var(--color-primary); font-size: var(--font-base);"></span>
      </div>
    </div>

    <div class="demo-section">
      <h3 class="demo-section-title">多选模式</h3>
      <div class="demo-row">
        <span class="demo-label">多选</span>
        <div class="base-select" id="select2" onclick="toggleSelect(this)">
          <div class="base-select__trigger">
            <span class="base-select__placeholder">请选择</span>
            <svg class="base-select__arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div class="base-select__dropdown">
            <div class="base-select__option" onclick="toggleMulti(this, 'apple', '苹果')"><span>苹果</span><svg class="base-select__option-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="base-select__option" onclick="toggleMulti(this, 'banana', '香蕉')"><span>香蕉</span></div>
            <div class="base-select__option" onclick="toggleMulti(this, 'orange', '橙子')"><span>橙子</span></div>
            <div class="base-select__option" onclick="toggleMulti(this, 'grape', '葡萄')"><span>葡萄</span></div>
          </div>
        </div>
      </div>
      <div class="demo-row">
        <span class="demo-label">选中值</span>
        <span id="select2-value" style="color: var(--color-primary); font-size: var(--font-base);"></span>
      </div>
    </div>

    <div class="demo-section">
      <h3 class="demo-section-title">可搜索</h3>
      <div class="demo-row">
        <span class="demo-label">搜索</span>
        <div class="base-select" id="select3">
          <div class="base-select__trigger" onclick="toggleSelect(this.parentElement)">
            <span class="base-select__placeholder">搜索选择</span>
            <svg class="base-select__arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div class="base-select__dropdown">
            <div style="padding: 8px 12px; border-bottom: 1px solid var(--color-border);">
              <input type="text" placeholder="搜索..." style="width: 100%; height: 28px; padding: 0 8px; border: 1px solid var(--color-border); border-radius: var(--radius-md); outline: none;" oninput="filterOptions(this, '.base-select__option')">
            </div>
            <div class="base-select__option" onclick="selectOption(this, '1', '北京市')"><span>北京市</span></div>
            <div class="base-select__option" onclick="selectOption(this, '2', '上海市')"><span>上海市</span></div>
            <div class="base-select__option" onclick="selectOption(this, '3', '广州市')"><span>广州市</span></div>
            <div class="base-select__option" onclick="selectOption(this, '4', '深圳市')"><span>深圳市</span></div>
            <div class="base-select__option" onclick="selectOption(this, '5', '杭州市')"><span>杭州市</span></div>
            <div class="base-select__option" onclick="selectOption(this, '6', '成都市')"><span>成都市</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h3 class="demo-section-title">禁用状态</h3>
      <div class="demo-row">
        <span class="demo-label">禁用</span>
        <div class="base-select is-disabled">
          <div class="base-select__trigger">
            <span class="base-select__value">已选中</span>
            <svg class="base-select__arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentSelect = null;
    function toggleSelect(el) {
      event.stopPropagation();
      if (currentSelect && currentSelect !== el) {
        currentSelect.classList.remove('is-opened');
      }
      el.classList.toggle('is-opened');
      currentSelect = el.classList.contains('is-opened') ? el : null;
    }
    function selectOption(el, value, label) {
      const dropdown = el.closest('.base-select');
      const trigger = dropdown.querySelector('.base-select__trigger');
      trigger.querySelector('.base-select__placeholder').textContent = label;
      trigger.querySelector('.base-select__placeholder').classList.remove('base-select__placeholder');
      trigger.querySelector('.base-select__value') || trigger.insertAdjacentHTML('afterbegin', '<span class="base-select__value"></span>');
      trigger.querySelector('.base-select__value').textContent = label;
      dropdown.querySelectorAll('.base-select__option').forEach(opt => opt.classList.remove('is-selected'));
      el.classList.add('is-selected');
      dropdown.classList.remove('is-opened');
      const valueEl = document.getElementById(dropdown.id + '-value');
      if (valueEl) valueEl.textContent = value;
    }
    const multiSelected = {};
    function toggleMulti(el, value, label) {
      const dropdown = el.closest('.base-select');
      el.classList.toggle('is-selected');
      if (!multiSelected[dropdown.id]) multiSelected[dropdown.id] = [];
      const arr = multiSelected[dropdown.id];
      const idx = arr.findIndex(i => i.value === value);
      if (idx > -1) { arr.splice(idx, 1); } else { arr.push({ value, label }); }
      const trigger = dropdown.querySelector('.base-select__trigger');
      const placeholder = trigger.querySelector('.base-select__placeholder');
      if (arr.length === 0) {
        placeholder.textContent = '请选择';
        placeholder.classList.add('base-select__placeholder');
        trigger.querySelector('.base-select__value')?.remove();
      } else {
        placeholder.classList.remove('base-select__placeholder');
        placeholder.textContent = '';
        let valueEl = trigger.querySelector('.base-select__value');
        if (!valueEl) { valueEl = document.createElement('span'); valueEl.className = 'base-select__value'; trigger.insertBefore(valueEl, trigger.firstChild); }
        const labels = arr.slice(0, 3).map(i => i.label).join(', ');
        valueEl.textContent = arr.length > 3 ? `${labels} +${arr.length - 3}` : labels;
      }
      document.getElementById(dropdown.id + '-value').textContent = JSON.stringify(arr);
    }
    function filterOptions(input, selector) {
      const query = input.value.toLowerCase();
      const dropdown = input.closest('.base-select__dropdown');
      dropdown.querySelectorAll(selector).forEach(opt => {
        const text = opt.textContent.toLowerCase();
        opt.style.display = text.includes(query) ? '' : 'none';
      });
    }
    document.addEventListener('click', () => {
      document.querySelectorAll('.base-select.is-opened').forEach(el => el.classList.remove('is-opened'));
      currentSelect = null;
    });
  </script>
</body>
</html>
