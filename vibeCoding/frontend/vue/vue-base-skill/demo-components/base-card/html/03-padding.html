<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-card / 03 - 内边距变体</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
</head>
<body>
  <h1 class="demo-section-title">内边距变体 — padding="default / sm / none"</h1>
  <p class="demo-helper">padding="none" 用于内嵌 base-table 等需要贴边的内容。</p>

  <base-card title="默认内边距（padding="default"）">
    <p>内容有 var(--space-5) 的内边距，舒适阅读。</p>
  </base-card>

  <base-card title="紧凑内边距（padding="sm"）" class="base-card--padding-sm">
    <p>内容有 var(--space-3) 的内边距。</p>
  </base-card>

  <base-card title="无内边距（padding="none"，内嵌表格）" class="base-card--padding-none">
    <table class="base-table base-table--variant-bordered" style="border-radius: var(--radius-lg); overflow: hidden;">
      <thead class="base-table__head">
        <tr><th>SKU</th><th>商品</th><th>价格</th></tr>
      </thead>
      <tbody class="base-table__body">
        <tr><td>SKU-001</td><td>iPhone 15 Pro</td><td>¥8999</td></tr>
        <tr><td>SKU-002</td><td>MacBook Pro</td><td>¥14999</td></tr>
      </tbody>
    </table>
  </base-card>
</body>
</html>
