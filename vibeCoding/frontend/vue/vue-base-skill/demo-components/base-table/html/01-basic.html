<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 01 - 基础表格</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
</head>
<body>
  <h1 class="demo-section-title">基础表格 — variant="basic"（默认）</h1>
  <p class="demo-helper">最简形态，无任何额外修饰。最小的视觉负担。</p>

  <base-card title="商品列表">
    <table class="base-table">
      <thead class="base-table__head">
        <tr>
          <th>ID</th><th>商品名称</th><th>分类</th>
          <th>价格</th><th>库存</th><th>更新时间</th>
        </tr>
      </thead>
      <tbody class="base-table__body">
        <tr><td>1001</td><td>iPhone 15 Pro</td><td>手机</td><td>¥8999</td><td>128</td><td>2026-08-20</td></tr>
        <tr><td>1002</td><td>MacBook Pro M3</td><td>电脑</td><td>¥14999</td><td>56</td><td>2026-08-21</td></tr>
        <tr><td>1003</td><td>AirPods Pro 2</td><td>耳机</td><td>¥1899</td><td>320</td><td>2026-08-22</td></tr>
        <tr><td>1004</td><td>iPad Air</td><td>平板</td><td>¥4799</td><td>89</td><td>2026-08-23</td></tr>
        <tr><td>1005</td><td>Apple Watch S9</td><td>手表</td><td>¥3199</td><td>145</td><td>2026-08-24</td></tr>
      </tbody>
    </table>
  </base-card>
</body>
</html>
