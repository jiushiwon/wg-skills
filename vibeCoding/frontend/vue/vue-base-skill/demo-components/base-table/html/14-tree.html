<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 14 - 树形表格</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
</head>
<body>
  <h1 class="demo-section-title">树形表格 — 多层级数据 + 展开折叠</h1>
  <p class="demo-helper">适合组织架构、目录分类、评论回复树。点击 ▶ 展开/折叠。</p>

  <base-card title="组织架构">
    <table class="base-table" id="tree-table">
      <thead class="base-table__head">
        <tr>
          <th>部门 / 员工</th><th>职位</th><th>人数</th><th>状态</th>
        </tr>
      </thead>
      <tbody class="base-table__body" id="tree-body"></tbody>
    </table>
  </base-card>

  <script>
    const tree = [
      {
        id: 'tech', name: '研发部', title: '-', count: 45, status: 'active',
        children: [
          {
            id: 'tech-fe', name: '前端组', title: '-', count: 18, status: 'active',
            children: [
              { id: 'u1', name: '张三', title: '高级工程师', count: 1, status: 'active' },
              { id: 'u2', name: '李四', title: '工程师', count: 1, status: 'active' },
              { id: 'u3', name: '王五', title: '初级工程师', count: 1, status: 'leave' },
            ]
          },
          {
            id: 'tech-be', name: '后端组', title: '-', count: 22, status: 'active',
            children: [
              { id: 'u4', name: '赵六', title: '架构师', count: 1, status: 'active' },
              { id: 'u5', name: '钱七', title: '高级工程师', count: 1, status: 'active' },
            ]
          },
        ]
      },
      {
        id: 'product', name: '产品部', title: '-', count: 12, status: 'active',
        children: [
          { id: 'u6', name: '孙八', title: '产品经理', count: 1, status: 'active' },
          { id: 'u7', name: '周九', title: '产品助理', count: 1, status: 'active' },
        ]
      },
      {
        id: 'design', name: '设计部', title: '-', count: 8, status: 'active',
        children: [
          { id: 'u8', name: '吴十', title: 'UI 设计师', count: 1, status: 'active' },
        ]
      },
    ];

    const expanded = new Set(['tech', 'tech-fe']);
    const indent = 16;

    function flatten(rows, level = 0, out = []) {
      for (const r of rows) {
        out.push({ ...r, __level: level });
        if (r.children && expanded.has(r.id)) flatten(r.children, level + 1, out);
      }
      return out;
    }

    function render() {
      const rows = flatten(tree);
      document.getElementById('tree-body').innerHTML = rows.map(r => {
        const hasChildren = r.children && r.children.length > 0;
        const isOpen = expanded.has(r.id);
        const indentStyle = `padding-left: calc(var(--space-3) + ${r.__level * indent}px)`;
        const toggle = hasChildren
          ? `<span class="base-table__tree-toggle" data-id="${r.id}">${isOpen ? '▼' : '▶'}</span>`
          : `<span class="base-table__tree-toggle" style="visibility:hidden;">▶</span>`;
        const tag = r.status === 'active'
          ? '<span class="base-tag base-tag--type-success">活跃</span>'
          : '<span class="base-tag base-tag--type-warning">休假</span>';
        return `
          <tr>
            <td style="${indentStyle}">${toggle}${r.name}</td>
            <td>${r.title}</td>
            <td>${r.count}</td>
            <td>${r.id.startsWith('u') ? tag : ''}</td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.base-table__tree-toggle[data-id]').forEach(el => {
        el.onclick = () => {
          const id = el.dataset.id;
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        };
      });
    }
    render();
  </script>
</body>
</html>
