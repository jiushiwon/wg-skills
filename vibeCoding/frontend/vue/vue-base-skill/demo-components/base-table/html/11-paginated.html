<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 11 - 分页</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
</head>
<body>
  <h1 class="demo-section-title">分页 — 客户端分页 + 底部分页器</h1>
  <p class="demo-helper">本 demo 演示客户端分页（全部数据本地切片）。生产中常用服务端分页（远端 total）。</p>

  <base-card title="商品列表">
    <table class="base-table" id="page-table">
      <thead class="base-table__head">
        <tr>
          <th>SKU</th><th>商品名称</th><th>分类</th><th>价格</th>
        </tr>
      </thead>
      <tbody class="base-table__body" id="page-body"></tbody>
    </table>

    <div class="base-table__pagination">
      <span class="base-table__pagination-total">共 <span id="total">0</span> 条</span>
      <button id="btn-first">«</button>
      <button id="btn-prev">‹</button>
      <span><span id="cur">1</span> / <span id="total-pages">1</span></span>
      <button id="btn-next">›</button>
      <button id="btn-last">»</button>
      <select id="size-sel" style="margin-left:var(--space-2);">
        <option value="5">5 / 页</option>
        <option value="10" selected>10 / 页</option>
        <option value="20">20 / 页</option>
      </select>
    </div>
  </base-card>

  <script>
    const data = Array.from({ length: 47 }).map((_, i) => ({
      sku: `SKU-${String(i+1).padStart(3,'0')}`,
      name: `商品 ${i+1}`,
      cat: `分类 ${(i % 5) + 1}`,
      price: (99 + i * 23).toFixed(2)
    }));

    let cur = 1, size = 10;
    function totalPages() { return Math.max(1, Math.ceil(data.length / size)); }
    function render() {
      const start = (cur - 1) * size;
      const slice = data.slice(start, start + size);
      document.getElementById('page-body').innerHTML = slice.map(r =>
        `<tr><td>${r.sku}</td><td>${r.name}</td><td>${r.cat}</td><td>¥${r.price}</td></tr>`
      ).join('');
      const tp = totalPages();
      if (cur > tp) cur = tp;
      document.getElementById('total').textContent = data.length;
      document.getElementById('cur').textContent = cur;
      document.getElementById('total-pages').textContent = tp;
      document.getElementById('btn-first').disabled = cur === 1;
      document.getElementById('btn-prev').disabled = cur === 1;
      document.getElementById('btn-next').disabled = cur === tp;
      document.getElementById('btn-last').disabled = cur === tp;
    }
    document.getElementById('btn-first').onclick = () => { cur = 1; render(); };
    document.getElementById('btn-prev').onclick = () => { cur = Math.max(1, cur - 1); render(); };
    document.getElementById('btn-next').onclick = () => { cur = Math.min(totalPages(), cur + 1); render(); };
    document.getElementById('btn-last').onclick = () => { cur = totalPages(); render(); };
    document.getElementById('size-sel').onchange = (e) => { size = +e.target.value; cur = 1; render(); };
    render();
  </script>
</body>
</html>
