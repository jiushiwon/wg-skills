<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>base-table / 09 - 可排序</title>
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/demo.css" />
</head>
<body>
  <h1 class="demo-section-title">可排序 — 点击列头切换升降序</h1>
  <p class="demo-helper">支持三态循环：无 → 升序 → 降序 → 无。本 demo 客户端排序。</p>

  <base-card title="商品列表（点击列头排序）">
    <table class="base-table base-table--variant-hover" id="sort-table">
      <thead class="base-table__head">
        <tr>
          <th class="base-table__cell--sortable" data-key="sku">SKU<span class="base-table__sort-icon">⇅</span></th>
          <th class="base-table__cell--sortable" data-key="name">商品名称<span class="base-table__sort-icon">⇅</span></th>
          <th class="base-table__cell--sortable" data-key="price">价格<span class="base-table__sort-icon">⇅</span></th>
          <th class="base-table__cell--sortable" data-key="stock">库存<span class="base-table__sort-icon">⇅</span></th>
        </tr>
      </thead>
      <tbody class="base-table__body" id="sort-body"></tbody>
    </table>
  </base-card>

  <script>
    const data = [
      { sku: 'SKU-001', name: 'iPhone 15 Pro', price: 8999, stock: 128 },
      { sku: 'SKU-002', name: 'MacBook Pro M3', price: 14999, stock: 56 },
      { sku: 'SKU-003', name: 'AirPods Pro 2', price: 1899, stock: 320 },
      { sku: 'SKU-004', name: 'iPad Air', price: 4799, stock: 89 },
      { sku: 'SKU-005', name: 'Apple Watch S9', price: 3199, stock: 145 },
      { sku: 'SKU-006', name: 'iPhone 15', price: 5999, stock: 256 },
      { sku: 'SKU-007', name: 'MacBook Air', price: 9999, stock: 78 },
    ];

    let sortKey = null, sortOrder = '';

    function render() {
      let rows = [...data];
      if (sortKey && sortOrder) {
        rows.sort((a, b) => {
          const av = a[sortKey], bv = b[sortKey];
          return sortOrder === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
        });
      }
      document.getElementById('sort-body').innerHTML = rows.map(r => `
        <tr>
          <td>${r.sku}</td><td>${r.name}</td><td>¥${r.price}</td><td>${r.stock}</td>
        </tr>`).join('');
      // 更新列头状态
      document.querySelectorAll('.base-table__cell--sortable').forEach(th => {
        const isActive = th.dataset.key === sortKey && sortOrder;
        th.classList.toggle('base-table__cell--sorted', isActive);
        const icon = th.querySelector('.base-table__sort-icon');
        icon.textContent = th.dataset.key === sortKey ? (sortOrder === 'asc' ? '↑' : sortOrder === 'desc' ? '↓' : '⇅') : '⇅';
      });
    }

    document.querySelectorAll('.base-table__cell--sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (sortKey !== key) { sortKey = key; sortOrder = 'asc'; }
        else if (sortOrder === 'asc') sortOrder = 'desc';
        else if (sortOrder === 'desc') { sortKey = null; sortOrder = ''; }
        render();
      });
    });
    render();
  </script>
</body>
</html>
