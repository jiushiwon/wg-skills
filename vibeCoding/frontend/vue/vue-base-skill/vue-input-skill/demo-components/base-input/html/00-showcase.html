<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaseInput 展示</title>
  <style>
    /* CSS Variables - 对齐 vue-theme-skill */
    :root {
      --color-primary: #409eff;
      --color-primary-light: #a0cfff;
      --color-bg-secondary: #f5f7fa;
      --color-surface: #ffffff;
      --color-border: #dcdfe6;
      --color-text: #303133;
      --color-text-secondary: #909399;
      --color-text-tertiary: #c0c4cc;
      --height-input-md: 36px;
      --height-input-sm: 28px;
      --height-input-lg: 44px;
      --radius-md: 4px;
      --font-base: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg-secondary);
      min-height: 100vh;
      padding: 40px;
    }

    .demo-container { max-width: 800px; margin: 0 auto; }
    .demo-title { font-size: 24px; font-weight: 600; color: var(--color-text); margin-bottom: 24px; }
    .demo-section { background: var(--color-surface); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .demo-section-title { font-size: 16px; font-weight: 600; color: var(--color-text); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border); }
    .demo-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .demo-label { width: 80px; font-size: var(--font-base); color: var(--color-text); flex-shrink: 0; }

    /* BaseInput 样式 */
    .base-input {
      display: inline-flex;
      align-items: center;
      width: 280px;
      height: var(--height-input-md);
      padding: 0 12px;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: all 0.2s;
      cursor: text;
    }

    .base-input:hover { border-color: var(--color-text-tertiary); }
    .base-input.focused { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.1); }
    .base-input.disabled { background-color: var(--color-bg-secondary); cursor: not-allowed; }

    .base-input.small { height: var(--height-input-sm); }
    .base-input.large { height: var(--height-input-lg); }

    .base-input__inner {
      flex: 1;
      border: none;
      outline: none;
      font-size: var(--font-base);
      color: var(--color-text);
      background: transparent;
      min-width: 0;
    }

    .base-input__inner::placeholder { color: var(--color-text-tertiary); }
    .base-input.disabled .base-input__inner { background-color: inherit; color: var(--color-text-tertiary); cursor: inherit; }

    .base-input__prefix, .base-input__suffix { display: flex; align-items: center; color: var(--color-text-secondary); flex-shrink: 0; }
    .base-input__prefix { margin-right: 8px; }
    .base-input__suffix { margin-left: 8px; }
    .base-input__icon { font-size: var(--font-base); }
    .base-input__clear { cursor: pointer; transition: color 0.2s; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .base-input__clear:hover { color: var(--color-primary); background: var(--color-bg-secondary); }

    .base-input.with-prefix { padding-left: 8px; }
    .base-input.with-suffix { padding-right: 8px; }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1 class="demo-title">BaseInput 输入框组件</h1>

    <div class="demo-section">
      <h3 class="demo-section-title">基础用法</h3>
      <div class="demo-row">
        <span class="demo-label">基本</span>
        <div class="base-input" id="demo1">
          <input type="text" class="base-input__inner" placeholder="请输入内容">
        </div>
      </div>
      <div class="demo-row">
        <span class="demo-label">禁用</span>
        <div class="base-input disabled">
          <input type="text" class="base-input__inner" placeholder="禁用状态" disabled>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h3 class="demo-section-title">三种尺寸</h3>
      <div class="demo-row">
        <span class="demo-label">小</span>
        <div class="base-input small">
          <input type="text" class="base-input__inner" placeholder="小尺寸">
        </div>
      </div>
      <div class="demo-row">
        <span class="demo-label">默认</span>
        <div class="base-input">
          <input type="text" class="base-input__inner" placeholder="默认尺寸">
        </div>
      </div>
      <div class="demo-row">
        <span class="demo-label">大</span>
        <div class="base-input large">
          <input type="text" class="base-input__inner" placeholder="大尺寸">
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h3 class="demo-section-title">前缀后缀</h3>
      <div class="demo-row">
        <span class="demo-label">前缀</span>
        <div class="base-input with-prefix">
          <span class="base-input__prefix"><svg class="base-input__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" class="base-input__inner" placeholder="请输入用户名">
        </div>
      </div>
      <div class="demo-row">
        <span class="demo-label">后缀</span>
        <div class="base-input with-suffix">
          <input type="text" class="base-input__inner" placeholder="请输入内容">
          <span class="base-input__suffix"><svg class="base-input__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
        </div>
      </div>
      <div class="demo-row">
        <span class="demo-label">清除</span>
        <div class="base-input with-suffix" id="demo2">
          <input type="text" class="base-input__inner" value="可清空的内容">
          <span class="base-input__suffix">
            <svg class="base-input__clear" onclick="this.parentElement.previousElementSibling.value=''" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </span>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h3 class="demo-section-title">密码框</h3>
      <div class="demo-row">
        <span class="demo-label">密码</span>
        <div class="base-input">
          <span class="base-input__prefix"><svg class="base-input__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" class="base-input__inner" placeholder="请输入密码">
        </div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.base-input').forEach(el => {
      const input = el.querySelector('input');
      if (!input || el.classList.contains('disabled')) return;
      input.addEventListener('focus', () => el.classList.add('focused'));
      input.addEventListener('blur', () => el.classList.remove('focused'));
    });
  </script>
</body>
</html>
