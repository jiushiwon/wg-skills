<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折线图 · Line Chart</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/demo.css">
</head>
<body>
<div class="chart-demo-page">
  <h1 class="chart-demo-page__title">折线图 · Line Chart</h1>
  <p class="chart-demo-page__subtitle">基础折线、平滑曲线、面积填充、多线对比</p>
  <div class="chart-demo-grid">
    <div class="chart-demo-card">
      <div class="chart-demo-card__header">
        <div class="chart-demo-card__title">基础折线</div>
        <div class="chart-demo-card__desc">7 天营收数据，圆点标记，虚线网格</div>
      </div>
      <div class="chart-demo-card__body"><canvas id="c1" width="560" height="320"></canvas></div>
    </div>
    <div class="chart-demo-card">
      <div class="chart-demo-card__header">
        <div class="chart-demo-card__title">平滑曲线</div>
        <div class="chart-demo-card__desc">贝塞尔曲线平滑连接</div>
      </div>
      <div class="chart-demo-card__body"><canvas id="c2" width="560" height="320"></canvas></div>
    </div>
    <div class="chart-demo-card">
      <div class="chart-demo-card__header">
        <div class="chart-demo-card__title">面积填充</div>
        <div class="chart-demo-card__desc">平滑曲线 + 半透明渐变填充</div>
      </div>
      <div class="chart-demo-card__body"><canvas id="c3" width="560" height="320"></canvas></div>
    </div>
    <div class="chart-demo-card">
      <div class="chart-demo-card__header">
        <div class="chart-demo-card__title">多线对比</div>
        <div class="chart-demo-card__desc">本月 vs 上月，带图例</div>
      </div>
      <div class="chart-demo-card__body"><canvas id="c4" width="560" height="320"></canvas></div>
    </div>
  </div>
</div>

<script>
var labels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
var colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452', '#9a60b4'];

function drawLineChart(canvas, data, options) {
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  var padding = { top: 40, right: 30, bottom: 40, left: 60 };
  var plotW = w - padding.left - padding.right;
  var plotH = h - padding.top - padding.bottom;

  var allValues = [];
  data.series.forEach(function(s) { s.values.forEach(function(v) { allValues.push(v); }); });
  var maxVal = Math.max.apply(null, allValues) * 1.1;
  var minVal = 0;

  // Grid lines
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 5; i++) {
    var y = padding.top + plotH * i / 5;
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(w - padding.right, y); ctx.stroke();
    ctx.fillStyle = '#9ca3af'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxVal * (1 - i / 5)).toLocaleString(), padding.left - 8, y + 4);
  }

  // X labels
  data.labels.forEach(function(label, i) {
    var x = padding.left + plotW * i / (data.labels.length - 1);
    ctx.fillStyle = '#9ca3af'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, x, h - padding.bottom + 20);
  });

  // Lines
  data.series.forEach(function(s, si) {
    var color = options.colors[si % options.colors.length];
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();

    s.values.forEach(function(v, i) {
      var x = padding.left + plotW * i / (s.values.length - 1);
      var y = padding.top + plotH * (1 - v / maxVal);
      if (i === 0) { ctx.moveTo(x, y); }
      else if (options.smooth) {
        var prevX = padding.left + plotW * (i - 1) / (s.values.length - 1);
        var prevY = padding.top + plotH * (1 - s.values[i - 1] / maxVal);
        var cpx = (prevX + x) / 2;
        ctx.bezierCurveTo(cpx, prevY, cpx, y, x, y);
      } else {
        ctx.lineTo(x, y);
      }
    });
    ctx.stroke();

    // Area fill
    if (options.area) {
      var lastX = padding.left + plotW;
      var firstX = padding.left;
      ctx.lineTo(lastX, h - padding.bottom);
      ctx.lineTo(firstX, h - padding.bottom);
      ctx.closePath();
      ctx.fillStyle = color + '20';
      ctx.fill();
    }

    // Data dots
    if (options.showDot !== false) {
      s.values.forEach(function(v, i) {
        var x = padding.left + plotW * i / (s.values.length - 1);
        var y = padding.top + plotH * (1 - v / maxVal);
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      });
    }
  });

  // Legend
  if (data.series.length > 1 && options.legend !== false) {
    var lx = w - padding.right;
    var ly = 12;
    for (var si = data.series.length - 1; si >= 0; si--) {
      var s = data.series[si];
      var color = options.colors[si % options.colors.length];
      ctx.font = '12px sans-serif';
      var tw = ctx.measureText(s.name).width;
      lx -= tw + 30;
      ctx.fillStyle = color; ctx.fillRect(lx, ly - 4, 12, 3);
      ctx.fillStyle = '#6b7280'; ctx.fillText(s.name, lx + 16, ly);
    }
  }
}

// Card 1 - Basic
drawLineChart(document.getElementById('c1'), {
  labels: labels,
  series: [{ name: '营收', values: [8200, 9320, 12001, 11344, 14900, 16300, 13100] }]
}, { colors: colors, smooth: false, area: false });

// Card 2 - Smooth
drawLineChart(document.getElementById('c2'), {
  labels: labels,
  series: [{ name: '营收', values: [8200, 9320, 12001, 11344, 14900, 16300, 13100] }]
}, { colors: colors, smooth: true, area: false });

// Card 3 - Area
drawLineChart(document.getElementById('c3'), {
  labels: labels,
  series: [{ name: '营收', values: [8200, 9320, 12001, 11344, 14900, 16300, 13100] }]
}, { colors: colors, smooth: true, area: true });

// Card 4 - Multi-line
drawLineChart(document.getElementById('c4'), {
  labels: labels,
  series: [
    { name: '本月', values: [8200, 9320, 12001, 11344, 14900, 16300, 13100] },
    { name: '上月', values: [6800, 8100, 9500, 10200, 11800, 13200, 11500] }
  ]
}, { colors: colors, smooth: true, area: false });
</script>
</body>
</html>
