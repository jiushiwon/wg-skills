<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沉浸暗色创作台 · Vue Skill Demo</title>
  <style>
    :root{--bg:#070b16;--nav:#0c1222;--panel:#0e1526;--line:#1e2942;--text:#eef1ff;--muted:#8490ae;--purple:#9a7dff;--violet:#6f63ff}*{box-sizing:border-box}body{margin:0;min-width:1024px;background:radial-gradient(circle at 48% -8%,#242356 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,"PingFang SC",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:70px minmax(680px,1fr) 276px}.rail{padding:22px 14px;background:rgba(10,16,31,.84);border-right:1px solid var(--line)}.mark,.rail-item{display:grid;place-items:center;border-radius:12px}.mark{width:38px;height:38px;background:linear-gradient(135deg,#7c93ff,#9c70ff);box-shadow:0 8px 24px #806cff4a}.rail-list{display:grid;gap:13px;margin-top:42px}.rail-item{width:40px;height:40px;color:#8996bd;cursor:pointer}.rail-item.active,.rail-item:hover{color:#e9e4ff;background:#8b75ff26;outline:1px solid #927dff5e}.main{padding:25px 32px}.topbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.dots{display:flex;gap:8px}.dots i{width:8px;height:8px;border-radius:50%;background:#303c5e}.profile{display:flex;gap:10px;align-items:center}.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#a77dff,#6579ff)}h1{margin:28px 0 4px;font-size:28px}.lead{color:var(--muted);font-size:13px}.prompt{margin-top:24px;padding:22px;border:1px solid #6258bf;border-radius:17px;background:linear-gradient(135deg,#10172a,#0b1020);box-shadow:0 0 0 1px #aa8cff12,inset 0 1px #ffffff0b}.prompt-box{height:118px;padding:14px;border:1px solid #293451;border-radius:12px;color:#b1bad5;background:#090e1b;font:14px/1.65 inherit;outline:0;width:100%;resize:none}.prompt-box:focus{border-color:#9a7dff}.prompt-foot,.tools,.results-head,.meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.tools{margin-top:16px;justify-content:flex-start}.icon-btn,.mode,.ghost{border:1px solid #293451;border-radius:10px;color:#aeb8d5;background:#121a2d;font:12px inherit;cursor:pointer}.icon-btn{width:34px;height:34px}.send{margin-left:auto;padding:11px 18px;border:0;border-radius:10px;color:#fff;background:linear-gradient(135deg,#6c79ff,#9b72ff);font-weight:700;cursor:pointer;box-shadow:0 10px 25px #7568ff42}.send:disabled{opacity:.6}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:17px}.mode{padding:16px;text-align:left}.mode.active{border-color:#9c7eff;background:#372b6e40;box-shadow:inset 0 0 0 1px #9c7eff}.mode b{font-size:14px}.mode span{display:block;margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5}.results{margin-top:27px}.section-title{font-size:17px;font-weight:750}.sub{margin-top:5px;color:var(--muted);font-size:12px}.ghost{padding:8px 12px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.asset{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#0c1222}.art{height:136px;background:#18213d}.art.one{background:linear-gradient(140deg,#8078d9,#2b305b 56%,#0e1224)}.art.two{background:linear-gradient(140deg,#271c4b,#8f72cd 48%,#152036)}.art.three{background:linear-gradient(130deg,#4d5f9f,#e1a4c4 40%,#18243e)}.meta{padding:11px}.name{font-size:13px;font-weight:700}.meta small{display:block;margin-top:4px;color:var(--muted)}.fav{border:0;background:transparent;color:#9d88f9;font-size:17px;cursor:pointer}.panel{padding:24px 18px;border-left:1px solid var(--line);background:#090f1e}.panel-title{font-size:15px;font-weight:700}.block{padding:19px 0;border-bottom:1px solid var(--line)}.label{color:#a8b3cf;font-size:12px;font-weight:650}.seg{display:flex;gap:7px;margin-top:11px}.seg button{padding:8px 10px;border:1px solid #293451;border-radius:8px;color:#9ca9c9;background:#111a2e;font:11px inherit;cursor:pointer}.seg button.active{border-color:#927bff;color:#c4b5ff;background:#422d7a55}.slider{height:6px;margin-top:16px;border-radius:99px;background:#222d47}.slider i{display:block;width:70%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6d7dff,#ae7bff)}.notice{margin-top:12px;padding:11px;border-radius:9px;color:#9faadd;background:#121a2d;font-size:11px;line-height:1.6}.loading{display:none;color:#baaeff;font-size:12px}.loading.show{display:block}@media(max-width:1120px){.panel{display:none}.app{grid-template-columns:70px minmax(0,1fr)}}
  </style>
</head>
<body><div class="app"><aside class="rail"><div class="mark">✦</div><div class="rail-list"><div class="rail-item active">⌂</div><div class="rail-item">▣</div><div class="rail-item">◈</div><div class="rail-item">☷</div><div class="rail-item">♡</div></div></aside><main class="main"><div class="topbar"><span>ORBIT STUDIO / NEW CANVAS</span><div class="profile"><span>已保存</span><div class="dots"><i></i><i></i></div><div class="avatar"></div></div></div><h1>让灵感进入轨道</h1><div class="lead">沉浸式暗色创作台，专注画面、材质与光线关系。</div><section class="prompt"><textarea id="prompt" class="prompt-box">一束月光穿过夜色山谷，冷紫色花朵在水面上发光，电影感构图。</textarea><div class="tools"><button class="icon-btn">◫</button><button class="icon-btn">⊹</button><button class="icon-btn">⌘</button><button id="generate" class="send">生成视觉</button></div></section><section class="modes"><button class="mode active" data-mode="氛围图像"><b>氛围图像</b><span>先确定光线、情绪与主体</span></button><button class="mode" data-mode="角色肖像"><b>角色肖像</b><span>控制人物关系与镜头语言</span></button><button class="mode" data-mode="品牌叙事"><b>品牌叙事</b><span>构建完整的故事视觉线</span></button></section><section class="results"><div class="results-head"><div><div class="section-title">候选画面</div><div class="sub">选中一个方向，再在右侧深化参数。</div></div><button id="clear" class="ghost">恢复示例</button></div><div id="loading" class="loading">正在分解场景、构图与材质…</div><div class="gallery"><article class="asset"><div class="art one"></div><div class="meta"><div><div class="name">月落群山</div><small>16:9 · 电影感</small></div><button class="fav">☆</button></div></article><article class="asset"><div class="art two"></div><div class="meta"><div><div class="name">紫夜花序</div><small>4:5 · 编辑感</small></div><button class="fav">☆</button></div></article><article class="asset"><div class="art three"></div><div class="meta"><div><div class="name">雾中来信</div><small>1:1 · 氛围图像</small></div><button class="fav">☆</button></div></article></div></section></main><aside class="panel"><div class="panel-title">创作控制</div><div class="block"><div class="label">画面比例</div><div class="seg" id="ratio"><button>1:1</button><button class="active">4:5</button><button>16:9</button></div></div><div class="block"><div class="label">创作自由度</div><div class="slider"><i></i></div><div class="notice">维持画面关键词，同时允许模型构建具有意外感的细节。</div></div><div class="block"><div class="label">色彩倾向</div><div class="seg"><button class="active">冷紫月光</button><button>柔金暖调</button></div></div></aside></div><script>const modes=[...document.querySelectorAll('.mode')],ratios=[...document.querySelectorAll('#ratio button')],loading=document.querySelector('#loading'),button=document.querySelector('#generate');modes.forEach(x=>x.onclick=()=>{modes.forEach(y=>y.classList.remove('active'));x.classList.add('active')});ratios.forEach(x=>x.onclick=()=>{ratios.forEach(y=>y.classList.remove('active'));x.classList.add('active')});document.querySelectorAll('.fav').forEach(x=>x.onclick=()=>{x.textContent=x.textContent==='☆'?'★':'☆'});button.onclick=()=>{button.disabled=true;button.textContent='正在生成';loading.classList.add('show');setTimeout(()=>{button.disabled=false;button.textContent='再次生成';loading.classList.remove('show')},900)};document.querySelector('#clear').onclick=()=>{document.querySelector('#prompt').value='一束月光穿过夜色山谷，冷紫色花朵在水面上发光，电影感构图。';modes.forEach((x,i)=>x.classList.toggle('active',i===0));ratios.forEach((x,i)=>x.classList.toggle('active',i===1))}</script></body>
</html>
