<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>短片分镜创作台 · Vue Skill Demo</title><style>
:root{--ink:#17191e;--panel:#1a1c20;--panel2:#24262b;--line:#36383f;--text:#f7f3eb;--muted:#a1a0a3;--coral:#ff9278;--blue:#5287ff}*{box-sizing:border-box}body{margin:0;min-width:1080px;background:#f5eadc;color:var(--text);font-family:Inter,"PingFang SC",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(620px,1fr) 306px;grid-template-rows:1fr 180px;gap:12px;padding:22px}.scenes,.stage,.inspector,.timeline{border:1px solid #35373d;border-radius:16px;background:linear-gradient(145deg,#202226,#16181c);box-shadow:0 14px 30px #29201618}.scenes{grid-row:1/3;padding:16px}.cap{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;letter-spacing:.8px}.scene-list{display:grid;gap:10px;margin-top:19px}.scene{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;color:#ced0d4;font-size:12px;cursor:pointer}.thumb{height:62px;border:1px solid transparent;border-radius:9px;background:#354052}.scene.active .thumb{border-color:var(--coral);box-shadow:0 0 0 2px #ff92783d}.scene.active{color:#fff}.scene:nth-child(1) .thumb{background:linear-gradient(140deg,#63798f,#d1977c 47%,#374456)}.scene:nth-child(2) .thumb{background:linear-gradient(140deg,#d6a18c,#343a4e)}.scene:nth-child(3) .thumb{background:linear-gradient(140deg,#50647b,#bc8f7e)}.scene:nth-child(4) .thumb{background:linear-gradient(140deg,#162238,#be735e)}.scene:nth-child(5) .thumb{background:linear-gradient(140deg,#786753,#cab396)}.scene:nth-child(6) .thumb{background:linear-gradient(140deg,#496b7d,#bfd5d5)}.add{width:100%;margin-top:17px;padding:12px;border:1px dashed #585a61;border-radius:9px;color:#a9aab0;background:transparent;cursor:pointer}.stage{padding:17px}.stage-top,.playbar,.time-head,.parameter-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.stage-top{color:var(--muted);font-size:11px}.preview{height:calc(100% - 64px);min-height:420px;margin-top:15px;border-radius:10px;background:radial-gradient(circle at 65% 22%,#f6bd85 0,transparent 22%),linear-gradient(145deg,#5b7890,#393e54 45%,#202637);position:relative;overflow:hidden}.preview:after{content:'';position:absolute;inset:50% 0 0;background:linear-gradient(0deg,#1a202b,transparent);opacity:.7}.preview-title{position:absolute;left:22px;bottom:19px;z-index:1;font-size:20px;font-weight:750}.playbar{padding:14px 3px 0}.play{width:34px;height:34px;border:0;border-radius:50%;color:#fff;background:var(--coral);cursor:pointer}.progress{height:6px;flex:1;border-radius:99px;background:#3a3d45}.progress i{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--coral),#ffd1a8)}.inspector{padding:18px}.parameter{padding:17px 0;border-bottom:1px solid var(--line)}.label{color:#d0d1d5;font-size:12px;font-weight:700}.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.seg button{padding:8px 9px;border:1px solid #3c3f47;border-radius:8px;color:#bfc1c7;background:#24272d;font:11px inherit;cursor:pointer}.seg button.active{border-color:#739cff;color:#d9e3ff;background:#35446c}.slider{height:6px;margin-top:15px;border-radius:99px;background:#3c3e45}.slider i{display:block;width:56%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#5590ff,#9dc1ff)}.timeline{grid-column:2/4;padding:14px 17px}.timeline-track{display:flex;gap:10px;margin-top:14px}.clip{flex:1;min-width:0;height:89px;padding:8px;border:1px solid #3b3d44;border-radius:9px;background:#24262b;cursor:pointer}.clip.active{border-color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral)}.clip-image{height:47px;border-radius:5px;background:#566377}.clip:nth-child(1) .clip-image{background:linear-gradient(140deg,#63798f,#d1977c)}.clip:nth-child(2) .clip-image{background:linear-gradient(140deg,#d6a18c,#343a4e)}.clip:nth-child(3) .clip-image{background:linear-gradient(140deg,#50647b,#bc8f7e)}.clip:nth-child(4) .clip-image{background:linear-gradient(140deg,#162238,#be735e)}.clip:nth-child(5) .clip-image{background:linear-gradient(140deg,#786753,#cab396)}.clip small{display:block;margin-top:6px;color:#b6b8bf;font-size:10px}.render{padding:10px 14px;border:0;border-radius:9px;color:#fff;background:var(--coral);font-weight:700;cursor:pointer}.render:disabled{opacity:.6}.status{display:none;color:#ffb3a3;font-size:11px}.status.show{display:block}
</style></head><body><div class="app"><aside class="scenes"><div class="cap"><span>STORYBOARD / 07</span><span>···</span></div><div id="sceneList" class="scene-list"><div class="scene active"><span>01</span><div class="thumb"></div></div><div class="scene"><span>02</span><div class="thumb"></div></div><div class="scene"><span>03</span><div class="thumb"></div></div><div class="scene"><span>04</span><div class="thumb"></div></div><div class="scene"><span>05</span><div class="thumb"></div></div><div class="scene"><span>06</span><div class="thumb"></div></div></div><button class="add">＋ 新建镜头</button></aside><main class="stage"><div class="stage-top"><span>《群山回声》 / 镜头 01</span><span>16:9 · 4 秒</span></div><div class="preview"><div class="preview-title">黄昏抵达山谷</div></div><div class="playbar"><button id="play" class="play">▶</button><span>00:00</span><div class="progress"><i id="progress"></i></div><span>00:04</span><span>⌁</span></div></main><aside class="inspector"><div class="parameter-head"><b>镜头控制</b><span>⌘</span></div><div class="parameter"><div class="label">镜头焦段</div><div class="seg"><button class="active">35mm</button><button>50mm</button><button>85mm</button></div></div><div class="parameter"><div class="label">运镜方式</div><div class="seg"><button>静止</button><button class="active">推进</button><button>环绕</button></div></div><div class="parameter"><div class="label">镜头时长</div><div class="slider"><i></i></div></div><div class="parameter"><div class="label">视觉色调</div><div class="seg"><button class="active">暮色暖调</button><button>青灰清晨</button></div></div></aside><section class="timeline"><div class="time-head"><div><b>故事时间线</b><span id="status" class="status">正在渲染预览片段…</span></div><button id="render" class="render">渲染预览</button></div><div id="timeline" class="timeline-track"><div class="clip active"><div class="clip-image"></div><small>01 / 抵达</small></div><div class="clip"><div class="clip-image"></div><small>02 / 凝视</small></div><div class="clip"><div class="clip-image"></div><small>03 / 远景</small></div><div class="clip"><div class="clip-image"></div><small>04 / 夜火</small></div><div class="clip"><div class="clip-image"></div><small>05 / 花影</small></div></div></section></div><script>const group=(selector)=>[...document.querySelectorAll(selector)];group('.scene').forEach(x=>x.onclick=()=>{group('.scene').forEach(y=>y.classList.remove('active'));x.classList.add('active')});group('.clip').forEach(x=>x.onclick=()=>{group('.clip').forEach(y=>y.classList.remove('active'));x.classList.add('active')});group('.seg button').forEach(x=>x.onclick=()=>{[...x.parentElement.children].forEach(y=>y.classList.remove('active'));x.classList.add('active')});const play=document.querySelector('#play'),progress=document.querySelector('#progress');play.onclick=()=>{const running=play.textContent==='❚❚';play.textContent=running?'▶':'❚❚';progress.style.width=running?'38%':'72%'};const render=document.querySelector('#render'),status=document.querySelector('#status');render.onclick=()=>{render.disabled=true;render.textContent='渲染中';status.classList.add('show');setTimeout(()=>{render.disabled=false;render.textContent='再次渲染';status.classList.remove('show')},1000)}</script></body></html>
