<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下拉选择 - 级联选择</title>
  <link rel="stylesheet" href="../../../../demo-components/shared/base-preview.css" />
  <style>
    .cascade-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 12px var(--space-3);
      background: #f5f5f5;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
    }
    .crumb { color: var(--color-primary); }
    .crumb.placeholder { color: var(--color-text-tertiary); }
    .sep { color: var(--color-text-tertiary); }

    /* 弹层（base-popup direction="bottom"） */
    .popup-content { padding: var(--space-3) 0; }
    .card-header {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title { font-size: 16px; font-weight: 500; }
    .card-close { color: var(--color-text-tertiary); font-size: 22px; cursor: pointer; line-height: 1; }

    .cascade-cols {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow-y: auto;
      max-height: 50vh;
    }
    .cascade-col {
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
    }
    .cascade-col:last-child { border-right: none; }
    .col-item {
      padding: 12px;
      font-size: 14px;
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-item:hover { background: #f8f8f8; }
    .col-item.active { color: var(--color-primary); background: rgba(74,144,226,0.08); }
    .col-item .arrow { color: var(--color-text-tertiary); font-size: 12px; }

    .card-footer {
      padding: var(--space-3) var(--space-4);
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: var(--space-2);
    }
    .card-footer button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-bg-surface);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
    }
    .card-footer .primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="preview base-card">
    <div class="preview-header base-card__header">
      <span>下拉选择 · 级联</span>
      <span style="font-size:12px;color:#999;">demo</span>
    </div>
    <div class="preview-body base-card__body">
      <span style="font-size:14px;color:var(--color-text-secondary);margin-bottom:var(--space-2);display:block;">选择省/市/区</span>
      <div class="cascade-bar" onclick="openPopup()">
        <span class="crumb" id="p">浙江省</span>
        <span class="sep">/</span>
        <span class="crumb" id="c">杭州市</span>
        <span class="sep">/</span>
        <span class="crumb placeholder" id="a">请选择区</span>
      </div>

      <!-- 🔥 base-popup direction="bottom" -->
      <div class="popup-mask" id="mask" onclick="closePopup()"></div>
      <div class="popup popup-bottom" id="popup">
        <div class="popup-content">
          <div class="card-header base-card__header">
            <span class="card-title">选择地区</span>
            <span class="card-close" onclick="closePopup()">×</span>
          </div>
          <div class="card-body base-card__body" style="padding:0;">
            <div class="cascade-cols">
              <div class="cascade-col" id="col-province">
                <div class="col-item active">浙江省<span class="arrow">›</span></div>
                <div class="col-item">江苏省<span class="arrow">›</span></div>
                <div class="col-item">广东省<span class="arrow">›</span></div>
                <div class="col-item">四川省<span class="arrow">›</span></div>
              </div>
              <div class="cascade-col" id="col-city">
                <div class="col-item active">杭州市<span class="arrow">›</span></div>
                <div class="col-item">宁波市<span class="arrow">›</span></div>
                <div class="col-item">温州市<span class="arrow">›</span></div>
              </div>
              <div class="cascade-col" id="col-area">
                <div class="col-item">西湖区</div>
                <div class="col-item">拱墅区</div>
                <div class="col-item active">余杭区</div>
                <div class="col-item">滨江区</div>
                <div class="col-item">萧山区</div>
              </div>
            </div>
          </div>
          <div class="card-footer base-card__footer">
            <button onclick="closePopup()">取消</button>
            <button class="primary" onclick="closePopup()">确定</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-select / base-popup 组合</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">'cascade'（级联选择）</span></div>
    <div class="param-row"><span class="param-key">popup:</span><span class="param-val">direction='bottom'，三列联动布局</span></div>
    <div class="param-row"><span class="param-key">容器:</span><span class="param-val">base-popup 内置 base-card</span></div>
  </div>

  <script>
    function openPopup() {
      document.getElementById('mask').classList.add('show');
      document.getElementById('popup').classList.add('show');
    }
    function closePopup() {
      document.getElementById('mask').classList.remove('show');
      document.getElementById('popup').classList.remove('show');
    }
  </script>
</body>
</html>
