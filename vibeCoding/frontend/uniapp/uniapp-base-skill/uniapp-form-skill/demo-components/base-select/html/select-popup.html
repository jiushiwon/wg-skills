<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下拉选择 - 弹出面板</title>
  <link rel="stylesheet" href="../../../../demo-components/shared/base-preview.css" />
  <style>
    /* 业务专属样式（不在共享 CSS 里） */
    .popup-content { padding: var(--space-3) 0; }

    .card-header {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title { font-size: 16px; font-weight: 500; }
    .card-close { color: var(--color-text-tertiary); font-size: 22px; cursor: pointer; line-height: 1; }

    .option-row {
      padding: 14px var(--space-4);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .option-row:last-child { border-bottom: none; }
    .option-row:hover { background: #f8f8f8; }
    .option-row.selected { color: var(--color-primary); }
    .check { color: var(--color-primary); font-size: 16px; }

    .card-footer {
      padding: var(--space-3) var(--space-4);
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: var(--space-2);
    }
    .card-footer button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-bg-surface);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
    }
    .card-footer .primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
  </style>
</head>
<body>
  <!-- 图标 sprite（内联，避免跨域） -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9l6 6l6-9"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 6l6 6l-6 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7l-7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21l-4.3-4.3"/></g></symbol>
  </svg>
  <!-- 外层 preview 就是 base-card 容器 -->
  <div class="preview base-card">
    <div class="preview-header base-card__header">
      <span>下拉选择 · 弹出面板</span>
      <span style="font-size:12px;color:#999;">demo</span>
    </div>
    <div class="preview-body base-card__body">
      <div class="select-field">
        <span class="select-label" style="font-size:14px;color:var(--color-text-secondary);margin-bottom:var(--space-2);display:block;">选择规格</span>
        <div class="select-trigger" onclick="openPopup()" style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:#f5f5f5;border-radius:var(--radius-md);cursor:pointer;">
          <span id="selected">点击选择</span>
          <svg class="icon icon-12 icon-tertiary"><use href="#i-chevron-down"/></svg>
        </div>
      </div>

      <!-- base-popup 容器：direction="bottom" -->
      <div class="popup-mask" id="mask" onclick="closePopup()"></div>
      <div class="popup popup-bottom" id="popup">
        <!-- 内部就是 base-card -->
        <div class="popup-content">
          <div class="card-header base-card__header">
            <span class="card-title">选择规格</span>
            <span class="card-close" onclick="closePopup()"><svg class="icon icon-22"><use href="#i-x"/></svg></span>
          </div>
          <div class="card-body base-card__body" style="flex:1;">
            <div class="option-row" onclick="pick(this,'256G')"><span>256G</span><svg class="icon icon-14" style="visibility:hidden"><use href="#i-check"/></svg></div>
            <div class="option-row selected" onclick="pick(this,'512G')"><span>512G</span><svg class="icon icon-14 icon-primary"><use href="#i-check"/></svg></div>
            <div class="option-row" onclick="pick(this,'1T')"><span>1T</span><svg class="icon icon-14" style="visibility:hidden"><use href="#i-check"/></svg></div>
            <div class="option-row disabled" style="color:#bbb;cursor:not-allowed;"><span>2T（无货）</span><svg class="icon icon-14" style="visibility:hidden"><use href="#i-check"/></svg></div>
          </div>
          <div class="card-footer base-card__footer">
            <button onclick="closePopup()">取消</button>
            <button class="primary" onclick="closePopup()">确定</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-select / base-popup 组合</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">'popup'（弹出面板模式）</span></div>
    <div class="param-row"><span class="param-key">popup:</span><span class="param-val">direction='bottom' + radius='16px'</span></div>
    <div class="param-row"><span class="param-key">容器:</span><span class="param-val">base-popup 内置 base-card</span></div>
  </div>

  <script>
    function openPopup() {
      document.getElementById('mask').classList.add('show');
      document.getElementById('popup').classList.add('show');
    }
    function closePopup() {
      document.getElementById('mask').classList.remove('show');
      document.getElementById('popup').classList.remove('show');
    }
    function pick(el, val) {
      if (el.classList.contains('disabled')) return;
      document.querySelectorAll('.option-row').forEach(r => {
        r.classList.remove('selected');
        r.querySelector('.check').innerHTML = '';
      });
      el.classList.add('selected');
      el.querySelector('.check').innerHTML = '<svg class="icon icon-12 icon-primary"><use href="#i-check"/></svg>';
      document.getElementById('selected').textContent = val;
    }
  </script>
</body>
</html>
