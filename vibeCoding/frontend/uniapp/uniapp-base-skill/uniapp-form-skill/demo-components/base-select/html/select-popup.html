<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下拉选择 - 弹出面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .preview-body { padding: var(--space-4); }

    .select-field { margin-bottom: var(--space-4); }
    .select-label { font-size: 14px; color: var(--color-text-secondary); margin-bottom: var(--space-2); display: block; }
    .select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px var(--space-3);
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .select-trigger-text { font-size: 15px; color: var(--color-text); }
    .select-trigger-placeholder { color: var(--color-text-tertiary); }
    .select-trigger-arrow { color: var(--color-text-tertiary); font-size: 12px; }

    /* 弹出遮罩 */
    .popup-mask {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
    }
    .popup-mask.show { display: block; }

    /* 弹出面板 */
    .popup-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--color-bg-surface);
      border-radius: 16px 16px 0 0;
      max-height: 60vh;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 101;
    }
    .popup-panel.show { transform: translateY(0); }
    .popup-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4); border-bottom: 1px solid var(--color-border); }
    .popup-title { font-size: 16px; font-weight: 600; color: var(--color-text); }
    .popup-close { font-size: 20px; color: var(--color-text-tertiary); cursor: pointer; }
    .popup-body { padding: var(--space-3); max-height: 50vh; overflow-y: auto; }
    .popup-option {
      padding: 14px var(--space-3);
      font-size: 15px;
      color: var(--color-text);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .popup-option:hover { background: #f5f5f5; }
    .popup-option.selected { color: var(--color-primary); font-weight: 500; }
    .popup-option .check { display: none; }
    .popup-option.selected .check { display: block; color: var(--color-primary); }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-body">
      <div class="select-field">
        <span class="select-label">选择收货地址</span>
        <div class="select-trigger" onclick="openPopup()">
          <span class="select-trigger-text">请选择省市区</span>
          <span class="select-trigger-arrow">›</span>
        </div>
      </div>
    </div>
  </div>

  <div class="popup-mask" id="popupMask" onclick="closePopup()"></div>
  <div class="popup-panel" id="popupPanel">
    <div class="popup-header">
      <span class="popup-title">选择地区</span>
      <span class="popup-close" onclick="closePopup()">×</span>
    </div>
    <div class="popup-body">
      <div class="popup-option selected" onclick="selectPopup(this, '北京市')">北京市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '上海市')">上海市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '广州市')">广州市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '深圳市')">深圳市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '杭州市')">杭州市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '南京市')">南京市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '成都市')">成都市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '武汉市')">武汉市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '西安市')">西安市 <span class="check">✓</span></div>
      <div class="popup-option" onclick="selectPopup(this, '重庆市')">重庆市 <span class="check">✓</span></div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-select 参数</div>
    <div class="param-row"><span class="param-key">popup:</span><span class="param-val">true</span></div>
    <div class="param-row"><span class="param-key">direction:</span><span class="param-val">bottom</span></div>
  </div>

  <script>
    function openPopup() {
      document.getElementById('popupMask').classList.add('show');
      document.getElementById('popupPanel').classList.add('show');
    }
    function closePopup() {
      document.getElementById('popupMask').classList.remove('show');
      document.getElementById('popupPanel').classList.remove('show');
    }
    function selectPopup(el, value) {
      document.querySelectorAll('.popup-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      document.querySelector('.select-trigger-text').textContent = value;
      closePopup();
    }
  </script>
</body>
</html>
