<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下拉选择 - 宫格选择</title>
  <link rel="stylesheet" href="../../../../demo-components/shared/base-preview.css" />
  <style>

    .select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
    .select-grid-item {
      padding: 16px 8px;
      background: #f5f5f5;
      border-radius: var(--radius-md);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .select-grid-item:hover { background: #e8e8e8; }
    .select-grid-item.selected { background: #e6f0ff; border-color: var(--color-primary); }
    .select-grid-icon { font-size: 24px; margin-bottom: 4px; }
    .select-grid-label { font-size: 13px; color: var(--color-text); }
    .select-grid-item.selected .select-grid-label { color: var(--color-primary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="preview base-card">
    <div class="preview-header base-card__header">宫格选择</div>
    <div class="preview-body base-card__body">
      <div style="font-size: 14px; color: #666; margin-bottom: 12px;">选择支付方式</div>
      <div class="select-grid">
        <div class="select-grid-item selected" onclick="selectGrid(this)">
          <div class="select-grid-icon">💳</div>
          <div class="select-grid-label">银行卡</div>
        </div>
        <div class="select-grid-item" onclick="selectGrid(this)">
          <div class="select-grid-icon">💰</div>
          <div class="select-grid-label">余额</div>
        </div>
        <div class="select-grid-item" onclick="selectGrid(this)">
          <div class="select-grid-icon">🎫</div>
          <div class="select-grid-label">代金券</div>
        </div>
        <div class="select-grid-item" onclick="selectGrid(this)">
          <div class="select-grid-icon">📱</div>
          <div class="select-grid-label">手机卡</div>
        </div>
        <div class="select-grid-item" onclick="selectGrid(this)">
          <div class="select-grid-icon">🎁</div>
          <div class="select-grid-label">礼品卡</div>
        </div>
        <div class="select-grid-item" onclick="selectGrid(this)">
          <div class="select-grid-icon">💎</div>
          <div class="select-grid-label">积分</div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-select 参数</div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">grid</span></div>
    <div class="param-row"><span class="param-key">columns:</span><span class="param-val">3</span></div>
  </div>

  <script>
    function selectGrid(el) {
      document.querySelectorAll('.select-grid-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
