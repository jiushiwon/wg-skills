<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下拉选择 - 标签多选</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .preview-header { height: 44px; background: var(--color-bg-surface); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--color-border); font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); }

    .select-tag-group { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .select-tag {
      padding: 8px 14px;
      background: #f5f5f5;
      border-radius: 20px;
      font-size: 14px;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .select-tag:hover { background: #e8e8e8; }
    .select-tag.selected { background: #e6f0ff; color: var(--color-primary); border-color: var(--color-primary); }
    .select-tag .check-icon { display: none; width: 14px; height: 14px; }
    .select-tag.selected .check-icon { display: inline; }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 70px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">标签多选</div>
    <div class="preview-body">
      <div style="font-size: 14px; color: #666; margin-bottom: 12px;">选择兴趣爱好（可多选）</div>
      <div class="select-tag-group">
        <div class="select-tag selected" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 音乐
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 电影
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 阅读
        </div>
        <div class="select-tag selected" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 旅行
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 摄影
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 健身
        </div>
        <div class="select-tag selected" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 美食
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 游戏
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 科技
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 艺术
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 时尚
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 运动
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-select 参数</div>
    <div class="param-row"><span class="param-key">multiple:</span><span class="param-val">true</span></div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">tag</span></div>
  </div>

  <script>
    function toggleTag(el) {
      el.classList.toggle('selected');
    }
  </script>
</body>
</html>
