<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下拉选择 - 标签多选</title>
  <link rel="stylesheet" href="../../../../demo-components/shared/base-preview.css" />
  <style>

    .select-tag-group { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .select-tag {
      padding: 8px 14px;
      background: #f5f5f5;
      border-radius: 20px;
      font-size: 14px;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .select-tag:hover { background: #e8e8e8; }
    .select-tag.selected { background: #e6f0ff; color: var(--color-primary); border-color: var(--color-primary); }
    .select-tag .check-icon { display: none; width: 14px; height: 14px; }
    .select-tag.selected .check-icon { display: inline; }
  </style>
</head>
<body>
  <div class="preview base-card">
    <div class="preview-header base-card__header">标签多选</div>
    <div class="preview-body base-card__body">
      <div style="font-size: 14px; color: #666; margin-bottom: 12px;">选择兴趣爱好（可多选）</div>
      <div class="select-tag-group">
        <div class="select-tag selected" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 音乐
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 电影
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 阅读
        </div>
        <div class="select-tag selected" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 旅行
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 摄影
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 健身
        </div>
        <div class="select-tag selected" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 美食
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 游戏
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 科技
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 艺术
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 时尚
        </div>
        <div class="select-tag" onclick="toggleTag(this)">
          <span class="check-icon">✓</span> 运动
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-select 参数</div>
    <div class="param-row"><span class="param-key">multiple:</span><span class="param-val">true</span></div>
    <div class="param-row"><span class="param-key">type:</span><span class="param-val">tag</span></div>
  </div>

  <script>
    function toggleTag(el) {
      el.classList.toggle('selected');
    }
  </script>
</body>
</html>
