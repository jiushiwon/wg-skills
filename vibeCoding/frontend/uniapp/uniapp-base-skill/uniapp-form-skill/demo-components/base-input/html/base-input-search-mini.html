<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-input 搜索栏 - 迷你形（mini 浅底 999px）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-full: 999px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-bg: #F5F7FA;
      --color-bg-surface: #fff;
      --color-primary: #4A90E2;
      --color-text: #1A1A1A;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
    }
    body { background: #f5f5f5; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .title { text-align: center; margin-bottom: 10px; font-size: 14px; color: #666; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg-surface); overflow: hidden; min-height: 700px; }
    .preview-body { padding: var(--space-4); }

    .top-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4A90E2, #7AB8FF);
      flex-shrink: 0;
    }
    .search-bar {
      flex: 1;
      background: var(--color-bg);
      border-radius: var(--radius-full);
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 var(--space-3);
      gap: var(--space-2);
      box-shadow: none;
    }
    .search-icon { width: 14px; height: 14px; color: var(--color-text-tertiary); flex-shrink: 0; }
    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 13px;
      outline: none;
      color: var(--color-text);
      min-width: 0;
    }
    .search-input::placeholder { color: var(--color-text-tertiary); }
    .suffix-icon { width: 14px; height: 14px; color: var(--color-text-tertiary); flex-shrink: 0; cursor: pointer; }

    .desc {
      margin-top: var(--space-4);
      padding: var(--space-3);
      background: var(--color-bg);
      border-radius: 8px;
      font-size: 12px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .desc strong { color: var(--color-text); }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; max-width: 375px; margin-left: auto; margin-right: auto; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: #1890ff; width: 110px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="title">参考: base-input 搜索栏 · 迷你（mini）</div>
  <div class="preview">
    <div class="preview-body">

      <div class="top-row">
        <div class="avatar"></div>
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input class="search-input" placeholder="搜一搜">
          <svg class="suffix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </div>
      </div>

      <div class="desc">
        <strong>迷你胶囊（mini 浅底 999px + 36px）</strong> —— 浅底胶囊 + 缩小高度 + 内联布局。常见于头像旁的搜索条、横向 Tab 标题栏、消息列表内嵌搜索。
      </div>

    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-input Props</div>
    <div class="param-row"><span class="param-key">shape:</span><span class="param-val">mini</span></div>
    <div class="param-row"><span class="param-key">radius:</span><span class="param-val">999px</span></div>
    <div class="param-row"><span class="param-key">height:</span><span class="param-val">36px（缩小）</span></div>
    <div class="param-row"><span class="param-key">background:</span><span class="param-val">--color-bg（浅底）</span></div>
    <div class="param-row"><span class="param-key">典型场景:</span><span class="param-val">头像旁、横向 Tab 栏、消息内嵌</span></div>
  </div>
</body>
</html>
