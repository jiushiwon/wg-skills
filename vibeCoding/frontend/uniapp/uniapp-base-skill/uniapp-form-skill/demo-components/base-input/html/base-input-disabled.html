<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-input 禁用/只读场景 - 参考图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-bg: #F5F7FA;
      --color-bg-surface: #fff;
      --color-text: #1A1A1A;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-border: #F0F2F5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    }
    body { background: #f5f5f5; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .title { text-align: center; margin-bottom: 10px; font-size: 14px; color: #666; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); overflow: hidden; min-height: 700px; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

    .form-card {
      background: var(--color-bg-surface);
      border-radius: 0;
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .form-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: var(--space-3); }

    .input-item { display: flex; flex-direction: column; gap: var(--space-1); }
    .input-label { font-size: 14px; color: var(--color-text); font-weight: 500; }

    .input-body {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3);
      background: var(--color-bg-surface);
      border-radius: var(--radius-md);
    }
    .input-body.border-all { border: 1px solid var(--color-border); }
    .input-body.disabled { background: var(--color-bg); }
    .input-body.readonly { background: var(--color-bg); }

    .input-control {
      flex: 1;
      font-size: 14px;
      color: var(--color-text);
      background: transparent;
      border: none;
      outline: none;
      height: 44px;
      line-height: 44px;
    }
    .input-control.disabled { color: var(--color-text-tertiary); cursor: not-allowed; }
    .input-control.readonly { color: var(--color-text-secondary); }
    .input-control::placeholder { color: var(--color-text-tertiary); }

    .state-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--color-bg);
      color: var(--color-text-tertiary);
      flex-shrink: 0;
    }

    .divider {
      height: 1px;
      background: var(--color-border);
      margin: var(--space-3) calc(-1 * var(--space-4));
    }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; max-width: 375px; margin-left: auto; margin-right: auto; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: #1890ff; width: 110px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="title">参考: base-input 禁用/只读场景</div>
  <div class="preview">
    <div class="preview-header">表单状态</div>
    <div class="preview-body">
      <div class="form-card">
        <div class="form-title">订单详情</div>

        <div class="input-item">
          <label class="input-label">订单号</label>
          <div class="input-body border-all readonly">
            <input class="input-control readonly" placeholder="20260818001" readonly>
            <span class="state-tag">只读</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="input-item">
          <label class="input-label">商品名称</label>
          <div class="input-body border-all disabled">
            <input class="input-control disabled" placeholder="已下架商品" disabled>
            <span class="state-tag">禁用</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="input-item">
          <label class="input-label">收货地址</label>
          <div class="input-body border-all disabled">
            <input class="input-control disabled" placeholder="北京市朝阳区 xxx 路 1 号" disabled>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-input Props</div>
    <div class="param-row"><span class="param-key">disabled:</span><span class="param-val">禁用态（灰底，无法编辑）</span></div>
    <div class="param-row"><span class="param-key">readonly:</span><span class="param-val">只读态（灰底，可复制）</span></div>
    <div class="param-row"><span class="param-key">典型场景:</span><span class="param-val">订单详情、提交后表单、不可修改字段</span></div>
  </div>
</body>
</html>
