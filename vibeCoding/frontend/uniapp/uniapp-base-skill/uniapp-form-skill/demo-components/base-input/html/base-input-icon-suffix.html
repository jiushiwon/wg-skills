<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-input 后缀图标场景 - 参考图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-md: 8px;
      --radius-full: 999px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-bg: #F5F7FA;
      --color-bg-soft: #F2F4F7;
      --color-bg-surface: #fff;
      --color-primary: #4A90E2;
      --color-text: #1A1A1A;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-border: #F0F2F5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    }
    body { background: #f5f5f5; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .title { text-align: center; margin-bottom: 10px; font-size: 14px; color: #666; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); overflow: hidden; min-height: 700px; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

    .form-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .form-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: var(--space-3); }

    .input-item { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-3); }
    .input-item:last-child { margin-bottom: 0; }
    .input-label { font-size: 13px; color: var(--color-text-secondary); font-weight: 500; }

    .input-body {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3);
      background: var(--color-bg-soft);
      border-radius: var(--radius-md);
    }

    .input-control {
      flex: 1;
      font-size: 14px;
      color: var(--color-text);
      background: transparent;
      border: none;
      outline: none;
      height: 44px;
      line-height: 44px;
      min-width: 0;
    }
    .input-control::placeholder { color: var(--color-text-tertiary); }

    .suffix-icon { width: 18px; height: 18px; color: var(--color-text-tertiary); flex-shrink: 0; cursor: pointer; }
    .suffix-text { font-size: 13px; color: var(--color-text-tertiary); flex-shrink: 0; }
    .suffix-btn {
      font-size: 13px;
      color: var(--color-primary);
      padding-left: var(--space-2);
      flex-shrink: 0;
      border-left: 1px solid var(--color-border);
      height: 20px;
      line-height: 20px;
    }
    .code-chip {
      width: 24px;
      height: 24px;
      background: var(--color-primary);
      color: #fff;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; max-width: 375px; margin-left: auto; margin-right: auto; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: #1890ff; width: 110px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="title">参考: base-input 后缀图标场景</div>
  <div class="preview">
    <div class="preview-header">账号信息</div>
    <div class="preview-body">
      <div class="form-card">
        <div class="form-title">后缀场景</div>

        <!-- 邮箱 - 后缀清除 icon -->
        <div class="input-item">
          <label class="input-label">邮箱（icon 后缀清除）</label>
          <div class="input-body">
            <input class="input-control" placeholder="请输入邮箱">
            <svg class="suffix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m15 9-6 6M9 9l6 6"></path>
            </svg>
          </div>
        </div>

        <!-- 手机号 - 后缀验证码按钮 -->
        <div class="input-item">
          <label class="input-label">手机号（按钮后缀）</label>
          <div class="input-body">
            <input class="input-control" placeholder="请输入手机号">
            <span class="suffix-btn">发送验证码</span>
          </div>
        </div>

        <!-- 金额 - 后缀单位文本 -->
        <div class="input-item">
          <label class="input-label">金额（文本后缀）</label>
          <div class="input-body">
            <input class="input-control" placeholder="请输入金额">
            <span class="suffix-text">元</span>
          </div>
        </div>

        <!-- 邀请码 - 后置验证码胶囊 -->
        <div class="input-item">
          <label class="input-label">邀请码（胶囊后缀）</label>
          <div class="input-body">
            <input class="input-control" placeholder="请输入邀请码">
            <div class="code-chip">优</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-input Slots</div>
    <div class="param-row"><span class="param-key">slot suffix:</span><span class="param-val">清除 icon / 验证码按钮 / 单位文本 / 标签胶囊</span></div>
    <div class="param-row"><span class="param-key">典型场景:</span><span class="param-val">表单清除、验证码、单位显示、邀请奖励</span></div>
  </div>
</body>
</html>
