<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Image - 图片选项</title>
  <style>
    :root {
      --color-primary: #07c160;
      --color-primary-light: #e8f5e9;
      --color-bg-surface: #ffffff;
      --color-border: #e8e8e8;
      --color-text: #333333;
      --color-text-secondary: #666666;
      --radius-md: 8px;
      --space-3: 12px;
      --space-2: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 20px; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .demo-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--color-text); }

    /* Image 选项 */
    .radio-image { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
    .image-item {
      aspect-ratio: 1; border-radius: var(--radius-md); overflow: hidden;
      border: 2px solid transparent; cursor: pointer; position: relative;
      background: #eee;
    }
    .image-item img { width: 100%; height: 100%; object-fit: cover; }
    .image-item.selected { border-color: var(--color-primary); }
    .image-item.selected::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='white' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='M20 6L9 17l-5-5'/></svg>"); background-size: contain; background-repeat: no-repeat;
      width: 20px; height: 20px; background: var(--color-primary);
      color: #fff; border-radius: 50%; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }

    /* 头像选择 */
    .radio-avatar { display: flex; gap: var(--space-3); }
    .avatar-item {
      width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
      border: 2px solid transparent; cursor: pointer; position: relative;
    }
    .avatar-item img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-item.selected { border-color: var(--color-primary); }
    .avatar-item.selected::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; background: var(--color-primary);
    }

    /* Demo cards */
    .demo-card { margin-bottom: 24px; }
    .demo-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--color-text); }
    .demo-card .label { font-size: 14px; color: #666; margin-bottom: 8px; display: block; }
  </style>
</head>
<body>
  <div class="demo-card">
    <div class="demo-title">头像选择</div>
    <div class="radio-avatar">
      <div class="avatar-item selected" onclick="selectAvatar(this)">
        <img src="https://loremflickr.com/100/100/cat?random=1" alt="头像1">
      </div>
      <div class="avatar-item" onclick="selectAvatar(this)">
        <img src="https://loremflickr.com/100/100/dog?random=2" alt="头像2">
      </div>
      <div class="avatar-item" onclick="selectAvatar(this)">
        <img src="https://loremflickr.com/100/100/bird?random=3" alt="头像3">
      </div>
      <div class="avatar-item" onclick="selectAvatar(this)">
        <img src="https://loremflickr.com/100/100/hamster?random=4" alt="头像4">
      </div>
    </div>
  </div>

  <div class="demo-card">
    <div class="demo-title">商品规格选择</div>
    <div class="radio-image">
      <div class="image-item selected" onclick="selectImage(this)">
        <img src="https://loremflickr.com/150/150/product?random=5" alt="规格1">
      </div>
      <div class="image-item" onclick="selectImage(this)">
        <img src="https://loremflickr.com/150/150/product?random=6" alt="规格2">
      </div>
      <div class="image-item" onclick="selectImage(this)">
        <img src="https://loremflickr.com/150/150/product?random=7" alt="规格3">
      </div>
    </div>
  </div>

  <script>
    function selectAvatar(el) {
      document.querySelectorAll('.avatar-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
    function selectImage(el) {
      document.querySelectorAll('.image-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>

  <div style="background:#f7f7f7;padding:12px;border-radius:8px;margin-top:16px;">
    <div style="font-size:14px;font-weight:600;color:#333;margin-bottom:12px;">头像选择 · 商品规格</div>
    <div style="font-size:12px;color:#999;margin-bottom:8px;">base-radio 参数</div>
    <div style="display:flex;font-size:12px;margin-bottom:4px;">
      <span style="color:#4a90e2;width:70px;">type:</span>
      <span style="color:#666;">image</span>
    </div>
    <div style="display:flex;font-size:12px;margin-bottom:4px;">
      <span style="color:#4a90e2;width:70px;">mode:</span>
      <span style="color:#666;">avatar | image</span>
    </div>
  </div>
</body>
</html>
