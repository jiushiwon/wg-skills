<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-popup / 04 - 右侧筛选</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

    .preview {
      max-width: 375px;
      margin: 0 auto;
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }
    .preview-header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--color-border);
      font-size: 16px;
      font-weight: 500;
    }
    .preview-body { padding: var(--space-4); min-height: 480px; position: relative; }

    .trigger {
      padding: 12px var(--space-4);
      background: var(--color-primary);
      color: #fff;
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 15px;
      cursor: pointer;
    }

    .popup-mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s;
    }
    .popup-mask.show { opacity: 1; visibility: visible; }

    /* 右侧抽屉：圆角在左侧 */
    .popup {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 320px;
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .popup.show { transform: translateX(0); }

    /* 内置 base-card */
    .popup-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title { font-size: 16px; font-weight: 500; }
    .card-close { color: var(--color-text-tertiary); font-size: 22px; cursor: pointer; }

    .card-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-3) var(--space-4);
    }
    .filter-section { margin-bottom: var(--space-4); }
    .filter-label { font-size: 13px; color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
    .filter-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-tag {
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      background: var(--color-bg-surface);
    }
    .filter-tag.active {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .price-range { display: flex; align-items: center; gap: var(--space-2); }
    .price-input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 14px;
    }

    .card-footer {
      padding: var(--space-3) var(--space-4);
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: var(--space-2);
    }
    .card-footer button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-bg-surface);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
    }
    .card-footer .primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 100px; }
    .param-val { color: #666; }
  
    /* 图标系统（Lucide 风格） */
    .icon {
      display: inline-block;
      width: 1em; height: 1em;
      vertical-align: -0.125em;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }
    .icon-12 { font-size: 12px; }
    .icon-14 { font-size: 14px; }
    .icon-16 { font-size: 16px; }
    .icon-18 { font-size: 18px; }
    .icon-20 { font-size: 20px; }
    .icon-22 { font-size: 22px; }
    .icon-24 { font-size: 24px; }
    .icon-primary { color: var(--color-primary); }
    .icon-white { color: #fff; }
  </style>
</head>
<body>
  <!-- 图标 sprite（内联，避免跨域） -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9l6 6l6-9"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 6l6 6l-6 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7l-7 7"/></symbol>
    <symbol id="i-triangle-alert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21l-4.3-4.3"/></g></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18M6 12h12M10 18h4"/></symbol>
    <symbol id="i-share-2" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51l6.83 3.98m-.01-10.98l-6.82 3.98"/></g></symbol>
    <symbol id="i-message-circle" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0a2.34 2.34 0 0 0 3.319 1.915a2.34 2.34 0 0 1 2.33 4.033a2.34 2.34 0 0 0 0 3.831a2.34 2.34 0 0 1-2.33 4.033a2.34 2.34 0 0 0-3.319 1.915a2.34 2.34 0 0 1-4.659 0a2.34 2.34 0 0 0-3.32-1.915a2.34 2.34 0 0 1-2.33-4.033a2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.268 21a2 2 0 0 0 3.464 0M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497zM15 5l4 4"/></symbol>
  </svg>
  <div class="preview base-card">
    <div class="preview-header base-card__header">
      <span>base-popup / 右侧筛选</span>
    </div>
    <div class="preview-body base-card__body">
      <div class="trigger" onclick="document.getElementById('mask').classList.add('show');document.getElementById('popup').classList.add('show');">
        打开右侧筛选
      </div>

      <div class="popup-mask" id="mask" onclick="this.classList.remove('show');document.getElementById('popup').classList.remove('show');"></div>
      <div class="popup" id="popup">
        <div class="popup-content">
          <div class="card-header base-card__header">
            <span class="card-title">筛选</span>
            <span class="card-close" onclick="this.closest(".popup").classList.remove("show");document.getElementById("mask").classList.remove("show");"><svg class="icon icon-22"><use href="#i-x"/></svg></span>
          </div>
          <div class="card-body base-card__body">
            <div class="filter-section">
              <div class="filter-label">分类</div>
              <div class="filter-tags">
                <span class="filter-tag active">全部</span>
                <span class="filter-tag">手机</span>
                <span class="filter-tag">电脑</span>
                <span class="filter-tag">耳机</span>
                <span class="filter-tag">平板</span>
              </div>
            </div>
            <div class="filter-section">
              <div class="filter-label">价格区间</div>
              <div class="price-range">
                <input class="price-input" placeholder="最低价" />
                <span style="color:#999;">—</span>
                <input class="price-input" placeholder="最高价" />
              </div>
            </div>
            <div class="filter-section">
              <div class="filter-label">品牌</div>
              <div class="filter-tags">
                <span class="filter-tag">Apple</span>
                <span class="filter-tag active">华为</span>
                <span class="filter-tag">小米</span>
                <span class="filter-tag">三星</span>
                <span class="filter-tag">OPPO</span>
              </div>
            </div>
          </div>
          <div class="card-footer base-card__footer">
            <button onclick="this.closest('.popup').classList.remove('show');document.getElementById('mask').classList.remove('show');">重置</button>
            <button class="primary" onclick="this.closest('.popup').classList.remove('show');document.getElementById('mask').classList.remove('show');">确定</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-popup 参数</div>
    <div class="param-row"><span class="param-key">direction:</span><span class="param-val">'right'（右侧）</span></div>
    <div class="param-row"><span class="param-key">width:</span><span class="param-val">'320px'（更宽）</span></div>
    <div class="param-row"><span class="param-key">组合:</span><span class="param-val">base-card footer slot（确定/重置）</span></div>
  </div>
</body>
</html>
