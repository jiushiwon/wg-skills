<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-popup / 02 - 顶部通知</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-warning: #fa8c16;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

    .preview {
      max-width: 375px;
      margin: 0 auto;
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .preview-header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--color-border);
      font-size: 16px;
      font-weight: 500;
    }
    .preview-body { padding: var(--space-4); min-height: 480px; position: relative; }

    .trigger {
      padding: 12px var(--space-4);
      background: var(--color-warning);
      color: #fff;
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 15px;
      cursor: pointer;
    }

    .popup-mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s;
    }
    .popup-mask.show { opacity: 1; visibility: visible; }

    /* 顶部弹出：圆角在底部 */
    .popup {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: var(--color-bg-surface);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    .popup.show { transform: translateY(0); }

    /* 内置 base-card */
    .popup-content { padding: var(--space-3) var(--space-4); }
    .card-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding-bottom: var(--space-2);
    }
    .card-icon {
      width: 32px; height: 32px;
      background: var(--color-warning);
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .card-title { font-size: 16px; font-weight: 500; flex: 1; }
    .card-close { color: var(--color-text-tertiary); font-size: 22px; cursor: pointer; }

    .card-body {
      padding: var(--space-3) 0;
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .card-actions {
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: var(--space-2);
    }
    .card-actions button {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-bg-surface);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
    }
    .card-actions .primary {
      background: var(--color-warning);
      color: #fff;
      border-color: var(--color-warning);
    }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 100px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview base-card">
    <div class="preview-header base-card__header">
      <span>base-popup / 顶部通知</span>
    </div>
    <div class="preview-body base-card__body">
      <div class="trigger" onclick="document.getElementById('mask').classList.add('show');document.getElementById('popup').classList.add('show');">
        弹出顶部通知
      </div>

      <div class="popup-mask" id="mask" onclick="this.classList.remove('show');document.getElementById('popup').classList.remove('show');"></div>
      <div class="popup" id="popup">
        <div class="popup-content">
          <div class="card-header base-card__header">
            <span class="card-icon">!</span>
            <span class="card-title">系统通知</span>
            <span class="card-close" onclick="this.closest('.popup').classList.remove('show');document.getElementById('mask').classList.remove('show');">×</span>
          </div>
          <div class="card-body base-card__body">
            您有 3 条未读消息，点击查看详情 → 系统将在 5 分钟后自动关闭。
          </div>
          <div class="card-actions base-card__footer">
            <button onclick="this.closest('.popup').classList.remove('show');document.getElementById('mask').classList.remove('show');">稍后提醒</button>
            <button class="primary" onclick="this.closest('.popup').classList.remove('show');document.getElementById('mask').classList.remove('show');">立即查看</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-popup 参数</div>
    <div class="param-row"><span class="param-key">direction:</span><span class="param-val">'top'（顶部通知）</span></div>
    <div class="param-row"><span class="param-key">radius:</span><span class="param-val">'12px'（底部左右两角）</span></div>
    <div class="param-row"><span class="param-key">height:</span><span class="param-val">'auto'（高度自适应）</span></div>
  </div>
</body>
</html>
