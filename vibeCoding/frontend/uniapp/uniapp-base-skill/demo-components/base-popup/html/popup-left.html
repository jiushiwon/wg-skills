<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-popup / 03 - 左侧抽屉</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --color-primary: #4a90e2;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #e8e8e8;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

    .preview {
      max-width: 375px;
      margin: 0 auto;
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }
    .preview-header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--color-border);
      font-size: 16px;
      font-weight: 500;
    }
    .preview-body { padding: var(--space-4); min-height: 480px; position: relative; }

    .trigger {
      padding: 12px var(--space-4);
      background: var(--color-primary);
      color: #fff;
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 15px;
      cursor: pointer;
    }

    .popup-mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s;
    }
    .popup-mask.show { opacity: 1; visibility: visible; }

    /* 左侧抽屉：圆角在右侧 */
    .popup {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      background: var(--color-bg-surface);
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .popup.show { transform: translateX(0); }

    /* 内置 base-card：填满抽屉 */
    .popup-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--space-3) 0;
    }
    .card-header {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .card-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
    }
    .card-name { font-size: 15px; font-weight: 500; }
    .card-meta { font-size: 12px; color: var(--color-text-tertiary); }

    .menu-list { flex: 1; padding: var(--space-2) 0; }
    .menu-item {
      padding: 12px var(--space-4);
      font-size: 14px;
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .menu-item:hover { background: #f8f8f8; }
    .menu-icon {
      width: 20px; height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
      font-size: 14px;
    }
    .menu-arrow {
      margin-left: auto;
      color: var(--color-text-tertiary);
      font-size: 12px;
    }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 100px; }
    .param-val { color: #666; }

    /* 图标系统（Lucide 风格） */
    .icon {
      display: inline-block;
      width: 1em; height: 1em;
      vertical-align: -0.125em;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }
    .icon-12 { font-size: 12px; }
    .icon-14 { font-size: 14px; }
    .icon-16 { font-size: 16px; }
    .icon-18 { font-size: 18px; }
    .icon-22 { font-size: 22px; }
    .icon-24 { font-size: 24px; }
    .icon-primary { color: var(--color-primary); }
    .icon-secondary { color: var(--color-text-secondary); }
    .icon-tertiary { color: var(--color-text-tertiary); }
  </style>
</head>
<body>
  <!-- 图标 sprite（内联，避免跨域） -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497zM15 5l4 4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.268 21a2 2 0 0 0 3.464 0M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0a2.34 2.34 0 0 0 3.319 1.915a2.34 2.34 0 0 1 2.33 4.033a2.34 2.34 0 0 0 0 3.831a2.34 2.34 0 0 1-2.33 4.033a2.34 2.34 0 0 0-3.319 1.915a2.34 2.34 0 0 1-4.659 0a2.34 2.34 0 0 0-3.32-1.915a2.34 2.34 0 0 1-2.33-4.033a2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></g></symbol>
    <symbol id="i-help-circle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3m0 4h.01"/></g></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 6l6 6l-6 6"/></symbol>
  </svg>

  <div class="preview base-card">
    <div class="preview-header base-card__header">
      <span>base-popup / 左侧抽屉</span>
    </div>
    <div class="preview-body base-card__body">
      <div class="trigger" onclick="document.getElementById('mask').classList.add('show');document.getElementById('popup').classList.add('show');">
        打开左侧抽屉
      </div>

      <div class="popup-mask" id="mask" onclick="this.classList.remove('show');document.getElementById('popup').classList.remove('show');"></div>
      <div class="popup" id="popup">
        <!-- 抽屉本身就是 base-card 容器 -->
        <div class="popup-content">
          <div class="card-header base-card__header">
            <span class="card-avatar">张</span>
            <div>
              <div class="card-name">张三</div>
              <div class="card-meta">zhang@example.com</div>
            </div>
          </div>
          <div class="menu-list">
            <div class="menu-item"><span class="menu-icon"><svg class="icon icon-14 icon-white"><use href="#i-user"/></svg></span>个人资料<svg class="menu-arrow icon icon-14 icon-tertiary"><use href="#i-chevron-right"/></svg></div>
            <div class="menu-item"><span class="menu-icon"><svg class="icon icon-14 icon-white"><use href="#i-edit"/></svg></span>我的订单<svg class="menu-arrow icon icon-14 icon-tertiary"><use href="#i-chevron-right"/></svg></div>
            <div class="menu-item"><span class="menu-icon"><svg class="icon icon-14 icon-white"><use href="#i-settings"/></svg></span>账户设置<svg class="menu-arrow icon icon-14 icon-tertiary"><use href="#i-chevron-right"/></svg></div>
            <div class="menu-item"><span class="menu-icon"><svg class="icon icon-14 icon-white"><use href="#i-bell"/></svg></span>消息中心<svg class="menu-arrow icon icon-14 icon-tertiary"><use href="#i-chevron-right"/></svg></div>
            <div class="menu-item"><span class="menu-icon"><svg class="icon icon-14 icon-white"><use href="#i-help-circle"/></svg></span>帮助与反馈<svg class="menu-arrow icon icon-14 icon-tertiary"><use href="#i-chevron-right"/></svg></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-popup 参数</div>
    <div class="param-row"><span class="param-key">direction:</span><span class="param-val">'left'（左侧抽屉）</span></div>
    <div class="param-row"><span class="param-key">width:</span><span class="param-val">'280px'（默认）</span></div>
    <div class="param-row"><span class="param-key">radius:</span><span class="param-val">'12px'（右侧上下两角）</span></div>
  </div>
</body>
</html>
