<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页 - 手机号验证码登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #4a90e2;
      --color-primary-light: #6bb3ff;
      --color-bg: #f5f7fa;
      --color-surface: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: #f0f2f5;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-full: 999px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
    }
    body {
      background: var(--color-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }

    .phone {
      max-width: 375px;
      margin: 20px auto;
      background: var(--color-bg);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      position: relative;
      min-height: 760px;
      padding: 60px var(--space-5) var(--space-6);
    }

    .page-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-6);
    }

    .login-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--space-4);
    }

    .form-item { margin-bottom: var(--space-4); }
    .form-item:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--color-bg);
      border-radius: var(--radius-md);
      padding: 0 8px 0 var(--space-3);
      height: 52px;
    }
    .input-wrap svg {
      width: 20px; height: 20px;
      color: var(--color-text-tertiary);
      flex-shrink: 0;
    }
    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--color-text);
      outline: none;
    }
    .input-wrap input::placeholder { color: var(--color-text-tertiary); }

    .code-btn {
      flex-shrink: 0;
      height: 30px;
      padding: 0 8px;
      border-radius: var(--radius-full);
      background: transparent;
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .code-btn.disabled {
      border-color: var(--color-text-tertiary);
      color: var(--color-text-tertiary);
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(74, 144, 226, 0.3);
      margin-bottom: var(--space-4);
    }

    .switch-login {
      text-align: center;
      font-size: 14px;
      color: var(--color-text-secondary);
    }
    .switch-login span { color: var(--color-primary); font-weight: 500; cursor: pointer; }

    .agreement {
      position: absolute;
      bottom: 30px;
      left: var(--space-5);
      right: var(--space-5);
      text-align: center;
      font-size: 12px;
      color: var(--color-text-tertiary);
      line-height: 1.6;
    }
    .agreement span { color: var(--color-primary); cursor: pointer; }

    .param-bar {
      background: var(--color-surface);
      padding: var(--space-4);
      margin: var(--space-4) auto;
      max-width: 375px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="page-title">手机登录</div>
    <div class="page-subtitle">验证码将发送至您的手机号</div>

    <div class="login-card">
      <div class="form-item">
        <label class="form-label">手机号</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <input type="tel" placeholder="请输入手机号" readonly>
        </div>
      </div>

      <div class="form-item">
        <label class="form-label">验证码</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="text" placeholder="请输入验证码" readonly>
          <div class="code-btn">获取验证码</div>
        </div>
      </div>
    </div>

    <div class="login-btn">登 录</div>

    <div class="switch-login">
      也可以使用<span>账号密码登录</span>
    </div>

    <div class="agreement">
      登录即代表您同意<span>《用户协议》</span>和<span>《隐私政策》</span>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">手机号验证码登录：标题 + 手机号输入 + 验证码输入</span></div>
    <div class="param-row"><span class="param-key">code:</span><span class="param-val">输入框内嵌获取验证码按钮</span></div>
    <div class="param-row"><span class="param-key">btn:</span><span class="param-val">渐变主按钮，圆角胶囊</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">手机号优先的 App 登录</span></div>
  </div>
</body>
</html>
