<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义底部 - AI 助手分栏 TabBar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-primary: #14b8a6;
      --color-bg: #f0f9ff;
      --color-bg-surface: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #64748b;
      --color-text-tertiary: #94a3b8;
      --radius-lg: 20px;
      --radius-full: 999px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
    }
    body { background: var(--color-bg); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

    .phone { max-width: 375px; margin: 20px auto; background: var(--color-bg); border-radius: 32px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.12); position: relative; height: 700px; }

    .content {
      height: 100%;
      overflow-y: auto;
      padding: 60px var(--space-4) 120px;
    }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--color-text); }
    .page-subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: var(--space-4); }

    .chat-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .chat-card p { font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; }

    /* AI 助手分栏 TabBar */
    .tabbar-assistant {
      position: absolute;
      bottom: 24px;
      left: var(--space-4);
      right: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      z-index: 100;
    }

    /* 左侧独立 AI 助手入口 */
    .assistant-btn {
      width: 56px; height: 56px;
      border-radius: var(--radius-full);
      background: var(--color-bg-surface);
      border: 1px solid rgba(20, 184, 166, 0.2);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(20, 184, 166, 0.2);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .assistant-btn::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: var(--radius-full);
      border: 2px solid rgba(20, 184, 166, 0.15);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.15); opacity: 0; }
    }
    .assistant-btn img {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* 右侧连在一起的工具组 */
    .tool-group {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--color-bg-surface);
      border-radius: var(--radius-full);
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .tool-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0;
      border-radius: var(--radius-full);
      color: var(--color-text-secondary);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .tool-item svg { width: 20px; height: 20px; }
    .tool-item.active {
      background: rgba(20, 184, 166, 0.1);
      color: var(--color-primary);
    }

    .param-bar { background: var(--color-bg-surface); padding: var(--space-4); margin: var(--space-4) auto; max-width: 375px; border-radius: var(--radius-lg); box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .param-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <svg style="display:none" aria-hidden="true">
    <symbol id="i-smile" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2s4-2 4-2M9 9h.01M15 9h.01"/></g></symbol>
  </svg>
  <div class="phone">
    <div class="content">
      <div class="page-title">健康助手</div>
      <div class="page-subtitle">AI 随时记录你的健康数据</div>
      <div class="chat-card">
        <p>你好呀～ 我是你的健康管家 <svg class="icon icon-14 icon-warning"><use href="#i-smile"/></svg> 饮食、饮水、运动、体重、睡眠都可以随时告诉我帮你记录。</p>
      </div>
      <div class="chat-card">
        <p>今日已记录：午餐 14:11，大馒头。还有其他需要记录的吗？</p>
      </div>
    </div>

    <!-- AI 助手分栏 TabBar -->
    <div class="tabbar-assistant">
      <div class="assistant-btn">
        <img src="https://picsum.photos/seed/aiavatar/80/80" alt="AI 助手">
      </div>

      <div class="tool-group">
        <div class="tool-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>待办</span>
        </div>
        <div class="tool-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          <span>数据</span>
        </div>
        <div class="tool-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">style:</span><span class="param-val">左侧独立 AI 助手 + 右侧连体工具组</span></div>
    <div class="param-row"><span class="param-key">left:</span><span class="param-val">圆形头像按钮 + 脉冲呼吸圈</span></div>
    <div class="param-row"><span class="param-key">right:</span><span class="param-val">药丸连体容器，图标文字排列</span></div>
    <div class="param-row"><span class="param-key">use:</span><span class="param-val">AI 助手类、健康管理类 App</span></div>
  </div>
</body>
</html>
