<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --color-primary: #4a90e2;
      --color-primary-light: rgba(74, 144, 226, 0.12);
      --color-price: #ff4d4f;
      --color-text: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #f0f0f0;
      --color-tag-bg: #f5f5f5;
    }
    body { background: var(--color-bg); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); min-height: 100vh; }

    .search-header {
      background: var(--color-bg-surface);
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      border-bottom: 1px solid var(--color-border);
    }
    .back-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .back-btn img { width: 20px; height: 20px; }
    .search-box { flex: 1; height: 38px; background: var(--color-bg); border-radius: 19px; display: flex; align-items: center; padding: 0 var(--space-3); }
    .search-box img { width: 18px; height: 18px; color: var(--color-text-tertiary); }
    .search-box input { flex: 1; border: none; background: transparent; padding: 0 var(--space-2); font-size: 14px; outline: none; color: var(--color-text); }
    .search-box input::placeholder { color: var(--color-text-tertiary); }
    .clear-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .clear-btn img { width: 14px; height: 14px; }
    .search-btn { font-size: 15px; color: var(--color-primary); font-weight: 500; padding-left: var(--space-2); }

    .preview-body { padding: var(--space-3); }

    .base-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .base-card:last-child { margin-bottom: 0; }

    .card-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
    .card-title { display: flex; align-items: center; gap: var(--space-2); font-size: 15px; color: var(--color-text); font-weight: 600; }
    .card-title img { width: 18px; height: 18px; }
    .card-action { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--color-text-tertiary); }
    .card-action img { width: 16px; height: 16px; }

    .tag-list { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-3) var(--space-4) var(--space-4); }
    .tag { padding: 6px 12px; background: var(--color-tag-bg); border-radius: var(--radius-md); font-size: 13px; color: var(--color-text-secondary); }
    .tag.hot { background: var(--color-primary-light); color: var(--color-primary); }

    .history-item { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
    .history-item:last-child { border-bottom: none; }
    .history-left { display: flex; align-items: center; gap: var(--space-2); font-size: 14px; color: var(--color-text-secondary); }
    .history-left img { width: 16px; height: 16px; color: var(--color-text-tertiary); }
    .history-right { display: flex; align-items: center; gap: var(--space-2); font-size: 12px; color: var(--color-text-tertiary); }
    .history-right img { width: 14px; height: 14px; }

    .section-title { font-size: 15px; color: var(--color-text); font-weight: 600; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }

    .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); padding: var(--space-3) var(--space-4) var(--space-4); }
    .result-item { background: var(--color-bg); border-radius: var(--radius-md); overflow: hidden; }
    .result-img { width: 100%; height: 110px; background-size: cover; background-position: center; }
    .result-info { padding: var(--space-2); }
    .result-name { font-size: 13px; color: var(--color-text); font-weight: 500; line-height: 1.4; }
    .result-desc { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }
    .result-price { font-size: 14px; color: var(--color-price); font-weight: 600; margin-top: var(--space-2); }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin: var(--space-3); }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="search-header">
      <span class="back-btn"><img src="./static/icons/arrow-right.svg" alt="返回" style="transform: rotate(180deg);"></span>
      <div class="search-box">
        <img src="./static/icons/search.svg" alt="搜索">
        <input type="text" placeholder="搜索宝石、店铺、话题">
        <span class="clear-btn"><img src="./static/icons/x.svg" alt="清除"></span>
      </div>
      <span class="search-btn">搜索</span>
    </div>

    <div class="preview-body">
      <!-- 搜索历史 -->
      <div class="base-card">
        <div class="card-header">
          <span class="card-title"><img src="./static/icons/clock.svg" alt="历史">搜索历史</span>
          <span class="card-action"><img src="./static/icons/trash-2.svg" alt="清空">清空</span>
        </div>
        <div class="tag-list">
          <span class="tag">太湖石</span>
          <span class="tag">翡翠手镯</span>
          <span class="tag">玛瑙</span>
          <span class="tag">原石鉴定</span>
        </div>
      </div>

      <!-- 热门搜索 -->
      <div class="base-card">
        <div class="card-header">
          <span class="card-title"><img src="./static/icons/flame.svg" alt="热门" style="color: #ff4d4f;">热门搜索</span>
          <span class="card-action">更多</span>
        </div>
        <div class="tag-list">
          <span class="tag hot">和田玉</span>
          <span class="tag hot">碧玺</span>
          <span class="tag hot">青金石</span>
          <span class="tag">南红</span>
          <span class="tag">水晶</span>
          <span class="tag">琥珀</span>
        </div>
      </div>

      <!-- 搜索结果 -->
      <div class="base-card">
        <div class="section-title">搜索结果</div>
        <div class="result-grid">
          <div class="result-item">
            <div class="result-img" style="background-image: url(./static/images/product1.jpg);"></div>
            <div class="result-info">
              <div class="result-name">象形·太湖石</div>
              <div class="result-desc">热情奔放的骑士红</div>
              <div class="result-price">¥132.0</div>
            </div>
          </div>
          <div class="result-item">
            <div class="result-img" style="background-image: url(./static/images/product2.jpg);"></div>
            <div class="result-info">
              <div class="result-name">灵璧石摆件</div>
              <div class="result-desc">自然纹理 办公桌</div>
              <div class="result-price">¥268.0</div>
            </div>
          </div>
          <div class="result-item">
            <div class="result-img" style="background-image: url(./static/images/product3.jpg);"></div>
            <div class="result-info">
              <div class="result-name">水晶原石</div>
              <div class="result-desc">白水晶净化能量</div>
              <div class="result-price">¥89.0</div>
            </div>
          </div>
          <div class="result-item">
            <div class="result-img" style="background-image: url(./static/images/product4.jpg);"></div>
            <div class="result-info">
              <div class="result-name">玛瑙手串</div>
              <div class="result-desc">天然缠丝纹</div>
              <div class="result-price">¥156.0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="param-bar">
        <div class="param-title">base-card 参数</div>
        <div class="param-row"><span class="param-key">radius:</span><span class="param-val">var(--radius-lg) 12px</span></div>
        <div class="param-row"><span class="param-key">margin:</span><span class="param-val">var(--space-3) 12px</span></div>
        <div class="param-row"><span class="param-key">shadow:</span><span class="param-val">var(--shadow-sm)</span></div>
        <div class="param-row"><span class="param-key">variant:</span><span class="param-val">搜索栏/历史标签/结果网格</span></div>
      </div>
    </div>
  </div>
</body>
</html>
