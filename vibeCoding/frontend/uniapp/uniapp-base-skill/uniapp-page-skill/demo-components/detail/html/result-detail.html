<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结果页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --radius-lg: 12px;
      --radius-sm: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --color-primary: #4a90e2;
      --color-success: #52c41a;
      --color-error: #ff4d4f;
      --color-text: #333;
      --color-text-secondary: #999;
      --color-bg: #f5f5f5;
      --color-bg-surface: #fff;
      --color-border: #f0f0f0;
    }
    body { background: var(--color-bg); padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; background: var(--color-bg); }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; position: relative; }
    .preview-back { position: absolute; left: 12px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .icon { width: 20px; height: 20px; }
    .preview-body { padding: var(--space-3); }

    .base-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .base-card:last-child { margin-bottom: 0; }

    .result-card { padding: 48px var(--space-4); text-align: center; }
    .result-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .result-icon.success { background: var(--color-success); }
    .result-icon.error { background: var(--color-error); }
    .result-icon.empty { background: #e0e0e0; }
    .result-icon .icon { width: 40px; height: 40px; filter: brightness(0) invert(1); }
    .result-title { font-size: 20px; color: var(--color-text); font-weight: 600; margin-bottom: 8px; }
    .result-desc { font-size: 14px; color: var(--color-text-secondary); }
    .result-actions { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
    .result-btn { min-width: 120px; height: 40px; border-radius: 20px; border: 1px solid var(--color-primary); font-size: 14px; font-weight: 500; }
    .result-btn-primary { background: var(--color-primary); color: #fff; }
    .result-btn-default { background: #fff; color: var(--color-primary); }

    .recommend-header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
    .recommend-title { font-size: 15px; color: var(--color-text); font-weight: 500; padding-left: 8px; border-left: 3px solid var(--color-primary); }
    .recommend-more { font-size: 13px; color: var(--color-text-secondary); }

    .recommend-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); padding: var(--space-3) var(--space-4) var(--space-4); }
    .recommend-item { background: #f9f9f9; border-radius: var(--radius-sm); overflow: hidden; }
    .recommend-img { width: 100%; height: 110px; background: url(../static/images/product1.jpg) center/cover; }
    .recommend-info { padding: 8px; }
    .recommend-name { font-size: 13px; color: var(--color-text); font-weight: 500; }
    .recommend-desc { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
    .recommend-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .recommend-price { font-size: 14px; color: var(--color-text); font-weight: 600; }
    .recommend-buy { padding: 3px 10px; border-radius: var(--radius-sm); background: var(--color-primary); color: #fff; font-size: 11px; }

    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">
      <span class="preview-back"><img class="icon" src="../static/icons/arrow-left.svg"></span>
      支付结果
    </div>
    <div class="preview-body">
      <div class="base-card result-card">
        <div class="result-icon success">
          <img class="icon" src="../static/icons/check.svg">
        </div>
        <div class="result-title">支付成功</div>
        <div class="result-desc">您的订单已支付成功，我们会尽快为您发货</div>
        <div class="result-actions">
          <button class="result-btn result-btn-default">返回首页</button>
          <button class="result-btn result-btn-primary">查看订单</button>
        </div>
      </div>

      <div class="base-card">
        <div class="recommend-header">
          <span class="recommend-title">推荐商品</span>
          <span class="recommend-more">查看更多>></span>
        </div>
        <div class="recommend-grid">
          <div class="recommend-item">
            <div class="recommend-img"></div>
            <div class="recommend-info">
              <div class="recommend-name">象形·太湖石</div>
              <div class="recommend-desc">热情奔放的骑士红...</div>
              <div class="recommend-price-row">
                <span class="recommend-price">¥132.0</span>
                <span class="recommend-buy">购买</span>
              </div>
            </div>
          </div>
          <div class="recommend-item">
            <div class="recommend-img" style="background: url(../static/images/product2.jpg) center/cover;"></div>
            <div class="recommend-info">
              <div class="recommend-name">象形·灵璧石</div>
              <div class="recommend-desc">热情奔放的骑士红...</div>
              <div class="recommend-price-row">
                <span class="recommend-price">¥132.0</span>
                <span class="recommend-buy">购买</span>
              </div>
            </div>
          </div>
          <div class="recommend-item">
            <div class="recommend-img" style="background: url(../static/images/product3.jpg) center/cover;"></div>
            <div class="recommend-info">
              <div class="recommend-name">象形·太湖石</div>
              <div class="recommend-desc">热情奔放的骑士红...</div>
              <div class="recommend-price-row">
                <span class="recommend-price">¥132.0</span>
                <span class="recommend-buy">购买</span>
              </div>
            </div>
          </div>
          <div class="recommend-item">
            <div class="recommend-img" style="background: url(../static/images/product2.jpg) center/cover;"></div>
            <div class="recommend-info">
              <div class="recommend-name">象形·灵璧石</div>
              <div class="recommend-desc">热情奔放的骑士红...</div>
              <div class="recommend-price-row">
                <span class="recommend-price">¥132.0</span>
                <span class="recommend-buy">购买</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="param-bar">
    <div class="param-title">base-card 参数</div>
    <div class="param-row"><span class="param-key">radius:</span><span class="param-val">var(--radius-lg) 12px</span></div>
    <div class="param-row"><span class="param-key">margin:</span><span class="param-val">var(--space-3) 12px</span></div>
    <div class="param-row"><span class="param-key">shadow:</span><span class="param-val">var(--shadow-sm)</span></div>
    <div class="param-row"><span class="param-key">variant:</span><span class="param-val">success/error/empty 三种状态卡片</span></div>
  </div>
</body>
</html>
