<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空状态组件 · Vue Skill Demo</title>
  <style>
    :root {
      --color-primary: #409eff;
      --color-primary-light-9: #ecf5ff;
      --color-success: #67c23a;
      --color-warning: #e6a23c;
      --color-danger: #f56c6c;
      --color-info: #909399;
      --color-text-primary: #303133;
      --color-text-regular: #606266;
      --color-text-secondary: #909399;
      --color-text-placeholder: #c0c4cc;
      --color-border: #dcdfe6;
      --color-border-light: #e4e7ed;
      --color-bg-white: #ffffff;
      --color-bg: #f5f7fa;
      --color-bg-secondary: #f5f7fa;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-xs: 12px;
      --font-sm: 13px;
      --font-base: 14px;
      --font-lg: 16px;
      --shadow-light: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; background: var(--color-bg); color: var(--color-text-primary); line-height: 1.5; min-width: 900px; }

    .page { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 28px; margin-bottom: 8px; color: var(--color-text-primary); }
    .subtitle { color: var(--color-text-secondary); margin-bottom: 32px; font-size: var(--font-base); }

    .demo-section { margin-bottom: 40px; }
    .demo-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .demo-title { font-size: var(--font-lg); font-weight: 600; }
    .demo-tag { font-size: var(--font-xs); padding: 2px 8px; background: var(--color-primary-light-9); color: var(--color-primary); border-radius: var(--radius-sm); }
    .demo-desc { font-size: var(--font-sm); color: var(--color-text-secondary); margin-bottom: 16px; }

    .demo-card { background: var(--color-bg-white); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-light); }
    .demo-row { display: flex; gap: 24px; flex-wrap: wrap; }
    .demo-item { flex: 1; min-width: 200px; }
    .demo-label { display: block; font-size: var(--font-sm); color: var(--color-text-secondary); margin-bottom: 8px; }

    /* ===== Base Empty ===== */
    .base-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      text-align: center;
    }

    .base-empty__image {
      width: 120px;
      height: 120px;
    }

    .base-empty__icon {
      width: 100%;
      height: 100%;
    }

    .base-empty__description {
      margin-top: var(--space-3);
      color: var(--color-text-secondary);
      font-size: var(--font-base);
    }

    .base-empty__action {
      margin-top: var(--space-4);
      padding: var(--space-2) var(--space-4);
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-base);
      cursor: pointer;
    }

    .base-empty__action:hover {
      opacity: 0.9;
    }

    /* ===== Table for comparison ===== */
    .demo-table {
      width: 100%;
      border-collapse: collapse;
    }
    .demo-table th, .demo-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--color-border-light);
    }
    .demo-table th {
      background: var(--color-bg-secondary);
      font-weight: 500;
    }

    /* ===== Switch ===== */
    .demo-switch {
      display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    .switch {
      position: relative; width: 40px; height: 22px;
      background: var(--color-border); border-radius: 11px; cursor: pointer;
      transition: background 0.2s;
    }
    .switch.is-checked { background: var(--color-primary); }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch.is-checked::after { transform: translateX(18px); }
  </style>
</head>
<body>
  <div class="page">
    <h1>空状态组件</h1>
    <p class="subtitle">基于 wg-skills 规范，纯 CSS 实现</p>

    <!-- Demo 1: 基础用法 -->
    <div class="demo-section">
      <div class="demo-header">
        <span class="demo-title">基础用法</span>
        <span class="demo-tag">默认</span>
      </div>
      <p class="demo-desc">默认空状态</p>
      <div class="demo-card">
        <div class="base-empty">
          <div class="base-empty__image">
            <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
              <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
              <path d="M60 25C41.778 25 27 39.778 27 58C27 76.222 41.778 91 60 91C78.222 91 93 76.222 93 58C93 39.778 78.222 25 60 25ZM60 81C45.088 81 33 68.912 33 54C33 39.088 45.088 27 60 27C74.912 27 87 39.088 87 54C87 68.912 74.912 81 60 81Z" fill="#C0C4CC"/>
              <path d="M60 42C51.163 42 44 49.163 44 58C44 66.837 51.163 74 60 74C68.837 74 76 66.837 76 58C76 49.163 68.837 42 60 42ZM60 64C55.582 64 52 60.418 52 56C52 51.582 55.582 48 60 48C64.418 48 68 51.582 68 56C68 60.418 64.418 64 60 64Z" fill="#C0C4CC"/>
              <circle cx="60" cy="58" r="6" fill="#C0C4CC"/>
              <path d="M50 90C50 85.582 53.582 82 58 82H62C66.418 82 70 85.582 70 90" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="base-empty__description">暂无内容</p>
        </div>
      </div>
    </div>

    <!-- Demo 2: 自定义描述 -->
    <div class="demo-section">
      <div class="demo-header">
        <span class="demo-title">自定义描述</span>
      </div>
      <p class="demo-desc">自定义描述文字</p>
      <div class="demo-card">
        <div class="demo-row">
          <div class="demo-item">
            <span class="demo-label">暂无数据</span>
            <div class="base-empty">
              <div class="base-empty__image">
                <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                  <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                  <path d="M35 50h50M35 70h30" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="base-empty__description">暂无数据</p>
            </div>
          </div>
          <div class="demo-item">
            <span class="demo-label">搜索无结果</span>
            <div class="base-empty">
              <div class="base-empty__image">
                <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                  <circle cx="50" cy="50" r="25" stroke="#C0C4CC" stroke-width="4" fill="none"/>
                  <path d="M70 70l30 30" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="base-empty__description">搜索无结果</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Demo 3: 带操作按钮 -->
    <div class="demo-section">
      <div class="demo-header">
        <span class="demo-title">带操作</span>
      </div>
      <p class="demo-desc">可点击操作按钮</p>
      <div class="demo-card">
        <div class="demo-row">
          <div class="demo-item">
            <span class="demo-label">新建数据</span>
            <div class="base-empty">
              <div class="base-empty__image">
                <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                  <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                  <path d="M60 40v40M40 60h40" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="base-empty__description">暂无数据</p>
              <button class="base-empty__action" onclick="alert('点击了新建')">新建数据</button>
            </div>
          </div>
          <div class="demo-item">
            <span class="demo-label">重新加载</span>
            <div class="base-empty">
              <div class="base-empty__image">
                <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                  <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                  <path d="M60 35a25 25 0 1 1-15 5" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round" fill="none"/>
                  <path d="M60 35v15h15" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round" fill="none"/>
                </svg>
              </div>
              <p class="base-empty__description">加载失败</p>
              <button class="base-empty__action" onclick="alert('点击了重试')">重新加载</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Demo 4: 实战场景 -->
    <div class="demo-section">
      <div class="demo-header">
        <span class="demo-title">实战场景</span>
      </div>
      <p class="demo-desc">表格无数据 vs 有数据</p>
      <div class="demo-card">
        <div class="demo-switch">
          <div class="switch" id="tableSwitch" onclick="toggleTable()"></div>
          <span>切换有数据/无数据</span>
        </div>
        <div id="tableContainer">
          <!-- 空状态 -->
          <div class="base-empty">
            <div class="base-empty__image" style="width:80px;height:80px;">
              <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                <path d="M35 45h50M35 60h50M35 75h30" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="base-empty__description">暂无数据</p>
            <button class="base-empty__action">新建数据</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Demo 5: 不同尺寸 -->
    <div class="demo-section">
      <div class="demo-header">
        <span class="demo-title">不同尺寸</span>
      </div>
      <p class="demo-desc">小/中/大尺寸</p>
      <div class="demo-card">
        <div class="demo-row">
          <div class="demo-item">
            <span class="demo-label">小 (60px)</span>
            <div class="base-empty" style="padding:12px;">
              <div class="base-empty__image" style="width:60px;height:60px;">
                <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                  <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                  <path d="M35 50h50M35 70h30" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="base-empty__description" style="font-size:12px;margin-top:8px;">暂无数据</p>
            </div>
          </div>
          <div class="demo-item">
            <span class="demo-label">中 (120px)</span>
            <div class="base-empty">
              <div class="base-empty__image" style="width:120px;height:120px;">
                <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                  <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                  <path d="M35 50h50M35 70h30" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="base-empty__description">暂无数据</p>
            </div>
          </div>
          <div class="demo-item">
            <span class="demo-label">大 (180px)</span>
            <div class="base-empty">
              <div class="base-empty__image" style="width:180px;height:180px;">
                <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                  <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                  <path d="M35 50h50M35 70h30" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="base-empty__description" style="font-size:16px;">暂无数据</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 切换表格
    let hasData = false;
    function toggleTable() {
      hasData = !hasData;
      const sw = document.getElementById('tableSwitch');
      const container = document.getElementById('tableContainer');
      sw.classList.toggle('is-checked', hasData);

      if (hasData) {
        container.innerHTML = `
          <table class="demo-table">
            <thead>
              <tr>
                <th>姓名</th>
                <th>部门</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>张三</td>
                <td>技术部</td>
                <td><span style="color:#67c23a;">在职</span></td>
              </tr>
              <tr>
                <td>李四</td>
                <td>运营部</td>
                <td><span style="color:#67c23a;">在职</span></td>
              </tr>
            </tbody>
          </table>
        `;
      } else {
        container.innerHTML = `
          <div class="base-empty">
            <div class="base-empty__image" style="width:80px;height:80px;">
              <svg class="base-empty__icon" viewBox="0 0 120 120" fill="none">
                <circle cx="60" cy="60" r="50" fill="#F5F7FA"/>
                <path d="M35 45h50M35 60h50M35 75h30" stroke="#C0C4CC" stroke-width="4" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="base-empty__description">暂无数据</p>
            <button class="base-empty__action">新建数据</button>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
