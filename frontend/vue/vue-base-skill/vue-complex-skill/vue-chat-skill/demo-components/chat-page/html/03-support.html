<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>客服工单 - Vue3 Chat Skill Demo</title>
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    /* Support variant: enterprise customer service */
    :root {
      --chat-bg-primary: #fff;
      --chat-bg-secondary: #f0f2f5;
      --chat-bg-tertiary: #e8ecf0;
      --chat-text-primary: #1a1a1a;
      --chat-text-secondary: #666;
      --chat-text-muted: #999;
      --chat-border-light: #e8e8e8;
      --chat-accent-green: #1890ff;
      --chat-accent-blue: #1890ff;
      --chat-input-border: #d9d9d9;
      --chat-input-border-focus: #1890ff;
    }

    /* 侧边栏 */
    .chat-sidebar { background: #fff; border-right-color: #e8e8e8; }
    .chat-sidebar__header { border-bottom-color: #e8e8e8; }
    .chat-sidebar__new-btn {
      background: #1890ff;
      border: none;
      color: #fff;
      font-weight: 500;
    }
    .chat-sidebar__new-btn:hover { background: #40a9ff; }
    .chat-sidebar__search-input { background: #f0f2f5; border-color: #e8e8e8; }
    .chat-sidebar__search-input:focus { border-color: #1890ff; }
    .chat-sidebar__item { border-left-color: transparent; }
    .chat-sidebar__item:hover { background: #f0f2f5; }
    .chat-sidebar__item--active {
      background: #e6f4ff;
      border-left-color: #1890ff;
    }
    .chat-sidebar__item-title { color: #1a1a1a; font-weight: 500; }
    .chat-sidebar__item-badge { background: #1890ff; }
    /* 在线状态点 */
    .chat-sidebar__item-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52c41a;
      flex-shrink: 0;
      margin-top: 6px;
      margin-right: 8px;
    }

    /* 头部 - 含客户信息 */
    .chat-header {
      background: #fff;
      border-bottom-color: #e8e8e8;
    }
    .chat-header__right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header__client {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: #f0f2f5;
      border-radius: 8px;
    }
    .chat-header__client-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1890ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .chat-header__client-info {
      display: flex;
      flex-direction: column;
    }
    .chat-header__client-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .chat-header__client-tag {
      font-size: 11px;
      color: #faad14;
      font-weight: 500;
    }
    .chat-header__title { color: #1a1a1a; }
    .chat-header__model { background: #f0f2f5; color: #666; border: 1px solid #e8e8e8; }
    .chat-header__model-dot { background: #1890ff; }

    /* 消息区域 */
    .chat-messages { background: #f0f2f5; }

    /* 系统消息 */
    .chat-message__system-text {
      background: #e6f4ff;
      color: #1890ff;
      border: 1px solid #91caff;
    }

    /* 用户消息 - 蓝色气泡 */
    .chat-message__bubble--user {
      background: #1890ff;
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      padding: 14px 20px;
    }
    .chat-message__time { color: rgba(255,255,255,0.7); }

    /* 助手消息 - 蓝色左边框 */
    .chat-message--assistant {
      background: #fff;
      border: none;
      border-left: 3px solid #1890ff;
      box-shadow: 0 1px 0 #e8e8e8;
      border-radius: 8px;
      padding: 16px 20px;
      max-width: 75%;
    }
    .chat-message__avatar { color: #1890ff; }
    .chat-message__content { color: #1a1a1a; }

    /* 内联代码 */
    .chat-inline-code {
      background: #e6f4ff;
      color: #1890ff;
      border: none;
    }

    /* 代码块 */
    .chat-code-block { background: #1e1e1e; border: none; border-radius: 8px; }
    .chat-code-block__header { background: #2d2d2d; border-bottom: none; }
    .chat-code-block__lang { color: #9ca3af; }
    .chat-code-block__copy { color: #1890ff; }
    .chat-code-block__pre { color: #d4d4d4; }

    /* 输入区 */
    .chat-input-area {
      background: #fff;
      border-top-color: #e8e8e8;
      padding-bottom: 12px;
    }
    .chat-input-area__wrapper {
      border-color: #d9d9d9;
      border-radius: 8px;
    }
    .chat-input-area__wrapper:focus-within {
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
    }
    .chat-input-area__textarea { color: #1a1a1a; }
    .chat-input-area__send-btn { background: #1890ff; border-radius: 6px; }
    .chat-input-area__send-btn:hover { background: #40a9ff; }

    /* 快捷回复 */
    .chat-quick-replies {
      display: flex;
      gap: 8px;
      padding: 10px 0 4px;
    }
    .chat-quick-reply {
      padding: 6px 16px;
      border: 1px solid #d9d9d9;
      border-radius: 999px;
      background: #fff;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .chat-quick-reply:hover {
      border-color: #1890ff;
      color: #1890ff;
      background: #e6f4ff;
    }

    /* 状态栏 */
    .chat-status-bar {
      background: #fff;
      border-top-color: #e8e8e8;
      color: #999;
    }
    .chat-status-bar__dot { background: #52c41a; }
  </style>
</head>
<body>
  <div class="chat-page chat-page--support">
    <aside class="chat-sidebar">
      <div class="chat-sidebar__header">
        <div class="chat-sidebar__new-btn">+ 新工单</div>
      </div>
      <div class="chat-sidebar__search">
        <div class="chat-sidebar__search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <input class="chat-sidebar__search-input" placeholder="搜索工单..." />
      </div>
      <div class="chat-sidebar__list" id="sidebar-list"></div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <div class="chat-header__left">
          <div class="chat-header__title" id="header-title">Vue3 组件设计</div>
          <div class="chat-header__model">
            <span class="chat-header__model-dot"></span>
            <span>Claude Sonnet</span>
          </div>
        </div>
        <div class="chat-header__right">
          <div class="chat-header__client">
            <div class="chat-header__client-avatar">张</div>
            <div class="chat-header__client-info">
              <span class="chat-header__client-name">张明</span>
              <span class="chat-header__client-tag">VIP 客户</span>
            </div>
          </div>
        </div>
      </header>

      <div class="chat-messages" id="messages"></div>

      <div class="chat-input-area">
        <div class="chat-input-area__wrapper">
          <div class="chat-input-area__attach">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </div>
          <textarea class="chat-input-area__textarea" placeholder="输入回复..." rows="1"></textarea>
          <div class="chat-input-area__send-btn">发送</div>
        </div>
        <div class="chat-quick-replies">
          <button class="chat-quick-reply">您好，请问有什么可以帮您？</button>
          <button class="chat-quick-reply">请稍等，正在为您处理</button>
          <button class="chat-quick-reply">问题已解决，还有其他需要吗？</button>
        </div>
      </div>

      <div class="chat-status-bar">
        <div class="chat-status-bar__connection">
          <span class="chat-status-bar__dot"></span>
          <span>connected</span>
        </div>
        <span class="chat-status-bar__divider">|</span>
        <span>Tokens: 2,847</span>
        <span class="chat-status-bar__divider">|</span>
        <span>延迟: 128ms</span>
      </div>
    </main>
  </div>

  <script>
    const conversations = [
      { id: '1', title: 'Vue3 组件设计', lastMessage: 'Composition API 最佳实践...', timestamp: '10:30', unread: 2 },
      { id: '2', title: 'Python 部署问题', lastMessage: 'Docker 容器配置优化...', timestamp: '昨天' },
      { id: '3', title: '数据库索引优化', lastMessage: '复合索引 vs 单列索引...', timestamp: '昨天' },
      { id: '4', title: 'CSS Grid 布局', lastMessage: '如何实现响应式网格...', timestamp: '3天前' },
      { id: '5', title: 'Git 分支管理', lastMessage: 'Rebase vs Merge 策略...', timestamp: '1周前' },
    ]

    const messages = [
      { id: 'm1', role: 'system', content: '对话已开始，使用 Claude Sonnet 模型', timestamp: '' },
      { id: 'm2', role: 'user', content: '帮我设计一个 Vue3 的可复用表格组件，需要支持排序、筛选、分页', timestamp: '10:15' },
      { id: 'm3', role: 'assistant', content: '好的，我来设计一个高性能的表格组件。核心思路是使用 Composition API 将排序、筛选、分页逻辑抽离成独立的 composable。\n\n首先定义类型接口：', timestamp: '10:16', code: 'interface TableColumn {\n  key: string\n  title: string\n  sortable?: boolean\n  filterable?: boolean\n  width?: number | string\n  render?: (row: any) => VNode\n}\n\ninterface TableProps {\n  columns: TableColumn[]\n  dataSource: any[]\n  pagination?: { page: number; pageSize: number; total: number }\n  loading?: boolean\n}', language: 'TypeScript' },
      { id: 'm4', role: 'user', content: '很好，分页逻辑怎么处理？后端分页和前端分页能统一吗？', timestamp: '10:20' },
      { id: 'm5', role: 'assistant', content: '可以统一。通过 `usePagination` composable 抽象分页逻辑，支持两种模式：\n\n**前端分页**：数据一次性加载，在内存中切片\n**后端分页**：每次翻页触发 API 请求\n\n关键在于通过 `mode` 参数切换行为，对外暴露统一的 `currentPage`、`pageSize`、`totalPages` 状态。', timestamp: '10:22', code: 'function usePagination(options) {\n  const currentPage = ref(1)\n  const pageSize = ref(options.pageSize ?? 10)\n  \n  const paginatedData = computed(() => {\n    if (options.mode === "server") return options.data\n    const start = (currentPage.value - 1) * pageSize.value\n    return options.data.slice(start, start + pageSize.value)\n  })\n  \n  return { currentPage, pageSize, paginatedData, totalPages }\n}', language: 'TypeScript' },
    ]

    function renderSidebar() {
      const list = document.getElementById('sidebar-list')
      list.innerHTML = conversations.map(c => `
        <div class="chat-sidebar__item${c.id === '1' ? ' chat-sidebar__item--active' : ''}" data-id="${c.id}">
          <div class="chat-sidebar__item-dot"></div>
          <div class="chat-sidebar__item-content">
            <div class="chat-sidebar__item-title">${c.title}</div>
            <div class="chat-sidebar__item-preview">${c.lastMessage}</div>
          </div>
          <div class="chat-sidebar__item-meta">
            <span class="chat-sidebar__item-time">${c.timestamp}</span>
            ${c.unread ? `<span class="chat-sidebar__item-badge">${c.unread}</span>` : ''}
          </div>
        </div>
      `).join('')
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    function formatContent(content) {
      return escapeHtml(content)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<span class="chat-inline-code">$1</span>')
        .replace(/\n/g, '<br>')
    }

    function renderCodeBlock(code, language) {
      return `
        <div class="chat-code-block">
          <div class="chat-code-block__header">
            <span class="chat-code-block__lang">${language || ''}</span>
            <button class="chat-code-block__copy" onclick="this.textContent='已复制';setTimeout(()=>this.textContent='复制',1500)">复制</button>
          </div>
          <pre class="chat-code-block__pre"><code>${escapeHtml(code)}</code></pre>
        </div>
      `
    }

    function renderMessages() {
      const container = document.getElementById('messages')
      container.innerHTML = messages.map(m => {
        if (m.role === 'system') {
          return `<div class="chat-message--system"><span class="chat-message__system-text">${m.content}</span></div>`
        }
        if (m.role === 'user') {
          return `
            <div class="chat-message--user">
              <div class="chat-message__bubble--user">
                <div class="chat-message__content">${formatContent(m.content)}</div>
                ${m.timestamp ? `<div class="chat-message__time">${m.timestamp}</div>` : ''}
              </div>
            </div>
          `
        }
        return `
          <div class="chat-message--assistant">
            <div class="chat-message__avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg></div>
            <div class="chat-message__body">
              <div class="chat-message__content">${formatContent(m.content)}</div>
              ${m.code ? renderCodeBlock(m.code, m.language) : ''}
              ${m.timestamp ? `<div class="chat-message__time">${m.timestamp}</div>` : ''}
            </div>
          </div>
        `
      }).join('')
      container.scrollTop = container.scrollHeight
    }

    renderSidebar()
    renderMessages()
  </script>
</body>
</html>
