<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Login / 03 - 3D 翻转风格</title>
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    .login-page--flip {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    /* 3D 翻转容器 */
    .flip-container {
      width: 420px;
      height: 520px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flip-container.flipped {
      transform: rotateY(180deg);
    }

    /* 正反面 */
    .flip-front,
    .flip-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 24px;
      padding: 48px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    /* 标题 */
    .flip-title {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 8px;
    }

    .flip-subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 32px;
    }

    /* 表单 */
    .flip-form .login-form__group {
      margin-bottom: 20px;
    }

    .flip-form .login-form__label {
      color: #333;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .flip-form .login-input {
      background: #f5f7fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px 16px;
      color: #1a1a2e;
      font-size: 14px;
      width: 100%;
      transition: all 0.3s;
    }

    .flip-form .login-input:focus {
      border-color: #6366f1;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .flip-form .login-button {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      height: 44px;
      width: 100%;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .flip-form .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    /* 翻转按钮 */
    .flip-trigger {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #6366f1;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
    }

    .flip-trigger:hover {
      text-decoration: underline;
    }

    /* 装饰 */
    .flip-decoration {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      top: -80px;
      right: -80px;
    }

    .flip-decoration--2 {
      top: auto;
      right: auto;
      bottom: -60px;
      left: -60px;
      width: 150px;
      height: 150px;
    }
  </style>
</head>
<body>
  <div class="login-page login-page--flip">
    <!-- 装饰 -->
    <div class="flip-decoration"></div>
    <div class="flip-decoration flip-decoration--2"></div>

    <!-- 翻转容器 -->
    <div class="flip-container" id="flipContainer">
      <!-- 正面：登录 -->
      <div class="flip-front">
        <h2 class="flip-title">欢迎回来</h2>
        <p class="flip-subtitle">登录以继续访问</p>

        <form class="flip-form" onsubmit="return handleSubmit(event)">
          <div class="login-form__group">
            <label class="login-form__label">邮箱</label>
            <input type="email" class="login-input" placeholder="请输入邮箱" required />
          </div>

          <div class="login-form__group">
            <label class="login-form__label">密码</label>
            <input type="password" class="login-input" placeholder="请输入密码" required />
          </div>

          <button type="submit" class="login-button">登录</button>
        </form>

        <button class="flip-trigger" onclick="flipCard()">
          没有账号？立即注册 →
        </button>
      </div>

      <!-- 背面：注册 -->
      <div class="flip-back">
        <h2 class="flip-title">创建账号</h2>
        <p class="flip-subtitle">注册以开始使用</p>

        <form class="flip-form" onsubmit="return handleRegister(event)">
          <div class="login-form__group">
            <label class="login-form__label">用户名</label>
            <input type="text" class="login-input" placeholder="请输入用户名" required />
          </div>

          <div class="login-form__group">
            <label class="login-form__label">邮箱</label>
            <input type="email" class="login-input" placeholder="请输入邮箱" required />
          </div>

          <div class="login-form__group">
            <label class="login-form__label">密码</label>
            <input type="password" class="login-input" placeholder="请输入密码" required />
          </div>

          <button type="submit" class="login-button">注册</button>
        </form>

        <button class="flip-trigger" onclick="flipCard()">
          ← 已有账号？返回登录
        </button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('flipContainer')

    function flipCard() {
      container.classList.toggle('flipped')
    }

    function handleSubmit(e) {
      e.preventDefault()
      alert('登录成功！（Demo）')
      return false
    }

    function handleRegister(e) {
      e.preventDefault()
      alert('注册成功！（Demo）')
      return false
    }
  </script>
</body>
</html>
