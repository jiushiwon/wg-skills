<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Login / 09 - 品牌分屏（全屏布局）</title>
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 全屏布局 */
    .login-page--split-pro {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 左侧：品牌区（占 55%）*/
    .brand-side {
      width: 55%;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a3e 0%, #2d1f5f 50%, #3d2e6e 100%);
      padding: 56px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    /* 装饰光晕 */
    .brand-side::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 80, 220, 0.4) 0%, transparent 70%);
      top: -200px;
      right: -200px;
      pointer-events: none;
    }

    .brand-side::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80, 50, 180, 0.3) 0%, transparent 70%);
      bottom: -150px;
      left: -100px;
      pointer-events: none;
    }

    /* Logo */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }

    .brand-logo__icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* 主标题 */
    .brand-hero {
      position: relative;
      z-index: 2;
      max-width: 520px;
    }

    .brand-hero__title {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .brand-hero__subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }

    /* 功能列表 */
    .brand-features {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 480px;
    }

    .feature-row {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.9);
    }

    .feature-row__icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-row__icon svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
    }

    /* 右侧：登录区（占 45%，全屏白色）*/
    .form-side {
      width: 45%;
      height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      overflow-y: auto;
    }

    /* 登录表单容器 */
    .login-container {
      width: 100%;
      max-width: 400px;
    }

    /* 标题 */
    .pro-title {
      font-size: 28px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .pro-subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 36px;
    }

    /* 表单 */
    .pro-form .login-form__group {
      margin-bottom: 20px;
    }

    .pro-input-wrap {
      position: relative;
    }

    .pro-input-wrap__icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #9ca3af;
      fill: none;
      stroke-width: 1.8;
    }

    .pro-input-wrap__toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      width: 22px;
      height: 22px;
      padding: 0;
    }

    .pro-input-wrap__toggle svg {
      width: 18px;
      height: 18px;
      stroke: #9ca3af;
      fill: none;
      stroke-width: 1.8;
    }

    .pro-input {
      height: 52px;
      width: 100%;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 0 16px 0 44px;
      font-size: 15px;
      color: #1a1a2e;
      transition: all 0.2s;
      outline: none;
    }

    .pro-input:focus {
      background: #fff;
      border-color: #c08766;
      box-shadow: 0 0 0 3px rgba(192, 135, 102, 0.1);
    }

    .pro-input::placeholder {
      color: #9ca3af;
    }

    /* 验证码行 */
    .pro-captcha-row {
      display: flex;
      gap: 12px;
    }

    .pro-captcha-row .pro-input-wrap {
      flex: 1;
    }

    .pro-captcha-box {
      width: 130px;
      height: 52px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 500;
      color: #c08766;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .pro-captcha-box:hover {
      background: #fff;
      border-color: #c08766;
    }

    /* 登录按钮 */
    .pro-button {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #c08766 0%, #a87154 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .pro-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(192, 135, 102, 0.3);
    }

    /* 底部注册 */
    .pro-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: #6b7280;
    }

    .pro-footer a {
      color: #c08766;
      text-decoration: none;
      font-weight: 500;
      margin-left: 6px;
    }

    .pro-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-page login-page--split-pro">
    <!-- 左侧：品牌区（全屏） -->
    <div class="brand-side">
      <!-- Logo -->
      <div class="brand-logo">
        <div class="brand-logo__icon">M</div>
        <span>考拉写作</span>
      </div>

      <!-- 主标题 -->
      <div class="brand-hero">
        <h1 class="brand-hero__title">AI 助力，写小说也能赚钱</h1>
        <p class="brand-hero__subtitle">从灵感到成稿，一站式 AI 创作工作台</p>
      </div>

      <!-- 功能列表 -->
      <div class="brand-features">
        <div class="feature-row">
          <span class="feature-row__icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg>
          </span>
          <span>7 幕结构短篇一键生成</span>
        </div>
        <div class="feature-row">
          <span class="feature-row__icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg>
          </span>
          <span>AI 润色 / 扩写 / 续写 / 去 AI 味</span>
        </div>
        <div class="feature-row">
          <span class="feature-row__icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg>
          </span>
          <span>多平台稿费参考与投稿建议</span>
        </div>
        <div class="feature-row">
          <span class="feature-row__icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg>
          </span>
          <span>素材库 / 角色一致性 / 模拟审稿</span>
        </div>
      </div>
    </div>

    <!-- 右侧：登录区（全屏白色） -->
    <div class="form-side">
      <div class="login-container">
        <h2 class="pro-title">欢迎回来</h2>
        <p class="pro-subtitle">登录考拉写作，开启 AI 创作之旅</p>

        <form class="pro-form" onsubmit="return handleSubmit(event)">
          <!-- 用户名 -->
          <div class="login-form__group">
            <div class="pro-input-wrap">
              <svg class="pro-input-wrap__icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>
              </svg>
              <input type="text" class="pro-input" placeholder="用户名 / 邮箱" required />
            </div>
          </div>

          <!-- 密码 -->
          <div class="login-form__group">
            <div class="pro-input-wrap">
              <svg class="pro-input-wrap__icon" viewBox="0 0 24 24">
                <rect x="4" y="11" width="16" height="10" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
              <input type="password" class="pro-input" id="passwordInput" placeholder="密码" required />
              <button type="button" class="pro-input-wrap__toggle" onclick="togglePassword()">
                <svg viewBox="0 0 24 24">
                  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 验证码 -->
          <div class="login-form__group">
            <div class="pro-captcha-row">
              <div class="pro-input-wrap">
                <svg class="pro-input-wrap__icon" viewBox="0 0 24 24">
                  <path d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/>
                </svg>
                <input type="text" class="pro-input" placeholder="验证码" required />
              </div>
              <div class="pro-captcha-box" onclick="refreshCaptcha()" title="点击刷新">5 × 9 = ?</div>
            </div>
          </div>

          <button type="submit" class="pro-button">登 录</button>
        </form>

        <p class="pro-footer">
          还没有账号?<a href="#">立即注册</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // 密码显示/隐藏
    function togglePassword() {
      const input = document.getElementById('passwordInput')
      input.type = input.type === 'password' ? 'text' : 'password'
    }

    // 验证码刷新（演示）
    function refreshCaptcha() {
      const ops = ['+', '-', '×']
      const op = ops[Math.floor(Math.random() * ops.length)]
      const a = Math.floor(Math.random() * 9) + 1
      const b = Math.floor(Math.random() * 9) + 1
      document.querySelector('.pro-captcha-box').textContent = `${a} ${op} ${b} = ?`
    }

    function handleSubmit(e) {
      e.preventDefault()
      alert('登录成功！（Demo）')
      return false
    }
  </script>
</body>
</html>
