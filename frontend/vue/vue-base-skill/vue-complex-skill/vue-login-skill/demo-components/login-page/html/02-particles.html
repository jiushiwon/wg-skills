<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Login / 02 - 粒子背景登录</title>
  <link rel="stylesheet" href="../../shared/demo.css" />
  <style>
    .login-page--particles {
      background: #0f0f1a;
      position: relative;
    }

    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .login-card--particles {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px;
      width: 420px;
      position: relative;
      z-index: 10;
    }

    .login-card--particles .login-title {
      color: #fff;
    }

    .login-card--particles .login-subtitle {
      color: rgba(255, 255, 255, 0.6);
    }

    .login-card--particles .login-form__label {
      color: rgba(255, 255, 255, 0.8);
    }

    .login-card--particles .login-input {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .login-card--particles .login-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .login-card--particles .login-input:focus {
      border-color: var(--login-brand-primary);
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.2);
    }

    .login-card--particles .login-button {
      background: var(--login-brand-primary);
      box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
    }

    .login-card--particles .login-button:hover {
      background: var(--login-brand-primary-light);
      box-shadow: 0 6px 16px rgba(64, 158, 255, 0.4);
    }

    .login-card--particles .login-links a {
      color: var(--login-brand-primary);
    }

    .login-card--particles .login-links span {
      color: rgba(255, 255, 255, 0.3);
    }

    .login-card--particles .social-login__btn {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .login-card--particles .social-login__btn:hover {
      background: var(--login-brand-primary);
      border-color: var(--login-brand-primary);
    }
  </style>
</head>
<body>
  <div class="login-page login-page--particles">
    <!-- 粒子背景 -->
    <canvas id="particle-canvas"></canvas>

    <!-- 登录卡片 -->
    <div class="login-card--particles">
      <div class="login-header">
        <h1 class="login-title">欢迎回来</h1>
        <p class="login-subtitle">请登录您的账户</p>
      </div>

      <form class="login-form" onsubmit="return handleSubmit(event)">
        <div class="login-form__group">
          <label class="login-form__label">邮箱地址</label>
          <input type="email" class="login-input" placeholder="请输入邮箱" required />
        </div>

        <div class="login-form__group">
          <label class="login-form__label">密码</label>
          <input type="password" class="login-input" placeholder="请输入密码" required />
        </div>

        <button type="submit" class="login-button">登 录</button>
      </form>

      <div class="login-divider">或</div>

      <div class="social-login">
        <button class="social-login__btn" title="微信登录">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05a6.127 6.127 0 0 1-.233-1.686c0-3.526 3.24-6.39 7.237-6.39.245 0 .485.017.724.041C16.486 4.328 12.899 2.188 8.691 2.188zm-2.43 4.22a1.09 1.09 0 1 1 0 2.18 1.09 1.09 0 0 1 0-2.18zm4.86 0a1.09 1.09 0 1 1 0 2.18 1.09 1.09 0 0 1 0-2.18zm4.357 3.18c-3.585 0-6.5 2.512-6.5 5.607 0 3.095 2.915 5.607 6.5 5.607.725 0 1.425-.107 2.084-.3a.67.67 0 0 1 .557.076l1.48.866a.253.253 0 0 0 .13.042.228.228 0 0 0 .226-.228c0-.056-.022-.11-.037-.165l-.304-1.152a.458.458 0 0 1 .166-.517C21.617 17.866 22.5 16.25 22.5 14.603c0-3.095-2.915-5.607-6.5-5.607h-.522zm-2.43 3.094a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7zm4.86 0a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7z"/>
          </svg>
        </button>
        <button class="social-login__btn" title="GitHub 登录">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
          </svg>
        </button>
        <button class="social-login__btn" title="Google 登录">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
          </svg>
        </button>
      </div>

      <div class="login-links">
        <a href="#">注册账户</a>
        <span>|</span>
        <a href="#">手机号登录</a>
      </div>
    </div>
  </div>

  <script src="../../shared/particles.js"></script>
  <script>
    // 初始化粒子背景
    const canvas = document.getElementById('particle-canvas')
    new ParticleBackground(canvas, {
      particleCount: 100,
      connectionDistance: 120,
      color: '#409eff',
      speed: 0.8
    })

    function handleSubmit(e) {
      e.preventDefault()
      alert('登录成功！（Demo）')
      return false
    }
  </script>
</body>
</html>
