<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>移动端灵感编辑器 · Vue Skill Demo</title>
  <style>
    :root{--ink:#20273a;--muted:#85899a;--paper:#f6f0e7;--card:#fffdf9;--line:#e9dfd1;--blue:#2555e9;--soft:#edf1ff}*{box-sizing:border-box}body{margin:0;background:#e6e0d8;color:var(--ink);font-family:Inter,"PingFang SC",sans-serif}.phone{width:min(100%,430px);min-height:100vh;margin:0 auto;padding:20px 17px 28px;background:radial-gradient(circle at 85% 8%,#fffdf7,transparent 30%),var(--paper)}.top{display:flex;align-items:center;justify-content:space-between}.round{display:grid;place-items:center;width:39px;height:39px;border:0;border-radius:50%;background:#fffaf2;color:#3e4351;font-size:18px;box-shadow:0 5px 18px #8b7e6820;cursor:pointer}.tabs{display:flex;gap:7px}.tabs i{width:38px;height:8px;border-radius:9px;background:#ded8cf}.tabs i.active{background:var(--blue)}h1{margin:25px 0 4px;font-size:25px;letter-spacing:-.5px}.lead{color:var(--muted);font-size:13px}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:21px}.piece{position:relative;min-height:177px;overflow:hidden;border:0;border-radius:17px;background:#ded4c7;box-shadow:0 8px 20px #675b4f13}.piece.tall{min-height:205px}.piece.one{background:linear-gradient(145deg,#87715a,#d7b38f 36%,#426187 37%,#193858)}.piece.two{background:radial-gradient(circle at 68% 21%,#fa8f73 0 24%,transparent 25%),linear-gradient(145deg,#d7bdaf,#f5dfcd 45%,#8472ae)}.piece.three{background:linear-gradient(130deg,#c8b39c,#f3eadc 46%,#926944)}.piece.four{background:linear-gradient(130deg,#152e55,#f5e7cf 49%,#ec8875)}.piece:after{content:'•••';position:absolute;right:10px;top:9px;padding:4px 8px;border-radius:99px;color:#384053;background:#fffdf9dc;letter-spacing:1px;font-size:12px}.pick{position:absolute;left:10px;bottom:10px;width:58px;height:6px;border-radius:8px;background:#fff9ed;box-shadow:27px 0 #d8d4cd}.strip{display:flex;gap:8px;overflow:auto;margin-top:12px;padding-bottom:2px}.thumb{flex:0 0 49px;height:49px;border:2px solid transparent;border-radius:11px;background:#ddd4c5}.thumb.active{border-color:var(--blue);box-shadow:0 0 0 2px #ffffff}.thumb:nth-child(1){background:#285078}.thumb:nth-child(2){background:#ddc7b2}.thumb:nth-child(3){background:#9d83b4}.thumb:nth-child(4){background:#bc9b77}.thumb:nth-child(5){background:#ec998b}.composer{margin-top:23px;padding:15px;border:1px solid #e8ddcf;border-radius:20px;background:#fffdf9;box-shadow:0 12px 30px #705f4514}.compose-head{display:flex;align-items:center;justify-content:space-between}.compose-head b{font-size:14px}.style-row{display:flex;gap:7px;overflow:auto;margin-top:12px}.style{flex:0 0 auto;padding:8px 10px;border:1px solid #e6dfd5;border-radius:99px;color:#6e7280;background:#fffdf9;font-size:11px;cursor:pointer}.style.active{border-color:#8da7ff;color:#244fd8;background:var(--soft)}textarea{width:100%;height:73px;margin-top:12px;padding:0;border:0;outline:0;resize:none;color:var(--ink);background:transparent;font:13px/1.65 inherit}.tools{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f0e8dc;padding-top:12px}.toolset{display:flex;gap:8px}.tool{width:32px;height:32px;border:0;border-radius:50%;color:#495064;background:#f5f0e8;cursor:pointer}.generate{padding:11px 17px;border:0;border-radius:99px;color:#fff;background:linear-gradient(135deg,#1d48d9,#2766ff);font:700 12px inherit;box-shadow:0 8px 16px #2359e240;cursor:pointer}.generate:disabled{opacity:.6}.status{display:none;margin-top:10px;color:#3157d6;font-size:11px}.status.show{display:block}.bottom{display:flex;justify-content:space-around;margin-top:20px;color:#8d8c91;font-size:10px}.bottom span{display:grid;gap:4px;justify-items:center}.bottom span.active{color:#244fd8}@media(min-width:650px){.phone{margin:25px auto;min-height:820px;border-radius:28px;box-shadow:0 30px 80px #493a2b35}}
  </style>
</head>
<body><div class="phone"><div class="top"><button class="round">☰</button><div class="tabs"><i class="active"></i><i></i><i></i></div><button class="round">⌕</button></div><h1>编辑灵感板</h1><div class="lead">收集画面，再用一句话推进它。</div><section class="board"><div class="piece tall one"><i class="pick"></i></div><div class="piece tall two"><i class="pick"></i></div><div class="piece three"><i class="pick"></i></div><div class="piece four"><i class="pick"></i></div></section><div class="strip"><div class="thumb active"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div></div><section class="composer"><div class="compose-head"><b>把这些画面串起来</b><button id="reset" class="round">↺</button></div><div class="style-row"><button class="style active">编辑感</button><button class="style">柔和颗粒</button><button class="style">暖色底片</button></div><textarea id="prompt">在地中海午后，把自然纹理、暖色纸张和安静的生活方式组合成一组品牌故事。</textarea><div class="tools"><div class="toolset"><button class="tool">☷</button><button class="tool">▧</button><button class="tool">＋</button></div><button id="generate" class="generate">✦ 生成灵感</button></div><div id="status" class="status">正在从灵感板提取材质、色彩和情绪…</div></section><nav class="bottom"><span class="active">◉<b>灵感</b></span><span>▣<b>创作</b></span><span>♡<b>收藏</b></span><span>☻<b>我的</b></span></nav></div><script>const styles=[...document.querySelectorAll('.style')],thumbs=[...document.querySelectorAll('.thumb')],button=document.querySelector('#generate'),status=document.querySelector('#status'),defaultPrompt='在地中海午后，把自然纹理、暖色纸张和安静的生活方式组合成一组品牌故事。';styles.forEach(x=>x.onclick=()=>{styles.forEach(y=>y.classList.remove('active'));x.classList.add('active')});thumbs.forEach(x=>x.onclick=()=>{thumbs.forEach(y=>y.classList.remove('active'));x.classList.add('active')});button.onclick=()=>{button.disabled=true;button.textContent='正在生成';status.classList.add('show');setTimeout(()=>{button.disabled=false;button.textContent='✦ 再次生成';status.classList.remove('show')},900)};document.querySelector('#reset').onclick=()=>{document.querySelector('#prompt').value=defaultPrompt;styles.forEach((x,i)=>x.classList.toggle('active',i===0));thumbs.forEach((x,i)=>x.classList.toggle('active',i===0))}</script></body>
</html>
