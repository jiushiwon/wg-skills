<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大图卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* 主题变量 - 来自 uniapp-style-skill */
      --color-primary: #07c160;
      --bg-card: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --radius-md: 12px;
      --space-8: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    }
    body { background: #f0f0f0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .preview { max-width: 375px; margin: 0 auto; }
    .preview-header { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 500; }
    .preview-body { padding: 16px; }
    .card { background: #fff; border-radius: var(--radius-md); box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
    .card-cover { width: 100%; height: 200px; object-fit: cover; display: block; background: #eee; }
    .card-body { padding: 12px 16px 16px; }
    .card-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .card-desc { display: block; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f5f5f5; }
    .card-time { font-size: 12px; color: var(--text-tertiary); }
    .card-action { font-size: 13px; color: var(--color-primary); }
    .param-bar { background: #f7f7f7; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .param-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .param-row { display: flex; font-size: 12px; margin-bottom: 4px; }
    .param-key { color: var(--color-primary); width: 90px; }
    .param-val { color: #666; }

    /* Demo 标题（phone shell 底部、param-bar 顶部） */
    .case-title {
      max-width: 375px;
      margin: 16px auto 8px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .case-title-desc {
      max-width: 375px;
      margin: 0 auto 8px;
      padding: 0 20px;
      font-size: 12px;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-header">大图卡片</div>
    <div class="preview-body">
      <div class="card">
        <img class="card-cover" src="https://api.iconify.design/mdi:image-area.svg?color=%23b0bec5" alt="封面">
        <div class="card-body">
          <div class="card-title">城市周末徒步路线</div>
          <span class="card-desc">沿江 8 公里轻徒步，途经三处观景平台，适合新手入门。</span>
          <div class="card-footer">
            <span class="card-time">2 小时前</span>
            <span class="card-action">查看详情</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="case-title">card-image</div>
  <div class="case-title-desc">大图卡片 · 封面 + 标题 + 描述 + 底部操作栏</div>

  <div class="param-bar">
    <div class="param-title">参数</div>
    <div class="param-row"><span class="param-key">cover:</span><span class="param-val">string</span></div>
    <div class="param-row"><span class="param-key">showAction:</span><span class="param-val">true / false</span></div>
    <div class="param-row"><span class="param-key">action:</span><span class="param-val">string</span></div>
  </div>
</body>
</html>
